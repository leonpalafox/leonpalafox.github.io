  }
  #swd-us-elections-all * { box-sizing: border-box; }
  #swd-us-elections-all .swd-tabs {

    border-bottom: 1px solid #E5E7EB;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  #swd-us-elections-all .swd-tab {
    background: none;
    border: none;
    border-bottom: 2.5px solid transparent;
    padding: 6px 2px 9px;
    margin-bottom: -1px;
    font-size: 13.5px;
    font-weight: 500;
    color: #6B7280;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease;
    font-family: inherit;
  }
  #swd-us-elections-all .swd-tab:hover { color: #1F2937; }
  #swd-us-elections-all .swd-tab.active {
    color: #1F2937;
    font-weight: 700;
    border-bottom-color: #1B5E91;
  }
  #swd-us-elections-all .swd-title {
    margin: 0 0 6px 0;
    font-size: clamp(19px, 2.3vw, 24px);
    line-height: 1.25;
    font-weight: 700;
    letter-spacing: -0.015em;
    color: #1F2937;
  }
  #swd-us-elections-all .swd-subtitle {

    font-size: clamp(12.5px, 1.35vw, 14px);
    line-height: 1.45;
    color: #4B5563;
  }
  #swd-us-elections-all .swd-bar-wrap {
    position: relative;
    margin: 6px 0 14px;
    padding-top: 20px;
    padding-bottom: 16px;
  }
  #swd-us-elections-all .swd-bar {
    display: flex;
    width: 100%;
    height: 28px;
    border-radius: 3px;
    overflow: visible;
    position: relative;
  }
  #swd-us-elections-all .swd-seg {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    border-right: 2px solid #FFFFFF;
    font-size: 13px;
    font-weight: 700;
    transition: width 0.25s ease;
  }
  #swd-us-elections-all .swd-seg:last-child { border-right: none; }
  #swd-us-elections-all .swd-seg-top {
    position: absolute;
    top: -19px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: 11.5px;
    font-weight: 500;
  }
  #swd-us-elections-all .swd-seg-top.bold { font-weight: 700; }

    width: 0;

    pointer-events: none;
    z-index: 4;

    bottom: -20px;
    transform: translateX(-50%);
    font-size: 11px;
    font-weight: 700;
    color: #1F2937;
    white-space: nowrap;
  }
  #swd-us-elections-all .swd-map-wrap {
    position: relative;
    width: 100%;
  }
  #swd-us-elections-all svg.swd-svg {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
  }
  #swd-us-elections-all .state-path {
    stroke: #FFFFFF;
    stroke-width: 1.05;
    stroke-linejoin: round;
    cursor: pointer;
    transition: opacity 0.12s ease, stroke-width 0.12s ease, filter 0.12s ease;
  }
  #swd-us-elections-all .state-path.hovered {
    stroke: #1F2937;
    stroke-width: 2.1;
    filter: brightness(0.95);
  }
  #swd-us-elections-all .pill-group { cursor: pointer; }
  #swd-us-elections-all .pill-group.hovered rect {
    stroke: #1F2937;
    stroke-width: 1.6;
  }
  #swd-us-elections-all .state-label {
    pointer-events: none;
    text-anchor: middle;
    dominant-baseline: central;
    user-select: none;
  }
  #swd-us-elections-all .leader-line {
    stroke: #9CA3AF;
    stroke-width: 0.85;
    fill: none;
    pointer-events: none;
  }

    border: 1px solid #E5E7EB;
    border-radius: 6px;
    padding: 9px 12px;
    font-size: 11.5px;
    line-height: 1.48;
    color: #4B5563;
    max-width: 285px;
    pointer-events: none;
  }

    font-weight: 700;
    color: #1F2937;
    margin-bottom: 2px;
  }

    font-size: 11.5px;
    color: #6B7280;
    line-height: 1.4;
  }
  #swd-us-elections-all .swd-tooltip {
    position: absolute;
    pointer-events: none;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.12s ease, transform 0.12s ease;
    background: rgba(255, 255, 255, 0.98);
    border: 1px solid #D1D5DB;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
    padding: 10px 13px;
    min-width: 225px;
    max-width: 295px;
    z-index: 50;
    font-size: 12.5px;
    line-height: 1.4;
  }
  #swd-us-elections-all .swd-tooltip.visible {
    opacity: 1;
    transform: translateY(0);
  }
  #swd-us-elections-all .tip-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 3px;
  }
  #swd-us-elections-all .tip-state { font-weight: 700; font-size: 14px; color: #111827; }
  #swd-us-elections-all .tip-badge {
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 999px;
    white-space: nowrap;
  }
  #swd-us-elections-all .tip-sub { font-size: 11.5px; color: #6B7280; margin-bottom: 7px; }
  #swd-us-elections-all .tip-row {

    gap: 12px;
    padding: 3px 0;
    border-top: 1px solid #F3F4F6;

"2024 Presidential \u2022 6 EV (Trump)","badge":"Solid Republican (\u226510 pts)","badgeBg":"#B84A39","badgeColor":"#FFFFFF","rows":[["Donald Trump (R)","883,818 (59.38%)"],["Kamala Harris (D)","562,566 (37.79%)"],["Certified Margin","R+21.58 pts"]]}},"VT":{"fill":"#1B5E91","outcome":"Solid Democratic (\u226510 pts)","label":"VT\n3","pill":"VT 3","dark":true,"contested":true,"tip":{"state":"Vermont","subtitle":"2024 Presidential \u2022 3 EV (Harris)","badge":"Solid Democratic (\u226510 pts)","badgeBg":"#1B5E91","badgeColor":"#FFFFFF","rows":[["Donald Trump (R)","119,395 (32.32%)"],["Kamala Harris (D)","235,791 (63.83%)"],["Certified Margin","D+31.51 pts"]]}},"VA":{"fill":"#A9CBE3","outcome":"Competitive Democratic (<10 pts)","label":"VA\n13","pill":"VA 13","dark":false,"contested":true,"tip":{"state":"Virginia","subtitle":"2024 Presidential \u2022 13 EV (Harris)","badge":"Competitive Democratic (<10 pts)","badgeBg":"#A9CBE3","badgeColor":"#1F2937","rows":[["Donald Trump (R)","2,074,097 (46.06%)"],["Kamala Harris (D)","2,333,778 (51.82%)"],["Certified Margin","D+5.77 pts"]]}},"WA":{"fill":"#1B5E91","outcome":"Solid Democratic (\u226510 pts)","label":"WA\n12","pill":"WA 12","dark":true,"contested":true,"tip":{"state":"Washington","subtitle":"2024 Presidential \u2022 12 EV (Harris)","badge":"Solid Democratic (\u226510 pts)","badgeBg":"#1B5E91","badgeColor":"#FFFFFF","rows":[["Donald Trump (R)","1,530,923 (39.01%)"],["Kamala Harris (D)","2,245,849 (57.23%)"],["Certified Margin","D+18.22 pts"]]}},"WV":{"fill":"#B84A39","outcome":"Solid Republican (\u226510 pts)","label":"WV\n4","pill":"WV 4","dark":true,"contested":true,"tip":{"state":"West Virginia","subtitle":"2024 Presidential \u2022 4 EV (Trump)","badge":"Solid Republican (\u226510 pts)","badgeBg":"#B84A39","badgeColor":"#FFFFFF","rows":[["Donald Trump (R)","533,556 (69.97%)"],["Kamala Harris (D)","214,309 (28.10%)"],["Certified Margin","R+41.86 pts"]]}},"WI":{"fill":"#E7B5AC","outcome":"Competitive Republican (<10 pts)","label":"WI\n10","pill":"WI 10","dark":false,"contested":true,"tip":{"state":"Wisconsin","subtitle":"2024 Presidential \u2022 10 EV (Trump)","badge":"Competitive Republican (<10 pts)","badgeBg":"#E7B5AC","badgeColor":"#1F2937","rows":[["Donald Trump (R)","1,697,626 (49.60%)"],["Kamala Harris (D)","1,668,229 (48.74%)"],["Certified Margin","R+0.86 pts"]]}},"WY":{"fill":"#B84A39","outcome":"Solid Republican (\u226510 pts)","label":"WY\n3","pill":"WY 3","dark":true,"contested":true,"tip":{"state":"Wyoming","subtitle":"2024 Presidential \u2022 3 EV (Trump)","badge":"Solid Republican (\u226510 pts)","badgeBg":"#B84A39","badgeColor":"#FFFFFF","rows":[["Donald Trump (R)","192,633 (71.60%)"],["Kamala Harris (D)","69,527 (25.84%)"],["Certified Margin","R+45.76 pts"]]}}}}];
  const SVG_NS = "http://www.w3.org/2000/svg";

  const tabsEl = root.querySelector(".swd-tabs");
  const titleEl = root.querySelector(".swd-title");
  const subEl = root.querySelector(".swd-subtitle");
  const barWrapEl = root.querySelector(".swd-bar-wrap");
  const svgEl = root.querySelector("svg.swd-svg");
  const noteEl = root.querySelector(".swd-note");
  const sourceEl = root.querySelector(".swd-source");
  const tipEl = root.querySelector(".swd-tooltip");
  const mapWrapEl = root.querySelector(".swd-map-wrap");

  let activeData = DATASETS[0];

  function el(tag, attrs, parent) {
    const node = document.createElementNS(SVG_NS, tag);
    for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
    if (parent) parent.appendChild(node);
    return node;
  }

  function showTooltip(abbr, evt) {
    const st = activeData.states[abbr];
    if (!st || !st.tip) return;
    const t = st.tip;
    tipEl.innerHTML =
      `<div class="tip-head"><span class="tip-state">${t.state}</span>` +
      `<span class="tip-badge" style="background:${t.badgeBg};color:${t.badgeColor}">${t.badge}</span></div>` +
      `<div class="tip-sub">${t.subtitle}</div>` +
      t.rows.map(([k, v]) => `<div class="tip-row"><span class="tip-k">${k}</span><span class="tip-v">${v}</span></div>`).join("");
    tipEl.classList.add("visible");
    moveTooltip(evt);
    setHoverState(abbr, true);
  }

  function moveTooltip(evt) {
    const rect = mapWrapEl.getBoundingClientRect();
    const tw = tipEl.offsetWidth || 240;
    const th = tipEl.offsetHeight || 110;
    let x = evt.clientX - rect.left + 16;
    let y = evt.clientY - rect.top - 14;
    if (x + tw > rect.width - 8) x = evt.clientX - rect.left - tw - 16;
    if (x < 6) x = 6;
    if (y + th > rect.height - 6) y = rect.height - th - 6;
    if (y < 6) y = 6;
    tipEl.style.left = x + "px";
    tipEl.style.top = y + "px";
  }

  function hideTooltip(abbr) {
    tipEl.classList.remove("visible");
    setHoverState(abbr, false);
  }

  function setHoverState(abbr, on) {
    svgEl.querySelectorAll(`[data-abbr="${abbr}"]`).forEach(n => {
      n.classList.toggle("hovered", on);
      if (on && n.classList.contains("state-path")) n.parentNode.appendChild(n);
    });
  }

  function renderBar(bar) {
    barWrapEl.innerHTML = "";
    const barEl = document.createElement("div");
    barEl.className = "swd-bar";
    let cum = 0;
    bar.segments.forEach(s => {
      const pct = (s.value / bar.total) * 100;
      const seg = document.createElement("div");
      seg.className = "swd-seg";
      seg.style.width = pct + "%";
      seg.style.background = s.color;
      seg.style.color = s.textColor;
      const mid = cum + s.value / 2;
      const lblSpan = document.createElement("span");
      lblSpan.textContent = s.inner;
      if (bar.refLine && Math.abs(mid - bar.refLine) < bar.total * 0.03) {
        lblSpan.style.transform = "translateX(-16px)";
      }
      seg.appendChild(lblSpan);
      const top = document.createElement("span");
      top.className = "swd-seg-top" + (s.bold ? " bold" : "");
      top.style.color = s.topColor;
      top.textContent = s.top;
      seg.appendChild(top);
      barEl.appendChild(seg);
      cum += s.value;
    });
    if (bar.refLine) {
      const refPct = (bar.refLine / bar.total) * 100;
      const line = document.createElement("div");
      line.className = "swd-ref-line";
      line.style.left = refPct + "%";
      const rl = document.createElement("div");
      rl.className = "swd-ref-label";
      rl.style.left = refPct + "%";
      rl.textContent = bar.refLabel || "";
      barEl.appendChild(line);
      barEl.appendChild(rl);
    }
    barWrapEl.appendChild(barEl);
  }

  function renderMap(ds) {
    activeData = ds;
    titleEl.innerHTML = ds.titleHtml;
    subEl.innerHTML = ds.subtitleHtml;
    renderBar(ds.bar);
    noteEl.innerHTML =
      `<div class="swd-note-head">${ds.noteLines[0]}</div>` +
      ds.noteLines.slice(1).map(l => `<div>${l}</div>`).join("");
    sourceEl.textContent = ds.source;

    svgEl.innerHTML = "";
    const gPaths = el("g", {class: "layer-paths"}, svgEl);
    const gLeaders = el("g", {class: "layer-leaders"}, svgEl);
    const gLabels = el("g", {class: "layer-labels"}, svgEl);

    SHAPES.forEach(s => {
      if (s.abbr === "DC" && !ds.includeDC) return;
      const st = ds.states[s.abbr];
      if (!st) return;

      if (s.d) {
        const path = el("path", {
          d: s.d,
          fill: st.fill,
          class: "state-path",
          "data-abbr": s.abbr,
          tabindex: "0",
          "aria-label": `${s.name}: ${st.outcome}`,
        }, gPaths);
        path.addEventListener("mouseenter", e => showTooltip(s.abbr, e));
        path.addEventListener("mousemove", moveTooltip);
        path.addEventListener("mouseleave", () => hideTooltip(s.abbr));
        path.addEventListener("focus", () => {
          const b = path.getBoundingClientRect();
          showTooltip(s.abbr, {clientX: b.left + b.width / 2, clientY: b.top + b.height / 2});
        });
        path.addEventListener("blur", () => hideTooltip(s.abbr));
      }

      if (!st.contested) return;

      if (s.callout) {
        const c = s.callout;
        const bx = c.type === "vt" ? c.bx : (ds.includeDC ? c.bx_all : c.bx_50);
        const by = c.type === "vt" ? c.by : (ds.includeDC ? c.by_all : c.by_50);
        const x1 = c.type === "vt" ? c.x1 : s.px;
        const y1 = c.type === "vt" ? c.y1 : s.py;
        const x2 = c.type === "vt" ? c.x2 : (ds.includeDC ? c.ex_all : c.ex_50);
        const y2 = c.type === "vt" ? c.y2 : by;
        el("line", {x1, y1, x2, y2, class: "leader-line"}, gLeaders);

        const pillTxt = st.pill || s.abbr;
        const pw = Math.max(30, pillTxt.length * 6.9 + 11);
        const ph = 18;
        const rx = c.type === "vt" ? bx - pw / 2 : bx;
        const ry = by - ph / 2;
        const pg = el("g", {class: "pill-group", "data-abbr": s.abbr}, gLabels);
        el("rect", {x: rx, y: ry, width: pw, height: ph, rx: 3.5, fill: st.fill}, pg);
        const pt = el("text", {
          x: rx + pw / 2, y: by + 0.5,
          fill: st.dark ? "#FFFFFF" : "#1F2937",
          "font-size": "10.5",
          "font-weight": st.dark ? "700" : "500",
          class: "state-label",
        }, pg);
        pt.textContent = pillTxt;
        pg.addEventListener("mouseenter", e => showTooltip(s.abbr, e));
        pg.addEventListener("mousemove", moveTooltip);
        pg.addEventListener("mouseleave", () => hideTooltip(s.abbr));
      } else if (s.abbr === "HI") {
        const t = el("text", {
          x: s.lx, y: s.ly, fill: "#1F2937",
          "font-size": "10.5", "font-weight": st.dark ? "700" : "500", class: "state-label",
        }, gLabels);
        t.textContent = st.pill || "HI";
      } else if (st.label) {
        const lines = st.label.split("\n");
        const col = st.dark ? "#FFFFFF" : "#263238";
        const t = el("text", {
          x: s.lx, y: s.ly, fill: col,
          "font-size": st.dark ? "10.5" : "10.0",
          "font-weight": st.dark ? "700" : "500",
          class: "state-label",
        }, gLabels);
        if (lines.length === 1) {
          t.textContent = lines[0];
        } else {
          lines.forEach((ln, idx) => {
            const ts = el("tspan", {x: s.lx, dy: idx === 0 ? "-0.45em" : "1.12em"}, t);
            ts.textContent = ln;
          });
        }
      }
    });
  }

  if (tabsEl) {
    DATASETS.forEach((ds, idx) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "swd-tab" + (idx === 0 ? " active" : "");
      btn.textContent = ds.tab;
      btn.addEventListener("click", () => {
        tabsEl.querySelectorAll(".swd-tab").forEach((b, i) => b.classList.toggle("active", i === idx));
        renderMap(DATASETS[idx]);
      });
      tabsEl.appendChild(btn);
    });
  }

  renderMap(DATASETS[0]);
})();
</script>
