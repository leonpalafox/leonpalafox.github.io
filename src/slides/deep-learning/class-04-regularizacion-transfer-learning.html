.r-pipe{position:absolute;display:flex;flex-wrap:wrap;align-items:center;gap:6px;width:248px;font-size:14px}
.r-pipe span{padding:6px 10px;border-radius:8px;background:var(--card);border:1px solid var(--hair)}
.r-pipe span.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.r-pipe i{font-style:normal;color:var(--gold-d)}
/* 14 augmentation */
.ln.dsh>i{background:repeating-linear-gradient(90deg,currentColor 0 7px,transparent 7px 12px)}
.r-epgrid{display:grid;grid-template-columns:repeat(3,76px);gap:8px;margin-top:10px}
.r-epc{display:flex;flex-direction:column;gap:3px}
.r-epc img{width:76px;height:76px;border-radius:8px;object-fit:cover;display:block}
.r-epc span{font:11px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 15 transfer */
.r-grid4{display:grid;grid-template-columns:repeat(4,58px);gap:6px;justify-content:center;margin-top:12px}
.r-grid4 img{width:58px;height:58px;border-radius:7px;object-fit:cover;display:block}
.r-grid4.lf{grid-template-columns:repeat(3,52px) 1fr;gap:5px 6px;align-items:center}
.r-grid4.lf img{width:52px;height:46px}
.r-grid4.lf span{font-size:12px;color:var(--muted);line-height:1.15}
.r-cap{text-align:center;font-size:14px;line-height:1.4;color:var(--muted);margin-top:12px}.r-cap b{color:var(--ink)}
.r-mini2{position:absolute;width:34px;height:34px;border-radius:5px;object-fit:cover;box-shadow:0 0 0 1px rgba(20,36,56,.15)}
.r-res20{position:absolute;padding:14px 18px;border-radius:14px;background:var(--card);border:1px solid var(--hair)}
/* 16 fine-tuning */
.r-blk{position:absolute;width:132px;height:100px;border-radius:12px;background:#e9ecef;border:1.5px solid #c5ccd4;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;transition:background-color .45s,border-color .45s,box-shadow .45s,opacity .55s ease var(--dl,0s),transform .75s cubic-bezier(.2,.75,.25,1) var(--dl,0s)}
.r-blk b{font-size:17px}.r-blk span{font:600 15px var(--mono);color:var(--muted)}
.r-blk .r-lock{position:absolute;right:8px;top:8px;width:18px;height:18px;transition:opacity .3s}
.r-blk .r-lock svg{width:18px;height:18px;stroke:#8d99a6;fill:none;stroke-width:1.8}
.r-blk.tr{background:#fbf3e2;border-color:var(--gold);box-shadow:0 0 0 4px rgba(182,151,88,.18)}
.r-blk.tr .r-lock{opacity:0}.r-blk.tr span{color:var(--gold-d)}
.r-blk.hd{border-style:dashed}
.r-ftbars{position:absolute;padding:16px 18px;border-radius:16px;background:var(--card);border:1px solid var(--hair)}
.r-ftbars .r-br i{background:#c9c2b1}.r-ftbars .r-br.top i{background:var(--gold)}.r-ftbars .r-br.top span{color:var(--gold-d)}
.r-two{margin-bottom:22px}.r-two h4{margin:0 0 8px;font-size:26px}
.r-two div{font-size:21px;line-height:1.35;padding:6px 0 6px 18px;position:relative;border-bottom:1px solid var(--hair)}
.r-two div::before{content:'';position:absolute;left:0;top:16px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
/* 17 flow */
.r-stn{width:30px;height:30px;border-radius:50%;background:var(--gold-d);color:#fff;font:700 15px/30px var(--sans);text-align:center}
.r-stt{font-size:19px;font-weight:700;margin:8px 0 10px}
.r-stp{position:relative;font-size:14px;line-height:1.4;color:var(--muted);margin:10px 0 0}.r-stp b{color:var(--ink)}
.r-ds{display:grid;grid-template-columns:repeat(2,64px);gap:6px}.r-ds img{width:64px;height:56px;border-radius:7px;object-fit:cover;display:block}
.r-headg{display:flex;align-items:center;gap:10px;margin-top:18px;font:700 26px var(--mono)}
.r-headg span{padding:16px 12px;border-radius:10px;background:#e9ecef;border:1.5px solid #c5ccd4}
.r-headg span.g{background:#fbf3e2;border-color:var(--gold);color:var(--gold-d)}
.r-headg i{font-style:normal;color:var(--gold-d)}
.r-cm4{display:grid;grid-template-columns:repeat(4,38px);gap:3px;margin-top:4px}
.r-cm4 i{height:30px;border-radius:4px;display:grid;place-items:center;font:700 13px var(--mono);font-style:normal;color:var(--ink)}
/* 18 anatomy */
.r-an{position:absolute;top:0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.r-anv>img{width:116px;height:116px;border-radius:12px;object-fit:cover;box-shadow:0 6px 16px rgba(20,36,56,.16)}
.r-an>b{font-size:16px;margin-top:6px}.r-an>span{font:13px var(--mono);color:var(--gold-d);white-space:nowrap}
.r-an .x-cnn{position:relative;left:auto;top:auto}
.r-anv{position:relative;height:120px;width:100%;display:flex;justify-content:center;align-items:center}.r-anv .x-cnn{position:relative!important}
.r-poolg{display:flex;align-items:center;gap:4px;height:116px}
.r-poolg i{width:18px;height:18px;border-radius:3px;background:#9fb8de}.r-poolg i:nth-child(2n){background:#5f81b8}.r-poolg i.g{background:var(--gold);width:22px;height:22px}
.r-poolg b{color:var(--gold-d);margin:0 4px}
.r-gapg{display:flex;align-items:center;gap:10px;height:116px}
.r-gapg b{color:var(--gold-d)}
.r-cube{width:56px;height:56px;border-radius:6px;background:linear-gradient(135deg,#9fb8de,#5f81b8);box-shadow:6px -6px 0 #c3d3ea,12px -12px 0 #dde6f2}
.r-vecv{width:16px;height:80px;border-radius:8px;background:var(--gold);transition:height .5s,width .5s}
.r-gapg.flat .r-vecv{height:112px;width:10px;background:repeating-linear-gradient(var(--gold) 0 5px,#e3cda4 5px 7px)}
.r-dense{display:flex;flex-direction:column;justify-content:center;gap:6px;height:116px}
.r-dense i{width:22px;height:12px;border-radius:6px;border:2px solid var(--blue);display:block}
.r-soft{display:flex;flex-direction:column;justify-content:center;height:116px}
.r-soft b{font-size:17px;color:var(--gold-d)}.r-soft span{font:700 24px var(--mono)}
.r-tagrow{position:absolute;display:flex;gap:8px}
.r-tagrow span{padding:5px 12px;border-radius:999px;font-size:14px;font-weight:600;border:1px solid}
.r-tagrow .bn{background:#e7eef8;border-color:#a9bcd8;color:var(--blue)}.r-tagrow .no{background:#f2f2f2;border-color:#ccc;color:var(--muted)}.r-tagrow .dp{background:#fbf3e2;border-color:#e3cda4;color:var(--gold-d)}
.pts.r-tight .pt.sm{padding:9px 0;font-size:23px}
/* 19 evaluation */
.r-cmx{position:absolute;display:grid;grid-template-columns:96px 160px 160px;grid-template-rows:26px 34px 120px 120px;gap:6px}
.r-cmh{text-align:center;font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.r-cmv{position:absolute;left:-30px;top:200px;transform:rotate(-90deg);font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.r-cmc0{font-size:16px;font-weight:700;text-align:center;align-self:end}.r-cmr{font-size:16px;font-weight:700;align-self:center;text-align:right;padding-right:8px}
.r-cell{border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.r-cell b{font:700 40px var(--mono)}.r-cell span{font-size:13px;color:var(--muted)}
.r-cell.vp,.r-cell.vn{background:#e3f1ea;border:1.5px solid #a9d3bd}.r-cell.vp b,.r-cell.vn b{color:var(--green)}
.r-cell.fp,.r-cell.fn{background:var(--red-l);border:1.5px solid #e5b5a8}.r-cell.fp b,.r-cell.fn b{color:var(--red)}
.r-met{display:grid;grid-template-columns:90px 1fr 64px;align-items:center;gap:10px;margin-top:12px;font-size:16px}
.r-met>div{position:relative;height:16px;border-radius:8px;background:rgba(20,36,56,.08)}
.r-met>div i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:var(--gold);transition:width .6s cubic-bezier(.3,.9,.3,1)}
.r-met>div em.base{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1.5px;background:#8d99a6;border-radius:2px}
.r-met b{font:700 17px var(--mono);text-align:right}
.r-err{position:absolute;width:312px;padding:14px 16px;border-radius:14px;border:1px solid}
.r-err.ok{background:#e9f4ee;border-color:#a9d3bd;color:var(--green)}.r-err.bad{background:#fbece6;border-color:#e5b5a8;color:var(--red)}
.r-err img{width:84px;height:84px;border-radius:8px;display:block}
.r-err b{font-size:24px;color:var(--muted)}
.r-pred{padding:8px 16px;border-radius:10px;font-weight:700;font-size:20px;color:#fff}
.r-err.ok .r-pred{background:var(--green)}.r-err.bad .r-pred{background:var(--red)}
.r-err small{display:block;margin-top:8px;font-size:13px;color:var(--muted)}
/* 20 practice */
.r-steps5{position:absolute;left:0;top:0;display:flex;gap:10px;width:988px}
.r-st5{flex:1;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;border:1px solid var(--hair2);background:var(--card);font:600 14px var(--sans);color:var(--ink);text-align:left;cursor:pointer;transition:background-color .2s,border-color .2s,color .2s}
.r-st5 i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--gold-l);color:var(--gold-d);font:700 13px/26px var(--sans);text-align:center;font-style:normal}
.r-st5:hover{border-color:var(--gold)}
.r-st5.on{background:var(--ink);border-color:var(--ink);color:#fff}.r-st5.on i{background:var(--gold);color:#fff}
.r-code{position:absolute;font-size:16.5px;line-height:1.55;padding:18px 24px;min-height:310px;white-space:pre}
.r-out{position:absolute;display:flex;gap:16px;align-items:baseline;padding:14px 20px;border-radius:14px;background:#fbf3e2;border:1px solid #e3cda4;font-size:17px;line-height:1.4}
.r-out .r-ttl{flex:none}
/* 21 mind map */
.r-mmic{flex:none;width:46px;height:46px;border-radius:50%;background:#fbf3e2;border:1.5px solid #e3cda4;display:grid;place-items:center}
.r-mmic svg{width:24px;height:24px;stroke:var(--gold-d);fill:none;stroke-width:1.6}
.r-mmt{margin:0;font-size:20px;line-height:1.2}
.r-mmp{margin:4px 0 6px;font-size:14px;line-height:1.35;color:var(--muted)}
.r-mmn{font-size:14px;padding:5px 10px;border-radius:8px;background:#f3efe4;display:inline-block}
.r-mmn b{color:var(--gold-d);font-family:var(--mono)}
.r-hub{position:absolute;width:472px;height:250px;border-radius:20px;background:var(--card);border:1px solid var(--hair);box-shadow:0 10px 30px rgba(20,36,56,.08)}
.r-hub>img{position:absolute;left:24px;top:44px;width:96px;height:96px;border-radius:12px;object-fit:cover}
.r-hub .x-cnn{position:absolute}
.r-hubg{position:absolute;left:300px;top:74px;padding:10px 22px;border-radius:12px;background:var(--gold-d);color:#fff;font-size:22px;font-weight:700}
.r-hubl{position:absolute;left:24px;right:24px;top:176px;text-align:center;font-size:15px;color:var(--muted)}
.r-cols{display:flex;align-items:flex-end;gap:18px;height:90px;margin-top:2px}
.r-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}
.r-col b{font:700 16px var(--mono);color:var(--ink)}
.r-col i{display:block;width:44px;border-radius:6px 6px 0 0;background:#c9c2b1;transform-origin:50% 100%}
.r-col span{font-size:12.5px;color:var(--muted);white-space:nowrap}
.r-col.hl6 i{background:var(--gold)}.r-col.hl6 b{color:var(--gold-d)}

  {title: 'Regularización y transfer learning', layout: 'cover', sec: SEC[0], points: ['Cómo hacer que una CNN funcione en el mundo real.', 'Dr. León Felipe Palafox Novack', 'lfpalafox@up.edu.mx'],
    original: NEWSLIDE + ' Portada con el tema de la presentación (cnn_regularization_transfer_learning_slides).', sources: []},
  {title: 'Repaso: lo que vimos sobre CNN', layout: 'split', sec: SEC[0], points: ['De píxeles a patrones visuales.', 'Convolución: un filtro pequeño recorre la imagen.', 'Filtros y mapas de activación: cada filtro produce un mapa que dice dónde encontró su patrón.', 'Pooling: reduce el tamaño del mapa y conserva lo importante.', 'Aprendizaje jerárquico: de bordes a partes y de partes a objetos.'],
    original: 'Repaso: ¿Qué vimos la clase pasada sobre CNN?\nDe pixeles a patrones visuales\n• Convolución\n• Filtros y mapas de activación\n• Pooling\n• Aprendizaje jerárquico de patrones\n(diagrama: Imagen de entrada (gato) → Filtros (convolución) → Mapas de activación → Pooling (reducción) → Representaciones de mayor nivel → Reconocimiento (final) con barras gato, perro, conejo, coche, ave)', sources: []},
  {title: '¿Por qué usamos CNN para imágenes?', layout: 'split', sec: SEC[0], points: ['Aprovechan la estructura espacial de la imagen.', 'Detectan patrones locales.', 'Reutilizan filtros: los mismos pesos en toda la imagen.', 'Son más eficientes que una red totalmente conectada.', 'Aprenden de bordes a objetos.'],
    original: '¿Por qué usamos CNN para imágenes?\nAprovechan la estructura espacial de la imagen\n• Detectan patrones locales\n• Reutilizan filtros\n• Son más eficientes que una red totalmente conectada\n• Aprenden de bordes a objetos\nRed densa: La imagen se "aplana". Cada pixel se conecta con todas las neuronas. Se pierden relaciones espaciales y es menos eficiente.\nCNN (campos receptivos locales, filtros compartidos → gato): Los filtros se aplican en vecindarios locales y se reutilizan en toda la imagen, preservando la estructura espacial. Más eficiente y más efectiva.\nbordes → texturas → partes → objeto. Las CNN aprenden jerarquías: de características simples a representaciones complejas.', sources: []},
  {title: 'La pregunta de hoy', layout: 'question', sec: SEC[1], points: ['¿Cómo hacemos que una CNN funcione bien en el mundo real?', 'Cuando hay pocos datos.', 'Cuando aparece overfitting.', 'Cuando entrenar se vuelve inestable.', 'Cuando necesitamos resultados prácticos rápido.'],
    original: 'La pregunta de hoy\n¿Cómo hacemos que una CNN funcione bien en el mundo real?\n• Cuando hay pocos datos\n• Cuando aparece overfitting\n• Cuando entrenar se vuelve inestable\n• Cuando necesitamos resultados prácticos rápido\n(diagrama: gato → Filtros (convolución) → Mapas de características → Características de alto nivel → Clasificación → montaña con íconos de base de datos, advertencia, gráfica y reloj)', sources: []},
  {title: 'El problema práctico de entrenar CNNs', layout: 'split', sec: SEC[1], points: ['Muchos parámetros.', 'Pocos datos.', 'Overfitting.', 'Entrenamiento inestable.', 'Generalización difícil.', 'Entender las CNNs no es suficiente: hay que entrenarlas bien y lograr que generalicen.'],
    original: 'El problema práctico de entrenar CNNs\nMuchos parámetros · Pocos datos · Overfitting · Entrenamiento inestable · Generalización difícil\n(gráfica «Error vs. épocas»: error de validación, error de entrenamiento, inicio del sobreajuste)\nEntender las CNNs no es suficiente: hay que entrenarlas bien y lograr que generalicen.', sources: []},
  {title: 'Ejemplos modernos: visión en medicina', layout: 'split', sec: SEC[2], points: ['Detección de hallazgos en radiografías.', 'Apoyo en dermatología y patología.', 'Herramientas de análisis asistido por IA.', 'Las CNN no solo clasifican gatos: también apoyan decisiones reales.', 'La decisión final es del profesional de la salud.'],

  {title: 'Ejemplos modernos: segmentación y video', layout: 'split', sec: SEC[2], points: ['Separar objetos del fondo.', 'Seguir objetos en video.', 'Modelos fundacionales de visión.', 'La visión moderna ya no solo clasifica: también localiza y separa.'],
    original: 'Ejemplos modernos: segmentación y video\n• Separar objetos del fondo\n• Seguir objetos en video\n• Modelos fundacionales de visión\n(1 Imagen original: golden retriever corriendo · 2 Máscara de segmentación · 3 Seguimiento en video: cuatro cuadros con caja y línea de tiempo)\nLa visión moderna ya no solo clasifica: también localiza y separa.', sources: []},
  {title: 'Overfitting: cuando el modelo memoriza', layout: 'split', sec: SEC[3], points: ['Aprende demasiado bien el entrenamiento.', 'Falla al generalizar.', 'Buen desempeño en train, malo en validation/test.', 'El modelo se vuelve especialista en el set de entrenamiento.', 'Memorizar ejemplos (se adapta al ruido) vs aprender patrones (captura la estructura).'],
    original: 'Overfitting: cuando el modelo memoriza\n• Aprende demasiado bien el entrenamiento\n• Falla al generalizar\n• Buen desempeño en train, malo en validation/test\n(gráfica «Error a lo largo del entrenamiento»: error de entrenamiento (train), error de validación (val/test), punto óptimo de generalización, épocas de entrenamiento)\nEl modelo se vuelve especialista en el set de entrenamiento.\nMemorizar ejemplos: el modelo se adapta al ruido y a los detalles irrelevantes · vs · Aprender patrones: el modelo captura la estructura verdadera de los datos.', sources: []},
  {title: 'Dropout: no depender de una sola ruta', layout: 'split', sec: SEC[3], points: ['Apaga neuronas al azar durante el entrenamiento.', 'Obliga a repartir el aprendizaje.', 'Ayuda a reducir overfitting.', '«Si una neurona falta, la red debe seguir funcionando».'],
    original: 'Dropout: entrenar sin depender demasiado de una sola ruta\n• Apaga neuronas al azar durante entrenamiento\n• Obliga a repartir el aprendizaje\n• Ayuda a reducir overfitting\n«Si una neurona falta, la red debe seguir funcionando»\n(red con neuronas activas y neuronas apagadas (dropout))', sources: []},
  {title: '¿Qué hace realmente Dropout?', layout: 'split', sec: SEC[3], points: ['Entrenamiento: neuronas apagadas aleatoriamente.', 'Inferencia: red completa activa.', 'Efecto regularizador.', 'El modelo aprende representaciones más robustas.'],
    original: '¿Qué hace realmente Dropout?\n• Entrenamiento: neuronas apagadas aleatoriamente\n• Inferencia: red completa activa\n• Efecto regularizador\n(diagramas: Entrenamiento → Inferencia)\nEl modelo aprende representaciones más robustas.', sources: []},
  {title: 'BatchNorm: estabilizar para aprender mejor', layout: 'split', sec: SEC[3], points: ['Normaliza activaciones por lote.', 'Facilita el entrenamiento.', 'Hace más estable el flujo de información.', 'Si las activaciones cambian demasiado, entrenar se vuelve más difícil.'],
    original: 'Batch Normalization: estabilizar para aprender mejor\n• Normaliza activaciones por lote\n• Facilita el entrenamiento\n• Hace más estable el flujo de información\n(Activaciones desordenadas → Activaciones centradas)\nSi las activaciones cambian demasiado, entrenar se vuelve más difícil.', sources: []},
  {title: 'Batch Norm: antes y después', layout: 'split', sec: SEC[3], points: ['Antes: activaciones inestables.', 'Después: activaciones más controladas.', 'Resultado: entrenamiento más confiable.'],

  {title: 'Data augmentation: más variación', layout: 'split', sec: SEC[3], points: ['Más variación sin recolectar más datos.', 'Rotación.', 'Flip.', 'Zoom.', 'Recorte.', 'Pequeños cambios de color o brillo.', 'Aumenta diversidad, mejora generalización.'],
    original: 'Data Augmentation: más variación sin recolectar más datos\n• Rotación · Flip · Zoom · Recorte · Pequeños cambios de color o brillo\n(imagen base de un golden retriever y sus versiones: Rotación, Flip, Zoom, Recorte, Cambio de color/brillo)\nAumenta diversidad, mejora generalización.', sources: []},
  {title: 'Transfer learning: reutilizar lo aprendido', layout: 'split', sec: SEC[4], points: ['Aprovechar conocimiento previo.', 'Usar un modelo preentrenado.', 'Reutilizar características visuales.', 'Adaptarlo a una nueva tarea.'],
    original: 'Transfer Learning: aprovechar conocimiento previo\n• Usar un modelo preentrenado\n• Reutilizar características visuales\n• Adaptarlo a una nueva tarea\n(Muchos datos → Modelo preentrenado → Nueva tarea (hojas); «Gran problema fuente (muchos datos y muchas clases)», «Conocimiento visual aprendido (características reutilizables)», «Problema objetivo (pocos datos, pocas clases)»)', sources: []},
  {title: 'Feature extractor vs fine-tuning', layout: 'split', sec: SEC[4], points: ['Feature extractor: congelar backbone, entrenar solo la cabeza final. Más rápido, menos riesgo.', 'Fine-tuning: descongelar parte del modelo, ajustar capas profundas. Más flexible, más delicado.'],
    original: 'Dos estrategias: feature extractor vs fine-tuning\nFeature extractor: Congelar backbone · Entrenar solo la cabeza final · Más rápido, menos riesgo\nFine-tuning: Descongelar parte del modelo · Ajustar capas profundas · Más flexible, más delicado\n(diagramas: gato → Backbone (congelado) → Cabeza final (entrenable); leyenda Congelado / Entrenable)', sources: []},
  {title: 'Flujo práctico en un proyecto real', layout: 'split', sec: SEC[4], points: ['Dataset → Modelo preentrenado → Nueva cabeza de clasificación → Entrenamiento → Evaluación.', 'Este será el flujo de la práctica.'],

  {title: 'Anatomía mínima de una solución de visión', layout: 'split', sec: SEC[5], points: ['Convolutional base.', 'Pooling.', 'Global Average Pooling o Flatten.', 'Capa densa.', 'Softmax / salida final.', 'Dropout / BatchNorm como apoyo.'],
    original: 'Anatomía mínima de una solución de visión\n• Convolutional base · Pooling · Global Average Pooling o Flatten · Capa densa · Softmax / salida final · Dropout / BatchNorm como apoyo\n(Imagen de entrada → Base convolucional (extrae características visuales) → Pooling (reduce la dimensión y conserva lo importante) → GAP o Flatten (resume el mapa en un vector de características) → Capa densa (combina las características para tomar decisiones) → Softmax / salida final (probabilidades sobre clases); etiquetas BatchNorm y Dropout bajo las etapas)', sources: []},
  {title: 'Evaluar bien: accuracy no siempre basta', layout: 'split', sec: SEC[5], points: ['Accuracy.', 'Precision.', 'Recall.', 'Matriz de confusión.', 'Ver errores reales.', 'Ver fallos del modelo también enseña.'],

  {title: 'Práctica: lo que vamos a programar', layout: 'split', sec: SEC[5], points: ['Cargar imágenes.', 'Usar una CNN preentrenada.', 'Añadir capa final.', 'Probar Dropout y BatchNorm.', 'Entrenar y comparar resultados.', 'Ya entendimos la idea, ahora la implementamos.'],

  {title: 'Mapa mental final', layout: 'split', sec: SEC[5], points: ['CNNs aprenden patrones visuales.', 'BatchNorm estabiliza el entrenamiento.', 'Dropout ayuda a generalizar.', 'Transfer learning hace viable el trabajo real.', 'Entender estas piezas es el paso de la teoría a la práctica.'],
    original: 'Mapa mental final\n• CNNs aprenden patrones visuales: detectan patrones locales, combinan características y construyen representaciones cada vez más abstractas hasta clasificar.\n• BatchNorm estabiliza el entrenamiento: normaliza las activaciones, reduce la covarianza interna y acelera la convergencia con mayor estabilidad.\n• Dropout ayuda a generalizar: desactiva neuronas aleatoriamente durante el entrenamiento para evitar coadaptación y reducir overfitting.\n• Transfer Learning hace viable el trabajo real: reutiliza representaciones aprendidas en grandes conjuntos de datos y adáptalas a tu problema con pocos datos.\n(centro: gato → CNN → gato)\nEntender estas piezas es el paso de la teoría a la práctica.', sources: []}

/* a presenter-driven state machine: → / ← step through states, chips jump to one; at the ends the deck moves on */
function STEP(A, o) {
  const chips = o.chips || [], n = o.n; let k = -1;
  const set = (j, how) => {
    j = Math.max(0, Math.min(n - 1, j)); if (j === k) return;
    const pk = k; k = j; o.set(k, pk, how);
    chips.forEach((c, i) => { c.classList.toggle('on', i === k); c.setAttribute('aria-pressed', String(i === k)); });
  };
  const ctl = {next() { if (k < n - 1) { set(k + 1, 'step'); return true; } return false; }, prev() { if (k > 0) { set(k - 1, 'back'); return true; } return false; }, stop() {}};
  A.ctl(ctl);
  chips.forEach((c, i) => c.addEventListener('click', ev => { ev.stopPropagation(); stopAdv(); set(i, 'jump'); if (ev.detail > 0) c.blur(); }));
  set(A.final() ? (o.fin != null ? o.fin : n - 1) : 0, A.final() ? 'final' : 'first');
  return ctl;
}

/* line chart as inline svg; returns {html, X, Y} so callers can place markers */
function CHART(o) {
  const X = v => (v - o.x0) / (o.x1 - o.x0) * o.w, Y = v => o.h - (v - o.y0) / (o.y1 - o.y0) * o.h;
  let s = `<svg class="r-chart" style="left:${o.left || 0}px;top:${o.top || 0}px" width="${o.w}" height="${o.h}" viewBox="0 0 ${o.w} ${o.h}"${o.b != null ? F(o.b, 'fade', o.d || 0, 'data-i="0"') : ''}>`;
  (o.yt || []).forEach(v => { s += `<path class="gr" d="M0 ${Y(v).toFixed(1)}H${o.w}"/><text x="-8" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end">${o.fy ? o.fy(v) : v}</text>`; });
  (o.xt || []).forEach(v => { s += `<text x="${X(v).toFixed(1)}" y="${o.h + 18}" text-anchor="middle">${o.fx ? o.fx(v) : v}</text>`; });
  s += `<path class="ax" d="M0 0V${o.h}H${o.w}"/>`;
  if (o.xl) s += `<text x="${o.w / 2}" y="${o.h + 38}" text-anchor="middle" style="fill:var(--ink)">${o.xl}</text>`;
  if (o.yl) s += `<text x="${-o.h / 2}" y="-44" transform="rotate(-90)" text-anchor="middle" style="fill:var(--ink)">${o.yl}</text>`;
  s += '</svg>';
  (o.series || []).forEach(sr => {
    const pts = sr.pts.map(([x, y]) => [X(x), Y(Math.max(o.y0, Math.min(o.y1, y)))]);
    let len = 0; for (let k = 1; k < pts.length; k++) len += Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]);
    const d = pts.map((p, k) => (k ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
    s += `<svg class="r-chart" style="left:${o.left || 0}px;top:${o.top || 0}px;pointer-events:none" width="${o.w}" height="${o.h}" viewBox="0 0 ${o.w} ${o.h}"><path class="r-ln ${sr.cls || ''}"${sr.k ? ` data-k="${sr.k}"` : ''} style="--len:${Math.ceil(len + 2)}${sr.style ? ';' + sr.style : ''}" d="${d}"${sr.b != null ? F(sr.b, 'arc', sr.d || 0, 'data-i="0"') : ''}/></svg>`;
  });
  return {html: s, X: v => (o.left || 0) + X(v), Y: v => (o.top || 0) + Y(v)};
}
const KEY = (x, y, items, o = {}) => `<div class="r-key" style="left:${x}px;top:${y}px"${o.b != null ? F(o.b, 'fade', o.d || 0, 'data-i="0"') : ''}>${items.map(([c, t]) => `<span><i style="background:${c}"></i>${t}</span>`).join('')}</div>`;

/* 09 · overfitting: the real curves of our small CNN (interactive epoch cursor) + memorising vs learning (real polynomial fits) */
function POLYP(x, y, w, h, fit, title, sub, o = {}) {

  const pts = Pd.xs.map((v, k) => [X(v), Y(fit.curve[k])]);
  let len = 0; for (let k = 1; k < pts.length; k++) len += Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]);

  s += `<path d="${Pd.xs.map((v, k) => (k ? 'L' : 'M') + X(v).toFixed(1) + ' ' + Y(Pd.true[k]).toFixed(1)).join('')}" fill="none" stroke="#c9c2b1" stroke-width="2" stroke-dasharray="5 5" clip-path="url(#pc${o.id})"/>`;
  s += `<g clip-path="url(#pc${o.id})"><path class="r-ln ${o.cls || 'va'}" style="--len:${Math.ceil(len)}" d="${pts.map((p, k) => (k ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('')}"${F(o.b, 'arc', o.d || 0, 'data-i="0"')}/></g>`;

/* 10 · dropout: a different random mask for every mini-batch (interactive) + a real robustness test */
const DNET = (() => {
  const L0 = [3, 6, 6, 2], X = [40, 210, 380, 540], H = 300, pos = L0.map((n, l) => Array.from({length: n}, (_, i) => [X[l], 20 + (i + .5) * H / n]));

  return {L0, pos, masks};
})();
function NETSVG(o = {}) {

  for (let l = 0; l < 3; l++) pos[l].forEach((a, i) => pos[l + 1].forEach((b, j) => { s += `<line class="r-edge" data-e1="${l}-${i}" data-e2="${l + 1}-${j}" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`; }));

}

/* 11 · what dropout really does: training vs inference (inverted dropout) + the real regularising effect */

  return `<div class="col-l" style="width:360px">${PTS(['<b>Antes</b>: activaciones inestables.', '<b>Después</b>: activaciones más controladas.', '<b>Resultado</b>: entrenamiento más confiable.'], 1, {pc: 'sm', beats: [1, 2, 2]})}

}, run: {2: A => {

  const val = (c, v, k) => k === 0 ? v : k === 1 ? v - c.mu : k === 2 ? (v - c.mu) / Math.sqrt(c.sd * c.sd + Bn.eps) : c.g * (v - c.mu) / Math.sqrt(c.sd * c.sd + Bn.eps) + c.b;

    A.k('trm').classList.toggle('hl', k === 1); A.k('trs').classList.toggle('hl', k === 2); A.k('trg').classList.toggle('hl', k === 3);

P({src: ['https://arxiv.org/abs/1604.03169', 'https://github.com/spMohanty/PlantVillage-Dataset', 'https://arxiv.org/abs/1411.1792', 'https://www.image-net.org/'], body: () => {

P({src: ['https://arxiv.org/abs/1411.1792', 'https://arxiv.org/abs/1805.08974', 'https://pytorch.org/tutorials/beginner/transfer_learning_tutorial.html'], body: () => {

P({src: ['https://github.com/spMohanty/PlantVillage-Dataset', 'https://pytorch.org/tutorials/beginner/transfer_learning_tutorial.html'], body: () => {

  const leaves = LEAFO.map(cl => (DATA.leaf_show[cl] || [])[0]).filter(Boolean);

  s += step(2, 'Modelo preentrenado', `${SLABS(66, 100, 118, 90, {n: 6})}<p class="r-stp" style="margin-top:120px"><b>ResNet-50</b> con pesos de ImageNet; se congela</p>`, 294);
  s += step(3, 'Nueva cabeza', `<div class="r-headg"><span>2048</span><i>→</i><span class="g">4</span></div><p class="r-stp"><b>${fmtN(2048 * 4 + 4)}</b> parámetros nuevos: una capa lineal + softmax</p>`, 588);
  let tc = '';
  if (H && H.hist) {
    const hh = H.hist, n = hh.length;
    tc = CHART({left: 30, top: 74, w: 190, h: 84, x0: 1, x1: n, y0: 0, y1: Math.max(...hh.map(h => h.loss)) * 1.05, yt: [], xt: [], series: [{pts: hh.map(h => [h.ep, h.loss]), cls: 'tr thin', b: 4, d: 300}]}).html;
  }
  s += step(4, 'Entrenamiento', `${tc}<p class="r-stp" style="margin-top:${tc ? 120 : 12}px">${H ? `<b>${H.epochs}</b> épocas; la pérdida de entrenamiento baja · ${H.sec_ep.toFixed(0)} s por época en CPU` : ''}</p>`, 882);
  let cm = '';
  if (H && H.cm) { const M = H.cm, mx = Math.max(...M.flat()); cm = `<div class="r-cm4">${M.map((row, i) => row.map((v, j) => `<i style="background:${i === j ? `rgba(46,148,102,${.15 + .85 * v / mx})` : (v ? `rgba(185,71,47,${.12 + .7 * v / mx})` : '#f1eee6')}">${v}</i>`).join('')).join('')}</div>`; }
  s += step(5, 'Evaluación', `${cm}<p class="r-stp">${H ? `<b>${pct(H.acc0 != null ? H.acc0 : H.acc, 1)}</b> de aciertos en 200 hojas de prueba${H.cm ? `; sanas: <b>${H.cm[3][3]} de 50</b>` : ''}` : ''}</p>`, 1176);
  s += CALL(414, 330, 600, 'bulb', 'Este será el <b>flujo de la práctica</b>.', {b: 5, d: 400, style: 'font-size:21px'});
  s += NOTE(0, 410, 1428, 'Experimento real: 80 fotos de hojas de tomate (PlantVillage, CC0), ResNet-50 de ImageNet congelada y una cabeza lineal nueva entrenada con aumento de datos. Matriz de confusión (sorteo 1): filas = clase real, columnas = predicción, en este orden: tizón temprano, tizón tardío, Septoria y sana. Las tres enfermedades se confunden entre sí; las hojas sanas casi nunca.', {b: 5, d: 700, style: 'font-size:14px'});

/* 18 · minimal anatomy of a vision model: real ResNet-50 shapes; GAP vs Flatten (interactive, real parameter counts) */

  s += stg(796, 140, 'Capa densa', '<span data-k="dns">2,048 → 1,000</span>', `<div class="r-dense">${'<i></i>'.repeat(6)}</div>`, 5);

  s += `<div class="r-tagrow" style="left:166px;top:196px"${F(6, 'up', 0, 'data-i="0"')}><span class="bn">BatchNorm × 53</span><span class="no">sin Dropout</span></div>`;
  s += `<div class="r-tagrow" style="left:796px;top:196px"${F(6, 'up', 150, 'data-i="0"')}><span class="dp">Dropout (en una cabeza nueva)</span></div>`;
  s += NOTE(0, 236, 1088, 'En ResNet-50 casi toda la reducción la hacen convoluciones con paso 2; solo hay un max pooling (después de conv1) y un GAP al final. Tiene 53 capas BatchNorm y ninguna de Dropout.', {b: 6, d: 300, style: 'font-size:14px'});
  s += `<div class="r-ro" style="left:0;top:290px;width:1088px"${F(7, 'up', 0, 'data-i="0"')}><div style="display:flex;gap:40px;align-items:flex-start">
    <div style="width:360px"><div class="r-ttl">¿GAP o Flatten antes de la capa densa?</div><div class="r-chips" data-int>${CHIPB('Global Average Pooling')}${CHIPB('Flatten')}</div><div class="r-note" style="position:relative;margin-top:10px;font-size:14px" data-k="gnote"></div></div>
    <div style="flex:1"><div class="r-rov"><span>vector que entra a la capa densa</span><b data-k="gin">—</b></div><div class="r-rov"><span>parámetros de la capa densa (1,000 clases)</span><b data-k="gpar" style="color:var(--gold-d)">—</b></div><div class="r-rov"><span>comparado con todo ResNet-50 (25.6 M)</span><b data-k="grel">—</b></div></div></div></div>`;
  return `<div class="col-l" style="width:300px">${PTS(['Convolutional base', 'Pooling', 'GAP o Flatten', 'Capa densa', 'Softmax / salida final', 'Dropout / BatchNorm como apoyo'], 1, {pc: 'sm', beats: [2, 3, 4, 5, 5, 6], cls: 'r-tight'})}</div><div class="col-r" style="left:340px">${s}</div>`;

/* ================= notes: «Sobre la versión animada» for every slide (numbers read from DATA) ================= */
(() => {
  const B = run('base'), Dd = run('dropout'), Bn = run('bn'), Au = run('aug'), Al = run('all'), C = DATA.cat, Pm = DATA.params, BN = DATA.bn, FT = DATA.finetune || {}, LF = DATA.leaf, CT = DATA.cifar;
  const p1 = v => (v * 100).toFixed(1) + '%', p0 = v => Math.round(v * 100) + '%';
  const ex = {};
  ex[0] = 'Portada nueva: la presentación original no tiene portada. La lista resume los ocho bloques de la clase.';
  ex[1] = `Todo sale de una ResNet-50 real (ImageNet) aplicada a la foto del gato, una muestra de ImageNet de la clase «Egyptian cat»: los 64 filtros de la primera capa (pesos reales de 7×7×3, cada uno normalizado para verlo), los mapas de 3 de ellos (112×112), el mismo mapa después del max pooling (56×56), tres canales de la etapa 3 (14×14) que se encienden en ojos (463), nariz (273) y boca (44), y las 5 clases más probables. Corrección: las barras «gato, perro, conejo, coche, ave» del original eran ilustrativas. ImageNet no tiene una clase «gato» sino cinco clases de gato doméstico; sumadas dan ${p1(C.groups.gato)}, y perro, conejo, coche o ave quedan por debajo de 0.01% cada uno. El dorado que aparece al final sobre la foto es el mapa de activación de clase (CAM) de «gato egipcio»: Σ_c W[285, c] · mapa_c de la última capa (Zhou et al., 2016).`;
  ex[2] = `Cuentas reales. Una imagen de 224×224×3 tiene 150,528 valores; una sola capa densa de 1,000 neuronas sobre ella necesita 150,528,000 pesos más 1,000 sesgos: 5.9 veces los 25,557,032 parámetros de toda ResNet-50 (PyTorch). La primera capa convolucional de ResNet-50 usa 64 filtros de 7×7×3 = ${fmtN(Pm.conv1_w)} pesos y los aplica en 112×112 = 12,544 posiciones (paso 2). La ventana dorada que recorre la foto tiene el tamaño real de un filtro (7×7 píxeles). Jerarquía: «bordes» son 8 filtros reales de la primera capa; «texturas», los 4 parches de fotos de ImageNet que más activan el canal 72 de la etapa 2 (manteles a cuadros, pelotas de golf, tejidos); «partes», los que más activan el canal 962 de la etapa 3 (ojos de gato, de perro, de mono); «objeto», el CAM de la clase final. Se buscaron entre 439 fotos de muestra de ImageNet. La jerarquía es una tendencia, no una regla (Zeiler y Fergus, 2014).`;
  ex[3] = 'Diapositiva reorganizada: el diagrama de la montaña se sustituyó por un mapa de la clase. Cada situación se conecta con la herramienta que la ataca y con el número de diapositiva donde aparece.';
  ex[4] = (B ? `Los cinco números. ResNet-50: 25,557,032 parámetros en PyTorch. Nuestra CNN pequeña: ${fmtN(B.params)} (4 convoluciones de 3×3 con 32 y 64 filtros, 2 max pooling, una capa densa de 256 y la salida de 10). ImageNet-1K: 1,281,167 imágenes de entrenamiento; nuestro experimento: 2,000 imágenes de CIFAR-10 (200 por clase), 1,000 de validación y 1,000 de prueba. La curva es real: la CNN pequeña entrenada desde cero 60 épocas con Adam (lr = 0.001, lotes de 64) en PyTorch. Entrenamiento: ${p0(B.final.train)}; validación: ${p1(B.final.val)}. La brecha empieza a abrirse en la época ${B.early.ep}, donde la pérdida de validación toca su mínimo. ` : '') + 'El dato de generalización es de Mohanty, Hughes y Salathé (2016): GoogLeNet ajustada con transfer learning llegó a 99.35% en su conjunto de prueba de PlantVillage, pero a 31.4% con imágenes de hojas tomadas de internet, en condiciones distintas a las de entrenamiento. ' + (DATA.instab || '');
  ex[8] = (B ? `Curvas reales de la CNN pequeña (sin regularización) sobre 2,000 imágenes de CIFAR-10. Matiz importante: la accuracy de validación no empeora al final, se estanca (${p1(B.early.val)} en la época ${B.early.ep}, ${p1(B.final.val)} en la 60). Lo que se dispara es la pérdida de validación (de ${B.hist[B.early.ep - 1].va_loss.toFixed(2)} a ${B.hist[B.hist.length - 1].va_loss.toFixed(2)}): la red se equivoca con cada vez más seguridad. El «punto óptimo» depende del criterio: early stopping por pérdida de validación se detendría en la época ${B.early.ep}; por accuracy, más tarde. Por eso conviene vigilar las dos métricas. ` : '') + `Abajo: ajuste real por mínimos cuadrados de polinomios a los mismos 12 puntos con ruido (la curva punteada es la función verdadera). Grado 11: pasa exactamente por los 12 puntos (error 0.00) pero falla con 200 puntos nuevos (error cuadrático medio ${fmtN(DATA.poly.fits['11'].mse_va)}, por las oscilaciones en los extremos). Grado 3: error ${DATA.poly.fits['3'].mse_tr.toFixed(2)} en entrenamiento y ${DATA.poly.fits['3'].mse_va.toFixed(2)} con datos nuevos.`;
  ex[9] = 'La red del diagrama es ilustrativa. Cada → (o cada botón) sortea otra máscara con p = 0.5, como ocurre en cada mini-lote de entrenamiento; las neuronas de entrada y de salida no se apagan. ' + (B && Dd ? `Prueba real con las dos CNN pequeñas ya entrenadas (sin dropout y con dropout de p = 0.5 antes de cada capa densa): en inferencia apagamos al azar 128 de sus 256 neuronas ocultas (y multiplicamos por 2 las que quedan), 20 sorteos. Accuracy de validación: sin dropout, ${p1(B.final.val)} → ${p1(B.half_units.mean)} (pierde ${((B.final.val - B.half_units.mean) * 100).toFixed(1)} puntos); con dropout, ${p1(Dd.final.val)} → ${p1(Dd.half_units.mean)} (pierde ${((Dd.final.val - Dd.half_units.mean) * 100).toFixed(1)}). La red entrenada con dropout depende menos de cada neurona.` : '');
  ex[10] = 'En PyTorch, nn.Dropout aplica «inverted dropout»: durante el entrenamiento multiplica por 1/(1 − p) las neuronas que sobreviven, así que en inferencia (model.eval()) no hay que escalar nada. En el artículo original (Srivastava et al., 2014) el escalamiento se hacía al revés, multiplicando los pesos por (1 − p) en inferencia; el resultado esperado es el mismo. ' + (B && Dd ? `Curvas reales: pérdida de validación de la CNN pequeña sin y con dropout (p = 0.5), 60 épocas, misma semilla. Accuracy de validación: ${p1(B.final.val)} → ${p1(Dd.final.val)}; accuracy de prueba: ${p1(B.final.test)} → ${p1(Dd.final.test)}. Ambas llegan a 100% en entrenamiento, pero con dropout la pérdida de validación crece mucho menos: el efecto regularizador. El efecto es real pero moderado con tan pocos datos; el aumento de datos (diapositiva 14) ayuda más.` : '');

async function full() { try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); } catch (e) { hint('Usa la opción de pantalla completa de tu navegador.'); } }

$('#next').onclick = () => next(); $('#prev').onclick = () => prev(); $('#replay').onclick = () => { stopAdv(); go(cur); };
$('#play').onclick = toggleAdv; $('#hold').onchange = e => { hold = +e.target.value; store('dlup:hold', e.target.value); if (adv) checkIdle(); };
$('#mode').onchange = e => setMode(e.target.value); $('#index').onclick = openIndex; $('#notes').onclick = openNotes; $('#full').onclick = full;
document.querySelectorAll('[data-close]').forEach(b => { b.onclick = () => $('#' + b.dataset.close).close(); });
$('#index-list').onclick = e => { const b = e.target.closest('[data-slide]'); if (b) { $('#index-dialog').close(); go(+b.dataset.slide); } };
$('#viewport').addEventListener('click', e => { if (window.getSelection().toString()) return; if (e.composedPath().some(n => n.matches && n.matches('[contenteditable],a,button,input,select,textarea,[data-int]'))) return; next(); });
let tx = null;
$('#viewport').addEventListener('touchstart', e => { tx = e.target.closest('[data-int]') ? null : e.touches[0].clientX; }, {passive: true});
$('#viewport').addEventListener('touchend', e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if (dx > 60) prev(); else if (dx < -60) next(); }, {passive: true});
stage.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.store; if (k) store('dlup:' + k, e.target.textContent); });
document.addEventListener('keydown', e => {
  if (document.querySelector('dialog[open]')) return;
  const tg = e.target, k = e.key;
  if (tg.isContentEditable || ['SELECT', 'INPUT', 'TEXTAREA'].includes(tg.tagName)) { if (k === 'Escape') tg.blur(); return; }
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (tg.tagName === 'BUTTON' && (k === ' ' || k === 'Enter')) return;
  if ([' ', 'ArrowRight', 'PageDown', 'Enter'].includes(k)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(k)) { e.preventDefault(); prev(); }
  else if (k === 'ArrowDown') { e.preventDefault(); stopAdv(); if (cur < S.length - 1) go(cur + 1); }
  else if (k === 'ArrowUp') { e.preventDefault(); stopAdv(); if (cur > 0) show(cur - 1); }
  else if (k === 'Home') { stopAdv(); go(0); }
  else if (k === 'End') { stopAdv(); go(S.length - 1); }
  else {
    const c = k.toLowerCase();
    if (c === 'r') { stopAdv(); go(cur); } else if (c === 'c') setMode(mode === 'click' ? (store('dlup:auto') || 'auto:1') : 'click');
    else if (c === 'a') toggleAdv(); else if (c === 'g') openIndex(); else if (c === 'n') openNotes(); else if (c === 'f') full();
  }
});
document.addEventListener('fullscreenchange', () => { document.body.classList.toggle('fs', !!document.fullscreenElement); setTimeout(resize, 60); });
let uiT = null;
document.addEventListener('mousemove', () => { if (!document.body.classList.contains('fs')) return; document.body.classList.add('show-ui'); clearTimeout(uiT); uiT = setTimeout(() => document.body.classList.remove('show-ui'), 2400); });
window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { if (document.hidden) stopAdv(); });
window.addEventListener('beforeprint', () => {
  const deck = $('#print-deck'); deck.innerHTML = '';
  FINAL = true;
  try { S.forEach((s, i) => { const p = document.createElement('div'); p.className = 'print-page no-anim'; deck.appendChild(p); build(i, p); beatsOf(p).forEach(b => instantRun(() => sched(0, () => revealBeat(p, b)))); }); } finally { FINAL = false; }
});
window.addEventListener('afterprint', () => { $('#print-deck').innerHTML = ''; });
(() => {
  const m = store('dlup:mode'); if (m && [...$('#mode').options].some(o => o.value === m)) setMode(m, false);
  const h = store('dlup:hold'); if (h) { hold = +h; $('#hold').value = h; }
  const q = new URLSearchParams(location.hash.slice(1)), start = Math.max(0, Math.min(S.length - 1, (+q.get('slide') || 1) - 1));
  resize(); go(start);
  setTimeout(() => { $('#hint').style.opacity = 0; }, 8500);
})();
