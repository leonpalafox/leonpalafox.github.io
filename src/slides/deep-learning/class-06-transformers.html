.tf-bt p{margin:0 0 12px}.tf-bt b{color:var(--gold-d)}.tf-bt .mu{color:var(--muted);font-size:15.5px}
.tf-ill{position:absolute;padding:2px 9px;border-radius:999px;background:#ece6d8;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;white-space:nowrap}
.tf-ban{position:absolute;display:flex;align-items:center;justify-content:center;gap:16px;padding:14px 26px;border-radius:14px;background:var(--gold-d);color:#fff;font-size:23px;font-weight:700;letter-spacing:-.005em;white-space:nowrap}
.tf-ban.navy{background:var(--navy)}.tf-ban b{color:var(--gold-l)}
.tf-eq{font-family:var(--math);font-style:italic;font-size:26px;line-height:1.5;white-space:nowrap}
.tf-eq .u{font-style:normal;font-family:var(--sans)}.tf-eq sub,.tf-eq sup{font-size:.62em}
.tf-x{color:var(--red);font-weight:700}.tf-ok{color:var(--green);font-weight:700}
.tf-dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px}
/* tokens */
.tf-toks{position:absolute;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tf-tk{display:inline-block;padding:6px 13px;border-radius:9px;border:1.5px solid var(--hair2);background:var(--card);font-size:19px;color:var(--ink);white-space:nowrap;transition:background-color .4s,border-color .4s,color .4s,box-shadow .4s,opacity .4s,transform .75s cubic-bezier(.2,.75,.25,1) var(--dl,0s)}
.tf-tk.src{background:var(--blue-l);border-color:#a9bcd8}
.tf-tk.tgt{background:#f8e3d9;border-color:#e7b9a3}
.tf-tk.id{font-family:var(--mono);font-size:17px}
.tf-tk.sp{font-family:var(--mono);font-size:15px;color:var(--muted);background:#ece9e2}
.tf-tk.q{border-style:dashed;color:var(--muted);background:transparent}
.tf-tk.on{background:var(--gold);border-color:var(--gold);color:#fff;box-shadow:0 4px 12px rgba(138,108,52,.3)}
.tf-tk.cur{box-shadow:0 0 0 4px rgba(182,151,88,.35);border-color:var(--gold)}
.tf-tk.fut{opacity:.32}.tf-tk.hit{background:var(--gold-l);border-color:var(--gold)}
.tf-tk.abs{position:absolute}
/* vectors: a strip of cells */
.tf-vec{display:inline-flex;gap:2px;padding:3px;border-radius:6px;background:#fff;border:1px solid var(--hair);vertical-align:middle}
.tf-vec i{display:block;width:9px;height:20px;border-radius:2px}
.tf-vec.sm i{width:6px;height:14px}
.tf-vec.v i{width:20px;height:9px}.tf-vec.v{flex-direction:column}
/* blocks, frames, operators (architecture diagram) */
.tf-blk{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid var(--c);border-radius:10px;background:color-mix(in srgb,var(--c) 11%,var(--card));font-size:16px;font-weight:600;color:var(--ink);text-align:center;line-height:1.15;transition:opacity .5s ease var(--dl,0s),transform .7s cubic-bezier(.3,1.5,.5,1) var(--dl,0s),box-shadow .4s,background-color .4s}
.tf-blk.sm{font-size:12.5px;font-weight:600;border-width:1.5px;border-radius:7px}
.tf-blk.lit{box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 24%,transparent);background:color-mix(in srgb,var(--c) 28%,var(--card))}
.tf-frame{position:absolute;border:2px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:16px;background:color-mix(in srgb,var(--c) 5%,transparent);transition:opacity .5s ease var(--dl,0s),box-shadow .4s}
.tf-frame.lit{box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 18%,transparent);border-color:var(--c)}
.tf-op{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:2px solid var(--pe);background:var(--paper);display:flex;align-items:center;justify-content:center;font:700 17px var(--sans);color:var(--pe);line-height:1;transition:opacity .5s ease var(--dl,0s),box-shadow .4s}
.tf-op.lit{box-shadow:0 0 0 6px rgba(31,138,138,.22);background:#d9efee}
.tf-al{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:15px;color:var(--muted);text-align:center;line-height:1.2;transition:opacity .5s ease var(--dl,0s),color .4s}
.tf-al.l{transform:translate(0,-50%);text-align:left}.tf-al.r{transform:translate(-100%,-50%);text-align:right}
.tf-al.big{font-size:20px;font-weight:700;color:var(--ink)}.tf-al.lit{color:var(--gold-d);font-weight:700}
.tf-arch{position:absolute;transform-origin:0 0;width:600px;height:640px}
.tf-arch>svg{position:absolute;left:0;top:0;overflow:visible}
.tf-w{fill:none;stroke:var(--wire);stroke-width:2.2;stroke-linejoin:round;transition:stroke .4s,stroke-width .4s,opacity .5s ease var(--dl,0s)}
.tf-w.lit{stroke:var(--gold-d);stroke-width:3.4}
.tf-arch.dimx .tf-e:not(.lit):not([data-fx]:not(.in)){opacity:.22}
.tf-arch[data-arch=mini].dimx .tf-e:not(.lit):not([data-fx]:not(.in)){opacity:.45}
.tf-here{position:absolute;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tf-mini{position:absolute;border-radius:14px;border:1px solid var(--hair);background:rgba(251,249,244,.7)}
/* matrices */
.tf-mat{position:absolute;display:grid;gap:3px;font-variant-numeric:tabular-nums}
.tf-mat .c{display:flex;align-items:center;justify-content:center;border-radius:6px;background:var(--card);border:1px solid var(--hair);font:600 15px var(--mono);color:var(--ink);transition:background-color .5s,color .5s,opacity .5s,box-shadow .4s}
.tf-mat .c.cur{box-shadow:inset 0 0 0 2px var(--gold)}
.tf-mat .h{display:flex;align-items:center;justify-content:center;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:visible}
.tf-mat .h.r{justify-content:flex-end;padding-right:6px}
.tf-mat .c.x{background:repeating-linear-gradient(45deg,#ece9e2 0 6px,#e2ded5 6px 12px);border-color:transparent;color:transparent}
.tf-mat .c.e{background:transparent;border-style:dashed;color:transparent}
.tf-mat .c.tiny{font-size:12px}
.tf-mlab{position:absolute;font:italic 22px var(--math);color:var(--ink)}.tf-mlab small{font:13px var(--sans);color:var(--muted);font-style:normal;margin-left:6px}
/* bars */
.tf-bars{position:absolute;display:flex;flex-direction:column;gap:7px}
.tf-bar{display:flex;align-items:center;gap:10px;font-size:17px;white-space:nowrap}
.tf-bar span{width:var(--lw,110px);text-align:right;color:var(--ink)}
.tf-bar i{display:block;height:18px;border-radius:5px;background:var(--c,var(--gold));transition:width .6s cubic-bezier(.4,0,.2,1)}
.tf-bar b{font:600 15px var(--mono);color:var(--ink)}
.tf-bar.top span{font-weight:700}.tf-bar.top b{color:var(--gold-d)}
/* cards */
.tf-cardh{display:flex;align-items:center;gap:10px;margin:18px 22px 0;font-size:22px}.tf-cardh svg{width:26px;height:26px;stroke:var(--gold-d);fill:none;stroke-width:1.7;flex:none}
.tf-cardt{margin:8px 22px 0;font-size:19px;line-height:1.38}.tf-cardt b{color:var(--gold-d)}
.tf-cardm{margin:8px 22px 0;font-size:15px;line-height:1.4;color:var(--muted)}
.tf-pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.04em;color:#fff;background:var(--c)}
.tf-two{position:absolute;display:flex;gap:14px;font-size:19px;line-height:1.35}.tf-two>span{flex:none;display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--gold);color:#fff;font-weight:700}.tf-two b{color:var(--gold-d)}
/* tables */
.tf-tb{position:absolute;display:grid;border:1px solid var(--hair);border-radius:14px;overflow:hidden;background:var(--card)}
.tf-tb>span{padding:9px 16px;font-size:17px;line-height:1.3;border-top:1px solid var(--hair)}
.tf-tb>span.h{border-top:0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-d);font-weight:700;background:rgba(182,151,88,.1)}
.tf-tb>span.l{font-weight:700}.tf-tb .mo{font-family:var(--mono);font-size:16px}.tf-tb b{color:var(--gold-d)}
.tf-tb .hc{font-size:15px;letter-spacing:.06em;text-transform:none}
/* stage rows (token flow) */
.tf-sr{position:absolute;left:0;right:0;height:66px;display:flex;align-items:center;border-radius:12px;transition:opacity .45s,background-color .4s,box-shadow .4s}
.tf-sr.past{opacity:.5}.tf-sr.cur{background:rgba(182,151,88,.12);box-shadow:inset 3px 0 0 var(--gold)}
.tf-sr>b{position:absolute;left:16px;width:170px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-d)}
.tf-sr>em{position:absolute;right:16px;font:600 14px var(--mono);font-style:normal;color:var(--muted)}
.tf-sc{position:absolute;transform:translateX(-50%);display:flex;align-items:center;gap:6px}
.tf-lay{display:inline-flex;gap:4px;margin-left:10px}.tf-lay i{display:block;width:12px;height:12px;border-radius:3px;background:rgba(20,36,56,.1);transition:background-color .3s}.tf-lay i.on{background:var(--enc)}
/* attention arcs */
.tf-arcs{position:absolute;overflow:visible}
.tf-arcs path{fill:none;stroke:var(--att);stroke-linecap:round;transition:stroke-width .5s,opacity .5s}
.tf-arcs text{font:600 13px var(--mono);fill:var(--ink)}
.tf-arcs .gw{fill:var(--gold);transition:height .5s,y .5s}
/* variant columns */
.tf-vcard{position:absolute;top:0;height:536px;border-radius:16px;border:1px solid var(--hair);border-top:6px solid var(--c);background:var(--card)}
.tf-vcard>h3{margin:16px 22px 0;font-size:25px;color:var(--c)}
.tf-vrow{margin:0 22px;padding:8px 0;border-top:1px solid var(--hair);font-size:16.5px;line-height:1.35}.tf-vrow>i{display:block;font-style:normal;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:2px}
.tf-vdia{position:relative;height:150px;margin:10px 22px 6px}
.tf-mt{position:absolute;font-size:19px;font-weight:700;white-space:nowrap}
/* timeline */
.tf-tl{position:absolute;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-d))}
.tf-ev{position:absolute;display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:180px}
.tf-ev i{display:block;width:28px;height:28px;border-radius:50%;background:var(--paper);border:4px solid var(--c,var(--gold));margin-bottom:8px}
.tf-ev b{font-size:20px}.tf-ev span{font-size:16.5px;font-weight:700;color:var(--c,var(--gold-d));line-height:1.25}.tf-ev em{font-style:normal;font-size:13.5px;color:var(--muted);line-height:1.3}
.tf-5l{position:absolute;display:flex;align-items:center;gap:24px;width:1428px;font-size:24px;padding-bottom:13px;border-bottom:1px solid var(--hair)}
.tf-5l>span{width:190px;flex:none;font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-d);font-weight:700}.tf-5l b{color:var(--gold-d)}
.tf-cell{position:absolute;display:flex;align-items:center;justify-content:center;border:2px solid var(--c);border-radius:12px;background:color-mix(in srgb,var(--c) 9%,var(--card));font:italic 21px var(--math);color:var(--ink)}
.tf-badge{position:absolute;padding:2px 10px;border-radius:999px;background:var(--navy);color:var(--gold);font-size:13px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
.tf-loop{position:absolute;font-size:15px;color:var(--gold-d);font-weight:700;white-space:nowrap}
.tf-quote{position:absolute;font-family:var(--serif);font-size:34px;font-style:italic;color:var(--ink);white-space:nowrap}
.tf-quote b{font-style:normal;font-family:var(--sans);background:var(--gold-l);padding:0 8px;border-radius:6px}
.tf-tb.big>span{font-size:19px;padding:13px 18px}
.tf-bub{transform-box:fill-box;transform-origin:center}

function LC(x1, y1, r1, x2, y2, r2, o = {}) {

const stage = $('#stage');

let cur = 0, beat = 0, runId = 0, pend = [], tweens = new Set(), INSTANT = false, FINAL = false, iq = [], icur = 0, iseq = 0;
let mode = 'auto', tempo = 1, adv = false, advTimer = null, hold = 8000;
const RM = matchMedia('(prefers-reduced-motion: reduce)');
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } return null; };
const section = i => (S[i] && S[i].sec) || '';

function frame(i) {
  const s = S[i], dark = ['cover', 'divider', 'question'].includes(s.layout), n = String(i + 1).padStart(2, '0');
  const head = `<div class="hd"${F(0, 'fade')}><span class="wm"><img src="${LOGO.up}" alt="${LOGO_ALT.up}"></span><span class="sec">${section(i)}</span></div>`;
  const eb = s.layout === 'cover' ? '' : `<div class="eb"${F(0, 'left', 150)}>${s.kicker || n}</div>`;
  const tl = s.title.length, h = s.layout === 'cover' ? '' : `<h1 class="tt${tl > 54 ? ' l2' : tl > 40 ? ' l1' : ''}"${F(0, 'words', 220)}>${esc(s.title)}</h1>`;
  const body = s.body ? s.body(i) : '';
  return `<article class="slide s${i + 1} ${s.layout}${dark ? ' dark' : ''}" aria-label="Slide ${i + 1}: ${esc(s.title)}">${head}${eb}${h}${s.free ? `<div class="free">${body}</div>` : `<div class="ct">${body}</div>`}<div class="ft"${F(0, 'fade', 450)}><span class="ft-l"><img class="ing" src="${LOGO.ing}" alt="${LOGO_ALT.ing}"><span>Deep Learning · Dr. León Palafox</span></span><span>${n} / ${S.length}</span></div><div class="prog" style="width:${((i + 1) / S.length * 100).toFixed(2)}%"></div></article>`;
}
/* split text into words / letters / typed characters */
function splitText(el, make) {
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [];
  while (w.nextNode()) nodes.push(w.currentNode);
  let k = 0;
  nodes.forEach(n => { const f = document.createDocumentFragment(); make(n.nodeValue, f, () => k++); n.parentNode.replaceChild(f, n); });
  return k;
}
function prep(root) {
  root.querySelectorAll('[data-fx=words]').forEach(e => splitText(e, (t, f, nx) => t.split(/(\s+)/).forEach(p => {
    if (!p) return; if (/^\s+$/.test(p)) { f.appendChild(document.createTextNode(p)); return; }
    const o = document.createElement('span'), i = document.createElement('span'); o.className = 'w'; i.textContent = p; i.style.setProperty('--wi', nx()); o.appendChild(i); f.appendChild(o);
  })));
  root.querySelectorAll('[data-fx=letters]').forEach(e => splitText(e, (t, f, nx) => [...t].forEach(c => {
    if (/\s/.test(c)) { f.appendChild(document.createTextNode(c)); return; }
    const s = document.createElement('span'); s.className = 'lt'; s.textContent = c; s.style.setProperty('--wi', nx()); f.appendChild(s);
  })));
  root.querySelectorAll('[data-fx=type]').forEach(e => { e._n = splitText(e, (t, f, nx) => [...t].forEach(c => { const s = document.createElement('span'); s.className = 'ch'; s.textContent = c; s.style.setProperty('--c', nx()); f.appendChild(s); })); });
  root.querySelectorAll('[data-store]').forEach(e => { const v = store('dlup:' + e.dataset.store); if (v) e.textContent = v; });
}
function build(i, root) { root._ctl = null; root.innerHTML = frame(i); root.dataset.i = i; prep(root); }
const beatsOf = root => { const s = S[+root.dataset.i], set = new Set([...root.querySelectorAll('[data-b]')].map(e => +e.dataset.b)); if (s && s.run) Object.keys(s.run).forEach(k => set.add(+k)); return [...set].sort((a, b) => a - b); };

/* scheduler: real timers when live, a discrete event loop when rendering a final state */
function sched(ms, fn) {
  if (INSTANT) { iq.push({at: icur + Math.max(0, ms), fn, s: iseq++}); return; }
  const my = runId, item = {due: performance.now() + ms, fn};
  item.id = setTimeout(() => { const k = pend.indexOf(item); if (k >= 0) pend.splice(k, 1); if (my === runId) { try { fn(); } catch (err) { console.error(err); } } checkIdle(); }, ms);
  pend.push(item);
}
function instantRun(seed) {
  const pI = INSTANT, pq = iq, pc = icur; INSTANT = true; iq = []; icur = 0;
  try {
    seed(); let guard = 0;
    while (iq.length && guard++ < 50000) {
      let m = 0; for (let k = 1; k < iq.length; k++) if (iq[k].at < iq[m].at || (iq[k].at === iq[m].at && iq[k].s < iq[m].s)) m = k;
      const it = iq.splice(m, 1)[0]; icur = it.at; try { it.fn(); } catch (err) { console.error(err); }
    }
  } finally { INSTANT = pI; iq = pq; icur = pc; }
}
const eio = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
function tween(dur, step, ease = eio) {
  if (INSTANT || RM.matches) { step(1); return; }
  const my = runId, t0 = performance.now(), tw = {done: false, finish() { if (tw.done) return; tw.done = true; tweens.delete(tw); step(1); }};
  tweens.add(tw);
  const f = now => {
    if (tw.done) return; if (my !== runId) { tw.done = true; tweens.delete(tw); return; }
    const p = Math.min(1, Math.max(0, (now - t0) / dur)); step(ease(p));
    if (p >= 1) { tw.done = true; tweens.delete(tw); checkIdle(); } else requestAnimationFrame(f);
  };
  requestAnimationFrame(f);
}
function countUp(e, d) {
  const to = +e.dataset.count, dec = +(e.dataset.dec || 0), suf = e.dataset.suf || '', show = v => { e.textContent = (e.dataset.sep ? Math.round(v).toLocaleString('en-US') : v.toFixed(dec)) + suf; };
  if (INSTANT || RM.matches) { show(to); return; }
  show(0); sched(d, () => tween(1100, p => show(to * p), p => 1 - Math.pow(1 - p, 3)));
}
function revealBeat(root, b) {
  if (!INSTANT) void root.offsetWidth;
  let k = 0, tacc = 0;
  root.querySelectorAll(`[data-b="${b}"]`).forEach(e => {
    let d = +(e.dataset.d || 0);
    if (e.dataset.fx === 'type') { const sp = +(e.dataset.sp || TYPE_SP); e.style.setProperty('--sp', sp + 'ms'); d += tacc; tacc = d + (e._n || 0) * sp + 160; }
    else d += (e.dataset.i != null ? +e.dataset.i : k++) * (+(e.dataset.st || STAG));
    e.style.setProperty('--dl', INSTANT ? '0ms' : Math.round(d) + 'ms');
    e.classList.add('in');
    if (e.dataset.count != null) countUp(e, d); else e.querySelectorAll('[data-count]:not([data-b])').forEach(x => countUp(x, d));
  });
  const s = S[+root.dataset.i], fn = s.run && s.run[b];
  if (fn) fn(api(root));
}
function api(root) {
  return {root, t: sched, tw: tween, ctl: c => (root._ctl = c), final: () => FINAL, q: s => root.querySelector(s), qa: s => [...root.querySelectorAll(s)],
    k: n => root.querySelector(`[data-k="${n}"]`), ks: n => [...root.querySelectorAll(`[data-k="${n}"]`)],
    on: (els, ms = 0, cls = 'on') => [].concat(els).forEach(e => e && sched(ms, () => e.classList.add(cls)))};
}
/* auto mode: when does each beat start? */
function timesFor(root, bs) {
  const s = S[+root.dataset.i], out = [];
  let t = 0;
  bs.forEach((b, k) => {
    if (k === 0) { out.push(0); return; }
    if (k === 1) t = 750 * tempo;
    else {
      const pb = bs[k - 1]; let n = 0, typ = 0, maxd = 0, st = STAG;
      root.querySelectorAll(`[data-b="${pb}"]`).forEach(e => {
        const d = +(e.dataset.d || 0);
        if (e.dataset.fx === 'type') typ = Math.max(typ, d) + (e._n || 0) * (+(e.dataset.sp || TYPE_SP)) + 160;
        else { if (e.dataset.i == null) n++; if (e.dataset.st) st = +e.dataset.st; maxd = Math.max(maxd, d); }
      });
      t += Math.max(700, (n - 1) * st + 650) * tempo + typ + maxd + ((s.len && s.len[pb]) || 0);
    }
    if (s.gap && s.gap[b]) t += s.gap[b] * tempo;
    out.push(t);
  });
  return out;
}
const busy = () => pend.length > 0 || tweens.size > 0;
function cancelAll() { if (stage._ctl && stage._ctl.stop) stage._ctl.stop(); runId++; pend.forEach(p => clearTimeout(p.id)); pend = []; tweens.forEach(t => { t.done = true; }); tweens.clear(); clearTimeout(advTimer); }
function checkIdle() { updateStatus(); if (busy()) return; clearTimeout(advTimer); if (adv) advTimer = setTimeout(() => { if (adv && !busy()) next(true); }, hold); }
function flush() {
  const items = pend.slice().sort((a, b) => a.due - b.due), t0 = performance.now();
  pend.forEach(p => clearTimeout(p.id)); pend = [];
  stage.classList.add('no-anim');
  [...tweens].forEach(t => t.finish());
  instantRun(() => items.forEach(it => sched(Math.max(0, it.due - t0), it.fn)));
  void stage.offsetWidth; stage.classList.remove('no-anim');
  checkIdle();
}
function go(i) {
  const oldW = (stage.querySelector('.prog') || {}).style?.width;
  cancelAll(); cur = i; beat = 0;
  build(i, stage);
  const pg = stage.querySelector('.prog');
  if (oldW && pg) { const w = pg.style.width; pg.style.width = oldW; void pg.offsetWidth; pg.style.width = w; }
  const bs = beatsOf(stage);
  if (mode === 'auto') { const ts = timesFor(stage, bs); bs.forEach((b, k) => sched(ts[k], () => { beat = Math.max(beat, b); revealBeat(stage, b); })); }
  else sched(0, () => revealBeat(stage, 0));
  setHash(); updateUI();
}
function show(i, upto = Infinity) {
  cancelAll(); cur = i; stage.classList.add('no-anim');
  build(i, stage);
  const bs = beatsOf(stage).filter(b => b <= upto);
  FINAL = true; try { bs.forEach(b => instantRun(() => sched(0, () => revealBeat(stage, b)))); } finally { FINAL = false; }
  beat = bs.length ? bs[bs.length - 1] : 0;
  void stage.offsetWidth; stage.classList.remove('no-anim');
  setHash(); updateUI(); checkIdle();
}
function next(fromAuto) {
  if (!fromAuto) stopAdv();
  if (busy()) { flush(); return; }
  const c = stage._ctl; if (c && c.next(fromAuto)) { updateStatus(); return; }   /* an interactive slide consumes the step first */
  if (mode === 'click') { const nb = beatsOf(stage).find(b => b > beat); if (nb != null) { beat = nb; revealBeat(stage, nb); checkIdle(); return; } }
  if (cur < S.length - 1) go(cur + 1); else stopAdv();
}
function prev() {
  stopAdv();
  const c = stage._ctl; if (c && c.prev()) return;
  if (mode === 'click') { const bs = beatsOf(stage).filter(b => b > 0 && b <= beat); if (bs.length) { show(cur, bs.length > 1 ? bs[bs.length - 2] : 0); return; } }
  if (cur > 0) show(cur - 1);
}
/* ---------- UI ---------- */
function setHash() { try { history.replaceState(null, '', `#slide=${cur + 1}`); } catch (e) { /* sandboxed */ } }
function updateStatus() {
  const ev = $('#event'); if (!ev) return;
  if (mode === 'click') { const bs = beatsOf(stage).filter(b => b > 0), k = bs.filter(b => b <= beat).length; ev.textContent = bs.length ? `Step ${k} / ${bs.length}` : ''; }
  else ev.textContent = busy() ? 'Animating… (→ completes)' : 'Ready';
}
function updateUI() {
  $('#position').textContent = `${String(cur + 1).padStart(2, '0')} / ${S.length}`;
  $('#play').classList.toggle('active', adv); $('#play').textContent = adv ? 'Ⅱ Pause' : '▶ Auto';
  updateStatus();
}
function stopAdv() { if (!adv) return; adv = false; clearTimeout(advTimer); updateUI(); }
function toggleAdv() { adv = !adv; updateUI(); if (adv) checkIdle(); else clearTimeout(advTimer); }
function setMode(v, replay = true) {
  if (v === 'click') mode = 'click'; else { mode = 'auto'; tempo = +(v.split(':')[1]) || 1; store('dlup:auto', v); }
  store('dlup:mode', v); $('#mode').value = v; if (replay) go(cur); else updateUI();
}
function resize() { const v = $('#viewport'), sc = Math.min(v.clientWidth / 1600, v.clientHeight / 900); stage.style.transform = `scale(${sc})`; stage.style.left = (v.clientWidth - 1600 * sc) / 2 + 'px'; stage.style.top = (v.clientHeight - 900 * sc) / 2 + 'px'; }
function openIndex() { stopAdv(); $('#index-list').innerHTML = S.map((s, i) => `<button class="${i === cur ? 'current' : ''}" data-slide="${i}"><b>${String(i + 1).padStart(2, '0')}</b>${esc(s.title)}</button>`).join(''); $('#index-dialog').showModal(); }
function openNotes() {
  stopAdv(); const s = S[cur];
  $('#notes-title').textContent = s.title;
  $('#notes-content').innerHTML = `<b>Speaker guide</b>\n${esc((s.points || []).join('\n'))}${s.extra ? `\n\n<b>About this animated version</b>\n${esc(s.extra)}` : ''}\n\n<b>Source material · ${s.on ? `${s.on} of the original` : 'new slide'}</b>\n${esc(s.original || '')}\n\n<b>Sources and credits</b>\nText: Transformers.pptx, material provided by the professor, reorganized as LSTM → attention → mechanism → architecture → token flow → the three variants; every diagram was rebuilt as animated HTML. Numbers: mock examples for visualization (attention weights, token IDs, probabilities and vectors are invented and labelled as such); the scaled dot-product example and the softmax values are computed exactly in the page from hand-picked numbers; the positional-encoding heat map is the paper's formula; parameter counts are computed by formula; model sizes and training facts come from the cited papers. No model was trained or run.\nLogos: Universidad Panamericana and Ingenierías UP · Posgrados, from the professor's material. Each brand belongs to its owner.\nUP brand guidelines: <a href="https://www.up.edu.mx/marca-institucional/marca/" target="_blank" rel="noopener">https://www.up.edu.mx/marca-institucional/marca/</a>${s.sources.map(u => `\n<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join('')}`;
  $('#notes-dialog').showModal();
}
function hint(t) { const h = $('#hint'); h.textContent = t; h.style.opacity = 1; setTimeout(() => { h.style.opacity = 0; }, 4000); }
async function full() { try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); } catch (e) { hint('Use your browser\'s full-screen option.'); } }

$('#next').onclick = () => next(); $('#prev').onclick = () => prev(); $('#replay').onclick = () => { stopAdv(); go(cur); };
$('#play').onclick = toggleAdv; $('#hold').onchange = e => { hold = +e.target.value; store('dlup:hold', e.target.value); if (adv) checkIdle(); };
$('#mode').onchange = e => setMode(e.target.value); $('#index').onclick = openIndex; $('#notes').onclick = openNotes; $('#full').onclick = full;
document.querySelectorAll('[data-close]').forEach(b => { b.onclick = () => $('#' + b.dataset.close).close(); });
$('#index-list').onclick = e => { const b = e.target.closest('[data-slide]'); if (b) { $('#index-dialog').close(); go(+b.dataset.slide); } };
$('#viewport').addEventListener('click', e => { if (window.getSelection().toString()) return; if (e.composedPath().some(n => n.matches && n.matches('[contenteditable],a,button,input,select,textarea,[data-int]'))) return; next(); });
let tx = null;
$('#viewport').addEventListener('touchstart', e => { tx = e.target.closest('[data-int]') ? null : e.touches[0].clientX; }, {passive: true});
$('#viewport').addEventListener('touchend', e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if (dx > 60) prev(); else if (dx < -60) next(); }, {passive: true});
stage.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.store; if (k) store('dlup:' + k, e.target.textContent); });
document.addEventListener('keydown', e => {
  if (document.querySelector('dialog[open]')) return;
  const tg = e.target, k = e.key;
  if (tg.isContentEditable || ['SELECT', 'INPUT', 'TEXTAREA'].includes(tg.tagName)) { if (k === 'Escape') tg.blur(); return; }
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (tg.tagName === 'BUTTON' && (k === ' ' || k === 'Enter')) return;
  if ([' ', 'ArrowRight', 'PageDown', 'Enter'].includes(k)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(k)) { e.preventDefault(); prev(); }
  else if (k === 'ArrowDown') { e.preventDefault(); stopAdv(); if (cur < S.length - 1) go(cur + 1); }
  else if (k === 'ArrowUp') { e.preventDefault(); stopAdv(); if (cur > 0) show(cur - 1); }
  else if (k === 'Home') { stopAdv(); go(0); }
  else if (k === 'End') { stopAdv(); go(S.length - 1); }
  else {
    const c = k.toLowerCase();
    if (c === 'r') { stopAdv(); go(cur); } else if (c === 'c') setMode(mode === 'click' ? (store('dlup:auto') || 'auto:1') : 'click');
    else if (c === 'a') toggleAdv(); else if (c === 'g') openIndex(); else if (c === 'n') openNotes(); else if (c === 'f') full();
  }
});
document.addEventListener('fullscreenchange', () => { document.body.classList.toggle('fs', !!document.fullscreenElement); setTimeout(resize, 60); });
let uiT = null;
document.addEventListener('mousemove', () => { if (!document.body.classList.contains('fs')) return; document.body.classList.add('show-ui'); clearTimeout(uiT); uiT = setTimeout(() => document.body.classList.remove('show-ui'), 2400); });
window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { if (document.hidden) stopAdv(); });
window.addEventListener('beforeprint', () => {
  const deck = $('#print-deck'); deck.innerHTML = '';
  FINAL = true;
  try { S.forEach((s, i) => { const p = document.createElement('div'); p.className = 'print-page no-anim'; deck.appendChild(p); build(i, p); beatsOf(p).forEach(b => instantRun(() => sched(0, () => revealBeat(p, b)))); }); } finally { FINAL = false; }
});
window.addEventListener('afterprint', () => { $('#print-deck').innerHTML = ''; });
(() => {
  const m = store('dlup:mode'); if (m && [...$('#mode').options].some(o => o.value === m)) setMode(m, false);
  const h = store('dlup:hold'); if (h) { hold = +h; $('#hold').value = h; }
  const q = new URLSearchParams(location.hash.slice(1)), start = Math.max(0, Math.min(S.length - 1, (+q.get('slide') || 1) - 1));
  resize(); go(start);
  setTimeout(() => { $('#hint').style.opacity = 0; }, 8500);
})();
</script></body></html>
