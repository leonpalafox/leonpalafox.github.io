const SEC = ['Embeddings', 'De píxeles a vectores', 'Del clasificador al encoder', 'Aplicaciones', 'Buenas prácticas'];
const NEWSLIDE = 'Diapositiva nueva: no forma parte de cnn_embeddings_slides_1_22_1.pptx. Todos sus números salen de una ResNet-50 real.';
const META = [
  {title: 'Embeddings en CNN', layout: 'cover', sec: SEC[0], points: ['De una imagen a un vector.', 'Dr. León Felipe Palafox Novack', 'lfpalafox@up.edu.mx'],
    original: 'Embeddings en CNN\nDe una imagen a un vector\n(diagrama: foto de un lago de montaña → CNN (backbone) → embedding visual [0.42, -0.13, 0.87, …, 0.31, -0.75, 0.55, 0.04])\nDr. Leon Felipe Palafox Novack', sources: []},
  {title: 'La idea central', layout: 'split', sec: SEC[0], points: ['Una CNN hace más que clasificar imágenes.', 'Antes de producir una etiqueta, la red construye una representación numérica de la imagen.', 'Esa representación es el embedding.'],
    original: 'La idea central\nUna CNN hace más que clasificar imágenes.\nAntes de producir una etiqueta, la red construye una representación numérica de la imagen.\nEsa representación es el embedding.\n(Imagen → Convoluciones → Feature maps → Embedding → Clasificador → Clase; «Backbone visual» y «Head de clasificación»)', sources: []},
  {title: '¿Qué es un embedding?', layout: 'split', sec: SEC[0], points: ['Un embedding es un vector que representa un objeto.', 'En visión por computadora, representa una imagen como una lista de números.', 'La meta es que el vector capture información visual útil: forma, textura, partes, color, estilo, identidad del objeto, similitud visual.', 'Dos fotos del mismo perro quedan cerca; el perro y el auto, lejos.'],
    original: '¿Qué es un embedding?\nUn embedding es un vector que representa un objeto.\nEn visión por computadora, representa una imagen como una lista de números.\nLa meta es que el vector capture información visual útil: forma, textura, partes, color, estilo, identidad del objeto, similitud visual.\n(v1 = [0.4, -1.2, 0.8, …], v2 = [0.5, -1.0, 0.7, …], v3 = [-2.1, 0.3, 1.9, …]; distancia(v1, v2) = pequeña; distancia(v1, v3) = grande)', sources: []},
  {title: 'No queremos comparar píxeles', layout: 'split', sec: SEC[0], points: ['Los píxeles son frágiles.', 'Dos imágenes del mismo objeto pueden tener valores de píxel muy distintos por iluminación, escala, rotación, fondo, perspectiva u oclusión.', 'El embedding busca capturar significado visual, no solo píxeles.'],
    original: 'No queremos comparar imágenes como pixeles\nLos pixeles son frágiles.\nDos imágenes del mismo objeto pueden tener valores de pixel muy distintos por: iluminación, escala, rotación, fondo, perspectiva, oclusión.\nEl embedding busca capturar significado visual, no solo pixeles.\n(cuatro fotos del mismo tenis: «Pixeles diferentes» → «Embeddings cercanos»)', sources: []},
  {title: 'Mismo perro, otros píxeles', layout: 'split', sec: SEC[0], kicker: 'Experimento', points: ['Transformamos la misma foto seis veces y medimos dos cosas: cuántos píxeles cambian y cuánto cambia el embedding.', 'Los píxeles cambian hasta 97%; la similitud del embedding se queda entre 0.92 y 0.98.', 'La red sigue diciendo «golden retriever» en todos los casos.'],
    original: NEWSLIDE, sources: []},
  {title: 'Embeddings como coordenadas', layout: 'split', sec: SEC[0], points: ['Después de pasar por una CNN, cada imagen se vuelve un punto.', 'La posición del punto depende de lo que la red aprendió a reconocer.', 'Imágenes similares deberían quedar cerca; imágenes diferentes, lejos.'],
    original: 'Embeddings como coordenadas en un espacio visual\nDespués de pasar por una CNN, cada imagen se vuelve un punto.\nLa posición del punto depende de lo que la red aprendió a reconocer.\nImágenes similares deberían quedar cerca.\nImágenes diferentes deberían quedar lejos.\n(proyección 2D de un espacio de muchas dimensiones: perros, autos, tenis y sillas)', sources: ['https://www.jmlr.org/papers/v9/vandermaaten08a.html']},
  {title: 'Recordatorio: una CNN clasificadora', layout: 'split', sec: SEC[1], points: ['Una CNN clasificadora tiene dos partes principales.', 'Backbone: aprende características visuales.', 'Head de clasificación: convierte la representación en probabilidades de clase.'],
    original: 'Recordatorio: estructura típica de una CNN clasificadora\nUna CNN clasificadora tiene dos partes principales.\nBackbone: aprende características visuales.\nHead de clasificación: convierte la representación en probabilidades de clase.\n(Imagen de entrada → Conv + ReLU → Pooling → Conv + ReLU → Pooling → Conv blocks profundos → Global Average Pooling / Flatten → Vector de representación → Capa final → Softmax → Clases)', sources: ['https://arxiv.org/abs/1512.03385']},
  {title: 'De píxeles a patrones locales', layout: 'split', sec: SEC[1], points: ['Las primeras capas detectan patrones simples: bordes, esquinas, texturas, cambios de color, líneas orientadas.', 'Estas capas todavía están cerca del mundo de los píxeles.'],
    original: 'De pixeles a patrones locales\nLas primeras capas detectan patrones simples.\nEjemplos: bordes, esquinas, texturas, cambios de color, líneas orientadas.\nEstas capas todavía están cerca del mundo de los pixeles.\n(Imagen de entrada → Conv layer 1: filtros aprendidos (pesos de la convolución) → Feature maps iniciales: respuestas de los filtros sobre la imagen)', sources: []},
  {title: 'De patrones locales a conceptos visuales', layout: 'split', sec: SEC[1], points: ['Las capas profundas combinan patrones simples en conceptos más complejos.', 'La red aprende combinaciones de bordes, texturas, partes de objetos, formas y configuraciones visuales.', 'La jerarquía es una tendencia, no una regla rígida ni exclusiva.'],
    original: 'De patrones locales a conceptos visuales\nLas capas profundas combinan patrones simples en conceptos más complejos.\nLa red aprende combinaciones de: bordes, texturas, partes de objetos, formas, configuraciones visuales.\n1 Pixeles · 2 Bordes y texturas · 3 Partes · 4 Objetos o conceptos visuales (p. ej., un perro)\nLa red tiende a capturar estas abstracciones de manera jerárquica, no de forma rígida ni exclusiva.', sources: ['https://arxiv.org/abs/1311.2901']},
  {title: 'Feature maps: un volumen de activaciones', layout: 'split', sec: SEC[1], points: ['Una capa convolucional no produce un solo número.', 'Produce un volumen de activaciones: alto × ancho × canales.', 'Cada canal puede responder a un tipo de patrón aprendido.'],
    original: 'Feature maps: la imagen como un volumen de activaciones\nUna capa convolucional no produce un solo número.\nProduce un volumen de activaciones: alto × ancho × canales.\nCada canal puede responder a un tipo de patrón aprendido.\n(Feature maps = H × W × C; Canal 1: bordes; Canal 2: textura; Canal 3: forma; Canal C: patrón aprendido. Ejemplos ilustrativos.)', sources: []},
  {title: 'Cómo se comprime un volumen en un vector', layout: 'split', sec: SEC[1], points: ['Para obtener un embedding pasamos de mapas espaciales a un vector.', 'Una operación común es Global Average Pooling: H × W × C → 1 × 1 × C → [e₁, e₂, …, e_C].', 'Cada canal se promedia espacialmente para producir una coordenada del vector.'],
    original: 'Cómo se comprime un volumen en un vector\nPara obtener un embedding, necesitamos pasar de mapas espaciales a un vector.\nUna operación común es Global Average Pooling.\nConvierte: H × W × C\nEn: 1 × 1 × C\nY luego: [e1, e2, e3, …, eC]\n(Cada canal se promedia espacialmente para producir una coordenada del vector.)', sources: ['https://arxiv.org/abs/1312.4400']},
  {title: 'El embedding vive antes del clasificador', layout: 'split', sec: SEC[2], points: ['El embedding está justo antes de la decisión final.', 'La CNN primero genera una representación; después, el clasificador la usa para producir una clase.', 'embedding → clasificador → probabilidades.'],
    original: 'El embedding vive antes del clasificador final\nEl embedding está justo antes de la decisión final.\nLa CNN primero genera una representación.\nDespués, el clasificador usa esa representación para producir una clase.\nembedding → clasificador → probabilidades\n(Representación reutilizable: puede usarse en muchas tareas. Específico de la tarea: capas entrenadas para este dataset y estas clases.)', sources: []},
  {title: '¿Qué hace realmente la última capa?', layout: 'split', sec: SEC[2], points: ['La última capa aprende una frontera entre clases.', 'Toma el embedding y calcula un score por categoría (una fila de W por clase).', 'No descubre la imagen desde cero: lee la representación que el backbone ya construyó.'],
    original: '¿Qué hace realmente la última capa?\nLa última capa aprende una frontera entre clases.\nToma el embedding y calcula scores para cada categoría.\nEjemplo: embedding → scores → gato / perro / caballo / auto\nLa última capa no descubre toda la imagen desde cero.\nLee una representación que el backbone ya construyó.\n(W clasificador (matriz de pesos) → Scores (lineales) → Probabilidades (softmax): Perro 0.82, Gato 0.10, Caballo 0.05, Auto 0.03)', sources: ['https://arxiv.org/abs/1512.04150']},
  {title: 'El truco principal: quitar la última capa', layout: 'split', sec: SEC[2], points: ['Para obtener embeddings, quitamos la última capa de clasificación.', 'La CNN deja de ser solo un clasificador.', 'Ahora funciona como un encoder de imágenes.'],
    original: 'El truco principal: quitar la última capa\nPara obtener embeddings, quitamos la última capa de clasificación.\nLa CNN deja de ser solo un clasificador.\nAhora funciona como un encoder de imágenes.\n(CNN original: Imagen → Backbone → Embedding → Clasificador → «Perro». «Cortar aquí». CNN como encoder: Imagen → Backbone → Embedding vector; el clasificador se retira.)', sources: []},
  {title: 'Clasificador vs extractor de embeddings', layout: 'split', sec: SEC[2], points: ['Misma base convolucional, diferente salida.', 'Clasificador: CNN completa (backbone + head) → una clase.', 'Extractor: CNN sin la última capa → un vector. La salida ya no es una etiqueta: es una representación.'],
    original: 'Antes y después: clasificador vs extractor de embeddings\nMisma base convolucional. Diferente salida.\nClasificador: entrada imagen → salida clase (Perro). CNN completa (backbone + head).\nExtractor de embeddings: entrada imagen → salida vector [0.18, 2.41, -0.77, …, 1.32, -1.05]. CNN sin última capa (backbone).\nLa salida ya no es una etiqueta. Es una representación.', sources: []},
  {title: 'Ejemplo concreto con ResNet-50', layout: 'split', sec: SEC[2], points: ['Una ResNet entrenada para clasificación se divide en backbone convolucional y capa fully connected final.', 'Para extraer embeddings usamos la salida antes de la capa final.', 'En ResNet-50 el embedding típico tiene 2048 dimensiones.'],
    original: 'Ejemplo concreto con ResNet\nEjemplo conceptual: ResNet como extractor de embeddings.\nUna ResNet entrenada para clasificación puede dividirse en: backbone convolucional; fully connected layer final.\nPara extraer embeddings, usamos la salida antes de la capa final.\n(Input image → Conv stem → Residual blocks → Global Average Pooling → 2048-d vector → FC layer → 1000 ImageNet classes. Embedding típico en ResNet-50: vector de 2048 dimensiones.)', sources: ['https://arxiv.org/abs/1512.03385', 'https://github.com/onnx/models']},
  {title: 'Búsqueda visual por similitud', layout: 'split', sec: SEC[3], kicker: 'Caso 1', points: ['1. Pasamos todas las imágenes por la CNN encoder.', '2. Guardamos sus embeddings.', '3. Pasamos una imagen nueva por el mismo encoder.', '4. Buscamos los vectores más cercanos.', '5. Regresamos las imágenes más similares.'],
    original: 'Qué hacemos con un embedding: búsqueda visual\nCaso 1: búsqueda por similitud visual\n1 Pasamos todas las imágenes por la CNN encoder.\n2 Guardamos sus embeddings.\n3 Pasamos una imagen nueva por el mismo encoder.\n4 Buscamos los vectores más cercanos.\n5 Regresamos las imágenes más similares.', sources: []},
  {title: 'Clustering sin etiquetas', layout: 'split', sec: SEC[3], kicker: 'Caso 2', points: ['Los embeddings permiten explorar colecciones de imágenes sin etiquetas.', 'Flujo: imágenes sin etiqueta → CNN encoder → embeddings → clustering → grupos visuales.', 'Algoritmos típicos: k-means, DBSCAN, HDBSCAN.'],
    original: 'Qué hacemos con un embedding: clustering sin etiquetas\nCaso 2: agrupar imágenes sin etiquetas\nLos embeddings permiten explorar colecciones de imágenes.\nFlujo: imágenes sin etiqueta → CNN encoder → embeddings → clustering → grupos visuales\nClustering (ej. k-means, DBSCAN, HDBSCAN)', sources: []},
  {title: 'Transferencia de aprendizaje', layout: 'split', sec: SEC[3], kicker: 'Caso 3', points: ['Una CNN entrenada en millones de imágenes ya aprendió patrones visuales generales.', 'Podemos reutilizar ese conocimiento para una tarea nueva, sobre todo con pocos datos etiquetados.', 'El embedding es la parte transferible; la cabeza (head) se adapta a la nueva tarea.'],
    original: 'Qué hacemos con un embedding: transferencia de aprendizaje\nCaso 3: transfer learning\nUna CNN entrenada en millones de imágenes ya aprendió patrones visuales generales.\nPodemos reutilizar ese conocimiento para una tarea nueva.\nEspecialmente cuando tenemos pocos datos etiquetados.\n(Clasificador de defectos, médico, de productos, de especies; clasificador original retirado.)\nEl embedding es la parte transferible; la cabeza (head) se adapta a la nueva tarea.', sources: []},
  {title: 'Detección de anomalías', layout: 'split', sec: SEC[3], kicker: 'Caso 4', points: ['Si las imágenes normales forman una región compacta en el espacio de embeddings, una imagen extraña puede aparecer lejos.', 'Normal = cerca del grupo; anómalo = lejos del grupo.', 'El embedding ayuda a medir qué tan diferente es una imagen, en la noción de similitud que aprendió.'],
    original: 'Qué hacemos con un embedding: detección de anomalías\nCaso 4: detectar imágenes raras o anómalas\nSi las imágenes normales forman una región compacta en el espacio de embeddings, una imagen extraña puede aparecer lejos.\nIdea: normal = cerca del grupo; anómalo = lejos del grupo.\n(Ejemplo de imagen anómala: un garrafón sucio y deformado.)\nEl embedding ayuda a medir qué tan diferente es una imagen.', sources: []},
  {title: '¿Qué hace que un embedding sea bueno?', layout: 'split', sec: SEC[4], points: ['Un buen embedding conserva la similitud que importa para la tarea.', 'Pero «similar» no siempre significa lo mismo: por objeto, por color o estilo, por defectos.', 'Un embedding no es «la verdad» de la imagen: es una representación aprendida para cierto tipo de similitud.'],
    original: '¿Qué hace que un embedding sea bueno?\nUn buen embedding conserva la similitud que importa para la tarea.\nPero «similar» no siempre significa lo mismo.\nPara identificar objetos: perro cerca de perro. Para buscar estilo: objetos rojos cerca de objetos rojos. Para detectar defectos: productos normales cerca de normales.\nEl embedding refleja los datos y la tarea de entrenamiento.\n(Espacio A: similitud por objeto. Espacio B: similitud por color/estilo.)\nUn embedding no es «la verdad» de la imagen. Es una representación aprendida para cierto tipo de similitud.', sources: []},
  {title: 'Decisiones al extraer embeddings', layout: 'split', sec: SEC[4], points: ['¿Qué CNN? ¿Preentrenada o desde cero? ¿De qué capa? ¿Congelamos o hacemos fine-tuning? ¿Normalizamos? ¿Qué métrica?', 'Métricas comunes: similitud coseno (dirección) y distancia euclidiana (distancia directa).', 'Extraer embeddings es sencillo conceptualmente, pero las decisiones de diseño cambian el resultado.'],
    original: 'Decisiones prácticas al extraer embeddings de una CNN\n¿Qué CNN usamos? ¿Usamos modelo preentrenado o entrenamos desde cero? ¿De qué capa sacamos el embedding? ¿Congelamos el backbone o lo fine-tuneamos? ¿Normalizamos el vector? ¿Qué métrica usamos para comparar embeddings?\nMétricas comunes: cosine similarity, Euclidean distance.\n(Datos disponibles → Modelo preentrenado → Capa de extracción → Normalización → Métrica de distancia → Aplicación)\nExtraer embeddings es sencillo conceptualmente, pero las decisiones de diseño cambian el resultado.', sources: []},
  {title: 'Cierre: clasificación vs representación', layout: 'split', sec: SEC[4], points: ['Una CNN puede ser mucho más que un clasificador: puede ser un encoder visual.', 'La última capa produce etiquetas; la capa anterior produce representaciones.', 'La clasificación es una salida. La representación es el activo reutilizable.'],
    original: 'Cierre: clasificación vs representación\nUna CNN puede ser mucho más que un clasificador. Puede ser un encoder visual.\nLa última capa produce etiquetas. La capa anterior produce representaciones.\nY esas representaciones permiten: buscar, comparar, agrupar, transferir aprendizaje, detectar anomalías.\nLa clasificación es una salida. La representación es el activo reutilizable.\nEl embedding es el puente entre una CNN entrenada y muchas aplicaciones prácticas de visión por computadora.', sources: []}
];

const GCOL = {Perros: 'var(--g1)', Gatos: 'var(--g5)', Autos: 'var(--g2)', Calzado: 'var(--g3)', Sillas: 'var(--g4)'};
const GBG = {Perros: 'rgba(176,122,38,.11)', Gatos: 'rgba(122,90,166,.11)', Autos: 'rgba(47,99,168,.10)', Calzado: 'rgba(46,148,102,.11)', Sillas: 'rgba(185,71,47,.10)'};
function halo(items, gx, gy, pad = 26) {
  const xs = items.map(gx), ys = items.map(gy), x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + 64 + pad, y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + 64 + pad;
  return {x: x0, y: y0, w: x1 - x0, h: y1 - y0};
}
/* push apart overlapping square thumbnails (box test, minimal-axis push) while keeping them near their projected position */
function relax(pts, minD, W, H, size, iters = 600) {
  const p = pts.map(q => ({x: q[0], y: q[1], x0: q[0], y0: q[1]}));
  for (let it = 0; it < iters; it++) {
    let moved = false;
    for (let i = 0; i < p.length; i++) for (let j = i + 1; j < p.length; j++) {
      const dx = p[j].x - p[i].x, dy = p[j].y - p[i].y, ox = minD - Math.abs(dx), oy = minD - Math.abs(dy);
      if (ox > 0 && oy > 0) {
        moved = true;
        if (ox < oy) { const m = ox / 2 * (dx >= 0 ? 1 : -1); p[i].x -= m; p[j].x += m; } else { const m = oy / 2 * (dy >= 0 ? 1 : -1); p[i].y -= m; p[j].y += m; }
      }
    }
    p.forEach(q => { if (it < iters * .6) { q.x += (q.x0 - q.x) * .01; q.y += (q.y0 - q.y) * .01; } q.x = Math.max(0, Math.min(W - size, q.x)); q.y = Math.max(0, Math.min(H - size, q.y)); });
    if (!moved && it > iters * .6) break;
  }
  return p.map(q => [Math.round(q.x), Math.round(q.y)]);
}
P({src: ['https://www.jmlr.org/papers/v9/vandermaaten08a.html'], extra: 'Cada miniatura está donde la puso su embedding real de ResNet-50 (2048 dimensiones), proyectado a 2D con t-SNE (similitud coseno). Nadie le dijo a la red qué foto era perro o auto: los grupos salen solos. t-SNE conserva vecindades, no distancias globales: la distancia entre grupos no se interpreta.', body: () => {
  const W = 960, H = 500, RP = relax(DATA.map.map(d => [20 + d.x * (W - 104), 20 + d.y * (H - 104)]), 70, W, H, 64), pos = new Map(DATA.map.map((d, j) => [d, RP[j]])), gx = d => pos.get(d)[0], gy = d => pos.get(d)[1];
  let s = '';
  Object.keys(GCOL).forEach((g, j) => {
    const its = DATA.map.filter(d => d.g === g), h = halo(its, gx, gy, 18);
    s += `<div class="x-halo" style="left:${h.x}px;top:${h.y}px;width:${h.w}px;height:${h.h}px;background:${GBG[g]};border:2px solid ${GCOL[g]}"${F(3, 'fade', j * 120, 'data-i="0"')}></div>`;
    s += `<div class="x-hlab" style="left:${h.x + h.w / 2}px;top:${h.y - 4}px;color:${GCOL[g]}"${F(3, 'up', 200 + j * 120, 'data-i="0"')}>${g}</div>`;
  });
  DATA.map.forEach((d, j) => { s += TB(d.k, gx(d), gy(d), {b: 2, d: j * 45, dk: 'mp'}); });
  return `<div class="col-l" style="width:440px">${PTS(['Después de pasar por una CNN, cada imagen se vuelve <b>un punto</b>.', 'La posición depende de lo que la red aprendió a reconocer.', 'Imágenes similares quedan <b class="gd">cerca</b>; imágenes diferentes, <b>lejos</b>.'], 1, {pc: 'sm', beats: [1, 2, 3]})}
    <div class="x-note" style="position:relative;margin-top:14px;font-style:normal;font-size:15px"${F(3, 'fade', 900)}>${DATA.map.length} fotos reales · embeddings de ResNet-50 (2048 dimensiones) proyectados a 2D con t-SNE.</div></div>
    <div class="col-r" style="left:470px;right:-40px;top:-16px">${s}</div>`;
}, run: {2: A => {
  if (A.final()) return;
  const els = A.ks('mp'); const pos = els.map(e => [e.style.left, e.style.top]);
  els.forEach(e => { e.style.transition = 'none'; e.style.left = '448px'; e.style.top = '218px'; });
  void A.root.offsetWidth;
  els.forEach((e, j) => { e.style.transition = ''; e.style.setProperty('--md', (j * 45) + 'ms'); e.style.left = pos[j][0]; e.style.top = pos[j][1]; });
}}});

/* 07 · reminder: a classification CNN (real ResNet-50 shapes) */
P({src: ['https://arxiv.org/abs/1512.03385'], body: () => {
  const Y = 200; let s = '';
  const lab = (x, n, sh, b, d, cls) => LB(x, Y + 66, `<b style="font-size:15px">${n}</b><br><span style="font-size:13px">${sh}</span>`, {b, d, cls});
  s += PH('dog1_crop', 0, Y - 42, 84, 84, {b: 1, fx: 'pop'}) + lab(42, 'Imagen', '224×224×3', 1, 100);
  s += AR(92, Y, 118, Y, {b: 2, w: 2}) + CNN(126, Y - 46, 64, 92, {b: 2, d: 50, n: 4}) + lab(158, 'Conv + ReLU', '112×112×64', 2, 100);
  s += AR(198, Y, 222, Y, {b: 2, d: 150, w: 2}) + `<div class="x-pool" style="left:230px;top:${Y - 30}px"${F(2, 'pop', 200, 'data-i="0"')}>${'<i></i>'.repeat(9)}</div>` + lab(262, 'Pooling', '56×56×64', 2, 250);
  s += AR(300, Y, 326, Y, {b: 2, d: 300, w: 2}) + CNN(334, Y - 56, 130, 112, {b: 2, d: 350, n: 8}) + lab(399, 'Bloques residuales', '→ 7×7×2048', 2, 400);
  s += AR(472, Y, 498, Y, {b: 2, d: 450, w: 2}) + `<div class="x-gap" style="left:506px;top:${Y - 24}px"${F(2, 'pop', 500, 'data-i="0"')}><i></i><b>→</b><s></s></div>` + lab(546, 'Global Avg<br>Pooling', '7×7 → 1×1', 2, 550);
  s += AR(594, Y, 620, Y, {b: 2, d: 600, w: 2}) + EV(628, Y - 62, 124, {b: 2, d: 650, n: 4, cls: 'glow'}) + lab(649, 'Vector', '2048', 2, 700, 'gold');
  s += AR(678, Y, 704, Y, {b: 3, w: 2}) + `<div class="x-blk" style="left:712px;top:${Y - 40}px;width:100px;height:80px"${F(3, 'pop', 100, 'data-i="0"')}><b style="font-size:15px">W·e + b</b><small>2048→1000</small></div>` + lab(762, 'Capa final', '1000 scores', 3, 150);
  s += AR(818, Y, 842, Y, {b: 3, d: 250, w: 2}) + CLS(850, Y - 38, {b: 3, d: 300, h: [52, 14, 9, 6]}) + lab(888, 'Softmax', 'probabilidades', 3, 350);
  s += AR(930, Y, 952, Y, {b: 3, d: 450, w: 2}) + `<div class="x-blk gold" style="left:960px;top:${Y - 40}px;width:84px;height:80px"${F(3, 'pop', 550, 'data-i="0"')}><b style="font-size:13px">golden retriever</b><small>${(DATA.top5[0].p * 100).toFixed(1)}%</small></div>` + lab(1002, 'Clase', '', 3, 600);
  s += `<div class="x-blk dashg" style="left:110px;top:${Y - 110}px;width:582px;height:250px"${F(4, 'fade', 0, 'data-i="0"')}></div>` + LB(401, Y - 140, '<b class="gd" style="font-size:19px">Backbone</b> · aprende características visuales', {b: 4, d: 100});
  s += `<div class="x-blk dash" style="left:702px;top:${Y - 110}px;width:350px;height:250px"${F(4, 'fade', 300, 'data-i="0"')}></div>` + LB(877, Y - 140, '<b style="font-size:19px">Head</b> · scores → probabilidades', {b: 4, d: 400});
  s += `<div class="x-note" style="left:0;top:${Y + 150}px;width:1040px;font-style:normal;font-size:15px"${F(4, 'fade', 700)}>Formas reales de ResNet-50 para una imagen de 224×224: la parte espacial se reduce 32 veces (224 → 7) mientras los canales crecen de 3 a 2048.</div>`;
  return `<div class="col-l" style="width:380px">${PTS(['Una CNN clasificadora tiene <b>dos partes</b> principales.', '<b class="gd">Backbone</b>: aprende características visuales.', '<b>Head de clasificación</b>: convierte la representación en probabilidades de clase.'], 1, {pc: 'sm', beats: [1, 2, 3]})}</div><div class="col-r" style="left:410px;right:-40px">${s}</div>`;
}});

/* 08 · from pixels to local patterns: real conv1 filters and feature maps */
P({extra: 'Los 64 filtros son los pesos reales de la primera capa de ResNet-50 (7×7 píxeles × 3 colores, normalizados para verlos). Los mapas de la derecha son las respuestas reales de 8 de esos filtros sobre la foto del lago (112×112 cada uno). Al aparecer cada mapa, el recuadro dorado marca el filtro que lo produjo. Pasa el mouse sobre un mapa para ver su filtro.', body: () => {
  let s = PH('mountain_crop', 0, 140, 200, 200, {b: 2, fx: 'zoom'}) + LB(100, 352, '<b>Imagen de entrada</b>', {b: 2, d: 100});
  s += AR(208, 240, 240, 240, {b: 2, d: 200});
  s += `<div class="x-ph" style="left:250px;top:110px;width:252px;height:252px;border-radius:6px;background:#f4f1e9;box-shadow:0 0 0 1px var(--hair)"${F(2, 'zoom', 350, 'data-i="0"')}><img class="x-pix" src="${IMG.filters}" alt="Los 64 filtros de la primera capa"><i class="x-fhl" data-k="fhl"></i></div>`;
  s += LB(376, 64, '<b>Conv layer 1</b><br>64 filtros aprendidos (7×7×3)', {b: 2, d: 400});
  s += LB(376, 372, 'pesos reales de ResNet-50', {b: 2, d: 500});
  s += AR(512, 240, 544, 240, {b: 3, w: 2});
  DATA.c1ch.forEach((c, j) => { const x = 556 + (j % 2) * 122, y = 6 + Math.floor(j / 2) * 122; s += `<div class="x-ph" data-k="fm" data-c="${c}" style="left:${x}px;top:${y}px;width:114px;height:114px;border-radius:8px;box-shadow:0 3px 10px rgba(20,36,56,.18)"${F(3, 'pop', 150 + j * 380, 'data-i="0"')}><img src="${IMG['c1_' + c]}" alt="Mapa del filtro ${c}"></div>`; });
  s += LB(678, 500, '<b>Feature maps iniciales</b> · 112×112', {b: 3, d: 300});
  const chips = ['Bordes', 'Esquinas', 'Texturas', 'Cambios de color', 'Líneas orientadas'].map(t => `<span class="x-chip">${t}</span>`).join('');
  return `<div class="col-l" style="width:440px"><div class="pts"><div class="pt sm" style="border:0"${F(1, 'up')}>Las primeras capas detectan <b>patrones simples</b>.</div></div>
    <div class="x-tag" style="margin:6px 0 10px"${F(1, 'up', 150)}>Ejemplos</div><div class="x-chips"${F(1, 'up', 250)}>${chips}</div>
    <div class="pt sm" style="border:0;margin-top:18px"${F(3, 'up', 400)}>Estas capas todavía están cerca del mundo de los píxeles.</div></div>
  <div class="col-r" style="left:500px;right:-20px">${s}</div>`;
}, run: {3: A => {
  const hl = A.k('fhl'), maps = A.ks('fm');
  const go = c => { hl.style.left = ((c % 8) * 32 - 3) + 'px'; hl.style.top = (Math.floor(c / 8) * 32 - 3) + 'px'; hl.classList.add('on'); };
  maps.forEach((m, j) => { A.t(150 + j * 380, () => go(+m.dataset.c)); m.addEventListener('mouseenter', () => go(+m.dataset.c)); });
}}});

/* 09 · from local patterns to visual concepts: a real hierarchy on the same photo */
P({src: ['https://arxiv.org/abs/1311.2901', 'https://arxiv.org/abs/1512.04150'], extra: 'Todo sale de la misma foto y la misma red: (1) 24×24 píxeles del hocico; (2) la respuesta real de un filtro de la primera capa; (3) el canal 778 de una capa intermedia (14×14), que en esta foto se enciende en el hocico; (4) el mapa de activación de clase (CAM) para «golden retriever»: Σ_c W[207, c] · mapa_c de la última capa (Zhou et al., 2016). La jerarquía es una tendencia, no una regla.', body: () => {
  const card = (x, y, n, t, d, img, b) => `<div class="x-blk" style="left:${x}px;top:${y}px;width:330px;height:112px;flex-direction:row;justify-content:flex-start;gap:16px;padding:12px;text-align:left"${F(b, 'up', 0, 'data-i="0"')}>${img}<div><div style="display:flex;align-items:center;gap:8px"><i class="x-num">${n}</i><b style="font-size:19px">${t}</b></div><div style="font-size:14px;color:var(--muted);margin-top:4px;line-height:1.3">${d}</div></div></div>`;
  const im = (k, ov, pix) => `<div class="x-ph" style="position:relative;left:0;top:0;flex:none;width:88px;height:88px;border-radius:8px;box-shadow:none">${`<img${pix ? ' class="x-pix"' : ''} src="${IMG[k]}" alt="">`}${ov ? `<img src="${IMG[ov]}" alt="" style="position:absolute;inset:0;width:100%;height:100%">` : ''}</div>`;
  let s = card(0, 412, 1, 'Píxeles', 'Intensidad y color de cada punto: 24×24 píxeles del hocico.', im('px_nose', null, true), 2);
  s += card(186, 280, 2, 'Bordes y texturas', 'Respuesta de un filtro de la primera capa: contornos y pelo.', im('dc1_' + DATA.dog_c1[0]), 3);
  s += card(372, 148, 3, 'Partes', `Canal ${DATA.s3ch[0].c} de una capa intermedia: se enciende en el hocico.`, im('dog1_crop', 's3_' + DATA.s3ch[0].c), 4);
  s += card(558, 16, 4, 'Objeto', '«golden retriever»: dónde mira esa clase en la última capa (CAM).', im('dog1_crop', 'cam'), 5);
  [[150, 412, 200, 394], [336, 280, 386, 262], [522, 148, 572, 130]].forEach(([x1, y1, x2, y2], j) => { s += L(x1, y1, x2, y2, {b: j + 3, w: 2, cls: 'gold', arrow: true}); });
  s += `<div style="position:absolute;left:560px;top:330px;width:330px;font-size:16px;color:var(--muted);line-height:1.4;border-left:3px solid var(--gold);padding-left:14px"${F(5, 'fade', 500)}>La red tiende a capturar estas abstracciones de manera <b style="color:var(--ink)">jerárquica</b>, no de forma rígida ni exclusiva.</div>`;
  const chips = ['Bordes', 'Texturas', 'Partes de objetos', 'Formas', 'Configuraciones visuales'].map(t => `<span class="x-chip">${t}</span>`).join('');
  return `<div class="col-l" style="width:440px"><div class="pts"><div class="pt sm" style="border:0"${F(1, 'up')}>Las capas profundas combinan patrones simples en <b>conceptos más complejos</b>.</div></div>
    <div class="x-tag" style="margin:6px 0 10px"${F(1, 'up', 150)}>La red aprende combinaciones de</div><div class="x-chips"${F(1, 'up', 250)}>${chips}</div></div>
  <div class="col-r" style="left:500px;right:-20px">${s}</div>`;
}});

/* 10 · the activation volume: real channels of a 14×14×1024 layer */
P({extra: 'Volumen real de una capa intermedia de ResNet-50 para esta foto: 14 × 14 posiciones × 1024 canales. Elegimos 4 canales cuya respuesta coincide con zonas distintas de la foto (hocico, pelaje, pasto, árboles). Nadie les asignó ese papel: cada canal aprendió su patrón durante el entrenamiento. Otros canales responden a cosas difíciles de nombrar.', body: () => {
  let s = PH('dog1_crop', 0, 170, 180, 180, {b: 2}) + LB(90, 362, '<b>Imagen de entrada</b>', {b: 2, d: 100});
  s += AR(190, 260, 224, 260, {b: 2, d: 200});
  for (let k = 7; k >= 0; k--) s += `<div class="x-slab" style="left:${240 + k * 11}px;top:${186 - k * 11}px"${F(2, 'fade', 300 + (7 - k) * 70, 'data-i="0"')}></div>`;
  s += LB(315, 412, '<b>H = 14</b> · <b>W = 14</b> · <b class="gd">C = 1024 canales</b>', {b: 2, d: 900});
  s += LB(315, 438, 'feature maps = H × W × C', {b: 2, d: 1000});
  DATA.s3ch.forEach((c, j) => {
    const x = 570 + (j % 2) * 176, y = 10 + Math.floor(j / 2) * 250;
    s += L(400, 200, x - 6, y + 80, {b: 3, d: j * 350, w: 1.5, cls: 'drop'});
    s += PH('dog1_crop', x, y, 160, 160, {b: 3, d: 150 + j * 350, fx: 'pop', i0: true, inner: `<img src="${IMG['s3_' + c.c]}" alt="" style="position:absolute;inset:0;width:100%;height:100%">`});
    s += LB(x + 80, y + 170, `canal ${c.c}<br><b>${c.name}</b>`, {b: 3, d: 300 + j * 350});
  });
  return `<div class="col-l" style="width:420px">${PTS(['Una capa convolucional no produce un solo número.', 'Produce un <b>volumen</b> de activaciones: <b class="gd">alto × ancho × canales</b>.', 'Cada canal puede responder a un tipo de patrón aprendido.'], 1, {pc: 'sm', beats: [1, 2, 3]})}</div><div class="col-r" style="left:480px;right:-30px">${s}</div>`;
}});

/* 11 · global average pooling with real numbers */
const heatc = t => { t = Math.max(0, Math.min(1, t)); return `rgb(${Math.round(250 - t * 40)},${Math.round(246 - t * 120)},${Math.round(236 - t * 190)})`; };
P({src: ['https://arxiv.org/abs/1312.4400'], extra: 'Valores reales de la última capa convolucional de ResNet-50 para la foto del golden retriever: 7 × 7 posiciones × 2048 canales. El promedio de los 49 valores del canal 1454 es exactamente la coordenada 1454 del embedding (3.53). Se muestran los 4 canales con el promedio más alto.', body: () => {
  const G = DATA.gap[0], CS = 46, GP = 4;
  let s = LB(184, 0, `<b>canal ${G.c}</b> · 7 × 7 activaciones`, {b: 2});
  G.m.forEach((v, j) => { const r = Math.floor(j / 7), c = j % 7; s += `<i class="x-gc" data-k="gc" style="left:${10 + c * (CS + GP)}px;top:${30 + r * (CS + GP)}px;width:${CS}px;height:${CS}px;background:${heatc(v / 7.2)}"${F(2, 'pop', (r + c) * 35, 'data-i="0"')}>${v.toFixed(1)}</i>`; });
  s += AR(370, 200, 420, 200, {b: 3, w: 2.5});
  s += LB(395, 166, 'promedio', {b: 3, d: 100});
  s += `<div class="x-vn" style="left:430px;top:166px;flex-direction:row;gap:8px;font-size:22px"${F(3, 'pop', 1900, 'data-i="0"')}><span>e<sub>${G.c}</sub> =</span><b data-count="${G.mean}" data-dec="2">${G.mean.toFixed(2)}</b></div>`;
  DATA.gap.slice(1).forEach((g, j) => {
    const X = 640, Y = j * 152;
    s += LB(X + 62, Y, `canal ${g.c}`, {b: 4, d: j * 250});
    g.m.forEach((v, q) => { const r = Math.floor(q / 7), c = q % 7; s += `<i class="x-gc sm" style="left:${X + c * 18}px;top:${Y + 22 + r * 18}px;background:${heatc(v / 7.2)}"${F(4, 'fade', j * 250 + (r + c) * 20, 'data-i="0"')}></i>`; });
    s += AR(X + 134, Y + 84, X + 160, Y + 84, {b: 4, d: j * 250 + 200, w: 2});
    s += `<div class="x-vn" style="left:${X + 168}px;top:${Y + 66};flex-direction:row;gap:6px;font-size:16px;padding:4px 10px;top:${Y + 66}px"${F(4, 'pop', j * 250 + 350, 'data-i="0"')}>e<sub>${g.c}</sub> = <b>${g.mean.toFixed(2)}</b></div>`;
  });
  const slots = [['e₁', DATA.emb_first[0]], ['e₂', DATA.emb_first[1]], ['…'], ['e₃₅₆', DATA.gap[1].mean, 1], ['…'], ['e₆₆₅', DATA.gap[2].mean, 1], ['e₇₃₇', DATA.gap[3].mean, 1], ['…'], ['e₁₄₅₄', DATA.gap[0].mean, 1], ['…'], ['e₂₀₄₈']];
  s += `<div class="x-vrow" style="left:0;top:470px"${F(5, 'up', 0, 'data-i="0"')}><span class="br">[</span>${slots.map(([n, v, h]) => v == null ? `<span class="dots">${n}</span>` : `<span class="${h ? 'hot' : ''}"><small>${n}</small>${(+v).toFixed(2)}</span>`).join('')}<span class="dots">…</span><span class="br">]</span><em>embedding de 2048 valores</em></div>`;
  return `<div class="col-l" style="width:420px"><div class="pts"><div class="pt sm"${F(1, 'up')}>Para obtener un embedding pasamos de <b>mapas espaciales</b> a un <b>vector</b>.</div><div class="pt sm" style="border:0"${F(1, 'up', 150)}>Operación común: <b class="gd">Global Average Pooling</b>.</div></div>
    <div class="x-frm"${F(1, 'up', 300)}><div><span>Convierte</span><b>H × W × C</b><em>7 × 7 × 2048</em></div><div><span>en</span><b>1 × 1 × C</b><em>1 × 1 × 2048</em></div><div><span>y luego</span><b>[e₁, e₂, …, e<sub>C</sub>]</b><em>2048 números</em></div></div>
    <div class="x-note" style="position:relative;margin-top:16px;font-style:normal;font-size:15px"${F(3, 'fade', 2000)}>Cada canal se promedia espacialmente para producir <b>una coordenada</b> del vector.</div></div>
  <div class="col-r" style="left:480px;right:-30px">${s}</div>`;
}, run: {3: A => { const cells = A.ks('gc'); cells.forEach((e, j) => A.t(j * 32, () => { e.classList.remove('sw'); void e.offsetWidth; e.classList.add('sw'); })); }}, len: {3: 600}});

/* 12 · the embedding lives before the final classifier */
P({body: () => {
  const Y = 170; let s = '';
  s += `<div style="position:absolute;left:0;top:0;width:1428px;display:flex;gap:40px;font-size:22px;line-height:1.35"><div${F(1, 'up')}>El embedding está justo <b>antes de la decisión final</b>.</div><div${F(1, 'up', 150)}>La CNN primero genera una representación; después, el clasificador la usa para producir una clase.</div></div>`;
  s += `<div style="position:absolute;left:0;top:76px;font-size:24px;font-weight:700;color:var(--gold-d)"${F(1, 'up', 300)}>embedding → clasificador → probabilidades</div>`;
  s += PH('dog1', 0, Y, 132, 172, {b: 2}) + LB(66, Y + 186, '<b>Imagen</b>', {b: 2, d: 100});
  s += AR(142, Y + 86, 186, Y + 86, {b: 2, d: 200});
  s += `<div class="x-blk" style="left:194px;top:${Y + 6}px;width:220px;height:160px"${F(2, 'fade', 300, 'data-i="0"')}></div>` + CNN(232, Y + 26, 150, 118, {b: 2, d: 350, n: 8}) + LB(304, Y + 186, '<b>CNN backbone</b>', {b: 2, d: 400});
  s += AR(424, Y + 86, 470, Y + 86, {b: 3});
  s += `<div class="x-blk gold" style="left:478px;top:${Y - 14}px;width:150px;height:200px"${F(3, 'zoom', 100, 'data-i="0"')}></div>` + EV(500, Y + 2, 168, {b: 3, d: 300, cls: 'glow'});
  s += `<div class="x-vec" style="position:absolute;left:556px;top:${Y + 18}px;font-size:14px;line-height:1.6"${F(3, 'fade', 500, 'data-i="0"')}>${DATA.emb_first.slice(0, 5).map(f2).join('<br>')}<br>⋮</div>`;
  s += LB(553, Y + 196, '<b class="gd">Embedding</b> · 2048', {b: 3, d: 400});
  s += AR(638, Y + 86, 684, Y + 86, {b: 4});
  s += `<div class="x-blk dash" style="left:692px;top:${Y - 30}px;width:736px;height:232px"${F(4, 'fade', 0, 'data-i="0"')}></div>`;
  s += `<div class="x-blk" style="left:722px;top:${Y + 16}px;width:170px;height:140px"${F(4, 'pop', 150, 'data-i="0"')}><b>Linear layer</b><small>W · e + b</small><small>2048 → 1000</small></div>`;
  s += AR(900, Y + 86, 934, Y + 86, {b: 4, d: 300, w: 2});
  s += `<div class="x-blk" style="left:942px;top:${Y + 16}px;width:170px;height:140px"${F(4, 'pop', 400, 'data-i="0"')}><b>Softmax</b><small>scores → probabilidades</small></div>`;
  s += AR(1120, Y + 86, 1154, Y + 86, {b: 4, d: 550, w: 2});

/* 13 · what the last layer really does: real weights, real scores, CAM */
P({src: ['https://arxiv.org/abs/1512.04150'], extra: 'Números reales de la capa final de ResNet-50 (W de 1000 × 2048). Arriba: 16 de las 2048 coordenadas del embedding (las más altas para esta foto) y, para 4 clases, sus 16 pesos correspondientes; el score usa las 2048 coordenadas más el sesgo. Las probabilidades son el softmax sobre las 1000 clases. Abajo: CAM, la misma fila de W aplicada a los mapas de 7×7 de la última capa (Zhou et al., 2016).', body: () => {

  let s = LB(X0 + 8 * CW, 0, '<b>embedding e</b> · 16 de 2048 coordenadas', {b: 1, d: 0});
  FC.e.forEach((v, j) => { s += `<i class="x-gc" style="left:${X0 + j * CW}px;top:26px;width:${CW - 3}px;height:34px;font-size:11px;background:${heatc(v / 3.6)}"${F(1, 'pop', j * 30, 'data-i="0"')}>${v.toFixed(1)}</i>`; });

    FC.rows[n].forEach((v, j) => { s += `<i class="x-gc" style="left:${X0 + j * CW}px;top:${y}px;width:${CW - 3}px;height:34px;background:${wcol(v)}"${F(2, 'fade', r * 120 + j * 12, 'data-i="0"')}></i>`; });
    s += `<div class="x-lb" style="left:${X0 + 16 * CW + 14}px;top:${y + 6}px;text-align:left"${F(3, 'fade', r * 150, 'data-i="0"')}>score <b style="font-family:var(--mono)">${f.logit.toFixed(1)}</b></div>`;
    s += `<div style="position:absolute;left:${X0 + 16 * CW + 130}px;top:${y + 9}px;width:160px"${F(4, 'fade', r * 150, 'data-i="0"')}><div class="x-bar"><i style="width:${Math.max(1, f.pf * 100)}%"></i></div></div>`;
    s += `<div class="x-lb" style="left:${X0 + 16 * CW + 302}px;top:${y + 6}px;text-align:left;font-family:var(--mono)"${F(4, 'fade', r * 150 + 100, 'data-i="0"')}><b>${f.pf >= .001 ? (f.pf * 100).toFixed(1) + '%' : '&lt;0.01%'}</b></div>`;
  });
  s += LB(X0 + 8 * CW, 262, 'filas de <b>W</b>: 16 de los 2048 pesos de cada clase (dorado +, azul −)', {b: 2, d: 600});
  s += LB(X0 + 16 * CW + 60, 56, '<b>W · e + b</b>', {b: 3});
  s += LB(X0 + 16 * CW + 210, 56, '<b>softmax</b> (1000 clases)', {b: 4});
  s += PH('dog1_crop', 0, 312, 196, 196, {b: 5, fx: 'zoom', inner: `<img src="${IMG.cam}" alt="" style="position:absolute;inset:0;width:100%;height:100%">`});
  s += `<div style="position:absolute;left:220px;top:316px;width:300px;font-size:17px;line-height:1.4"${F(5, 'up', 200)}><div class="x-tag" style="margin-bottom:6px">¿Qué mira la fila «golden retriever»?</div>Sus 2048 pesos, aplicados a los mapas de 7×7 de la última capa, encienden la <b class="gd">cara del perro</b>.</div>`;
  s += `<div style="position:absolute;left:560px;top:312px;width:380px"${F(6, 'up')}><div class="x-tag" style="margin-bottom:8px">Top 5 de 1000 clases</div>${DATA.top5.map((t, j) => `<div style="display:grid;grid-template-columns:170px 1fr 66px;gap:10px;align-items:center;margin:5px 0;font-size:15px"><span>${t.name}</span><div class="x-bar"><i style="width:${Math.max(.6, t.p * 100)}%"></i></div><b style="font-family:var(--mono);font-size:14px;text-align:right">${(t.p * 100).toFixed(t.p > .1 ? 1 : 2)}%</b></div>`).join('')}</div>`;
  return `<div class="col-l" style="width:400px">${PTS(['La última capa aprende una <b>frontera entre clases</b>.', 'Toma el embedding y calcula un <b>score</b> por categoría: una fila de W por clase.', 'No descubre la imagen desde cero: <b class="gd">lee la representación</b> que el backbone ya construyó.'], 1, {pc: 'sm', beats: [1, 3, 5]})}</div><div class="col-r" style="left:450px;right:-30px">${s}</div>`;

  s += `<div class="x-tag" style="position:absolute;left:0;top:282px"${F(3, 'up')}>CNN como encoder (para embeddings)</div>` + row(312, true, 3);
  return `<div class="col-l" style="width:420px">${PTS(['Para obtener embeddings, <b>quitamos la última capa</b> de clasificación.', 'La CNN deja de ser solo un clasificador.', 'Ahora funciona como un <b class="gd">encoder de imágenes</b>.'], 1, {pc: 'sm', beats: [1, 2, 3]})}</div><div class="col-r" style="left:480px;right:-30px">${s}</div>`;
}});

/* 15 · classifier vs embedding extractor */

    let s = `<div class="x-panel" style="left:${x}px;top:50px;width:680px;height:380px"${F(b, 'up', 0, 'data-i="0"')}><div class="x-ptitle${gold ? ' gold' : ''}">${title}</div><div class="x-pio"><span>Entrada: imagen</span><span>Salida: ${gold ? 'vector' : 'clase'}</span></div></div>`;

/* 16 · a concrete example: ResNet-50 */
P({src: ['https://arxiv.org/abs/1512.03385', 'https://github.com/onnx/models'], extra: 'Modelo usado en toda la clase: ResNet-50 v1 entrenada en ImageNet (ONNX Model Zoo, resnet50-v1-12). Índices de clase reales (de 0 a 999): 207 golden retriever, 208 Labrador retriever, 250 Siberian husky, 999 toilet tissue. Parámetros: ≈25.6 millones; la capa final aporta 2048 × 1000 pesos + 1000 sesgos = 2,049,000.', body: () => {

  s += AR(108, Y, 134, Y, {b: 2, d: 100, w: 2});
  s += `<div class="x-blk" style="left:140px;top:${Y - 70}px;width:200px;height:140px"${F(2, 'fade', 150, 'data-i="0"')}></div>` + CNN(156, Y - 50, 168, 100, {b: 2, d: 200, n: 9});
  s += `<svg class="x-svg" width="400" height="400"><path class="x-arc k" style="--len:220" d="M178 ${Y - 74} C 200 ${Y - 118}, 290 ${Y - 118}, 312 ${Y - 74}"${F(2, 'arc', 600, 'data-i="0"')}/></svg>`;
  s += LB(232, Y + 82, '<b>Conv stem + 16 bloques</b><br>residuales (con atajos)', {b: 2, d: 300});
  s += AR(348, Y, 374, Y, {b: 2, d: 400, w: 2});
  s += `<div class="x-gap" style="left:378px;top:${Y - 24}px"${F(2, 'pop', 500, 'data-i="0"')}><i></i><b>→</b><s></s></div>` + LB(414, Y + 62, '<b>Global</b><br><b>Avg Pooling</b>', {b: 2, d: 550});
  s += AR(444, Y, 470, Y, {b: 3, w: 2});
  s += EV(476, Y - 62, 124, {b: 3, d: 100, cls: 'glow'}) + LB(497, Y + 104, '<b class="gd" style="font-size:20px">2048-d</b><br>embedding', {b: 3, d: 200});
  s += `<div class="x-scis" style="left:520px;top:${Y - 108}px;transform:rotate(90deg)"${F(3, 'pop', 400, 'data-i="0"')}>${SCIS}</div>` + `<div class="x-cut" style="left:540px;top:${Y - 80}px;height:150px"${F(3, 'growyd', 300, 'data-i="0"')}></div>`;
  s += AR(548, Y, 574, Y, {b: 4, w: 2});
  s += `<div class="x-blk" style="left:580px;top:${Y - 44}px;width:100px;height:88px"${F(4, 'pop', 100, 'data-i="0"')}><b>FC</b><small>2048 → 1000</small></div>`;
  s += AR(686, Y, 712, Y, {b: 4, d: 200, w: 2});
  const cl = [['u_dog1', 207, 'golden retriever'], ['Labrador_retriever', 208, 'Labrador retriever'], ['Siberian_husky', 250, 'Siberian husky'], [null], ['toilet_tissue', 999, 'toilet tissue']];
  s += `<div class="x-blk" style="left:720px;top:${Y - 150}px;width:250px;height:300px;align-items:stretch;justify-content:flex-start;padding:14px 16px;gap:8px"${F(4, 'fade', 300, 'data-i="0"')}><div class="x-tag" style="text-align:center">1000 clases de ImageNet</div>${cl.map(([k, i, n]) => k ? `<div class="x-cl"><img src="${src(k)}" alt=""><span><small>#${i}</small> ${n}</span></div>` : '<div style="text-align:center;color:var(--muted);line-height:.6">⋮</div>').join('')}</div>`;
  const P0 = DATA.params;
  return `<div class="col-l" style="width:390px">${PTS(['Una ResNet entrenada para clasificar se divide en <b>backbone convolucional</b> y <b>capa fully connected final</b>.', 'Para extraer embeddings usamos la salida <b class="gd">antes de la capa final</b>.'], 1, {pc: 'sm', beats: [1, 3]})}
    <div class="x-facts"${F(5, 'up')}><div><b class="gd">2048</b><span>dimensiones del embedding</span></div><div><b>≈${(P0.total / 1e6).toFixed(1)} M</b><span>parámetros en total</span></div><div><b>${fmtN(P0.fc)}</b><span>en la capa final (${Math.round(P0.fc / P0.total * 100)}%)</span></div></div></div>
  <div class="col-r" style="left:440px;right:-30px">${s}</div>`;
}});

  return `<div class="col-l" style="width:380px"><div class="x-steps">${steps.map((t, j) => `<div class="x-step"${F(j < 2 ? 1 : 3, 'left', (j % 3) * 150)}><i>${j + 1}</i><span>${t}</span></div>`).join('')}</div></div><div class="col-r" style="left:420px;right:-30px">${s}</div>`;
}, run: {3: A => {
  const S = DATA.search, db = A.ks('db'), res = A.ks('res'), im = A.ks('rimg'), cs = A.ks('rcos'), nm = A.ks('rname');

/* 18 · case 2: clustering without labels (real k-means on real embeddings) */
const CLC = ['var(--g1)', 'var(--g2)', 'var(--g3)', 'var(--g4)', 'var(--g5)'];
P({kicker: 'Caso 2', extra: 'Las 20 fotos no tienen etiqueta para el algoritmo. k-means (k = 5, 20 inicializaciones) sobre los embeddings normalizados de ResNet-50 forma 5 grupos; al compararlos con las categorías reales, las 20 fotos quedan en el grupo correcto. Primero se ven en una proyección t-SNE; luego se acomodan por grupo.', body: () => {

  }
  const cnt = [0, 0, 0, 0, 0];
  C.forEach((d, j) => { const r = d.c, q = cnt[r]++; s += TB(d.k, gx(d), gy(d), {b: 2, d: j * 40, dk: 'cl', style: `--rx:${180 + q * 84}px;--ry:${6 + r * 100}px`}).replace('class="x-tb', `data-c="${d.c}" class="x-tb`); });
  DATA.cluster_names.forEach((n, r) => { s += `<div class="x-rowl" style="top:${6 + r * 100}px;border-color:${CLC[r]}"${F(4, 'left', 900 + r * 100, 'data-i="0"')}><i style="background:${CLC[r]}"></i>${n}</div>`; });
  s += `<div class="x-lb" style="left:560px;top:${6}px;text-align:left;white-space:normal;width:360px;font-size:17px"${F(4, 'up', 1500, 'data-i="0"')}><div class="x-tag" style="margin-bottom:6px">Resultado</div><b class="gd" style="font-size:30px">${Math.round(DATA.cluster_purity * C.length)} de ${C.length}</b><br>fotos en el grupo correcto, sin usar ninguna etiqueta.</div>`;
  s += `<div class="x-note" style="left:0;top:500px;font-style:normal;font-size:15px" data-k="cnote"${F(2, 'fade', 900, 'data-i="0"')}>Embeddings de 20 fotos sin etiqueta (proyección t-SNE).</div>`;
  const flow = ['Imágenes sin etiqueta', 'CNN encoder', 'Embeddings', 'Clustering', 'Grupos visuales'];
  return `<div class="col-l" style="width:390px"><div class="pts"><div class="pt sm"${F(1, 'up')}>Los embeddings permiten <b>explorar colecciones</b> de imágenes sin etiquetas.</div></div>
    <div class="x-flow"${F(1, 'up', 200)}>${flow.map((t, j) => `<span${j === 4 ? ' class="on"' : ''}>${t}</span>`).join('<b>↓</b>')}</div>
    <div class="x-chip" style="margin-top:18px"${F(3, 'up', 200)}>Clustering: k-means · DBSCAN · HDBSCAN</div></div>
  <div class="col-r" style="left:440px;right:-30px">${s}</div>`;
}, run: {
  3: A => { A.ks('cl').forEach(e => e.classList.add('c' + e.dataset.c)); A.k('cnote').textContent = 'k-means (k = 5) colorea cada foto según su grupo.'; },
  4: A => { A.ks('chalo').forEach(h => h.classList.add('off')); A.ks('cl').forEach((e, j) => { e.style.setProperty('--md', (j * 40) + 'ms'); e.style.left = e.style.getPropertyValue('--rx'); e.style.top = e.style.getPropertyValue('--ry'); }); A.k('cnote').classList.add('off'); }
}, len: {2: 400, 3: 900}});

/* 19 · case 3: transfer learning (plus a real few-shot experiment) */
const HICON = {
  wrench: '<svg viewBox="0 0 24 24"><path d="M14.5 5.5a4 4 0 0 0 5 5L12 18a2.1 2.1 0 1 1-3-3l7.5-7.5a4 4 0 0 1-2-2z"/></svg>',
  heart: '<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/><path d="M5 12h4l1.5-3 2 5 1.5-2H19"/></svg>',
  cart: '<svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 10.2a1 1 0 0 0 1 .8h8.8a1 1 0 0 0 1-.8L20 7H6.2"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>',
  paw: '<svg viewBox="0 0 24 24"><circle cx="7" cy="9" r="1.8"/><circle cx="12" cy="6.5" r="1.8"/><circle cx="17" cy="9" r="1.8"/><path d="M8 17c0-2.5 2-5 4-5s4 2.5 4 5c0 1.6-1.6 2.4-4 2.4S8 18.6 8 17z"/></svg>',
  x: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>'
};
P({kicker: 'Caso 3', extra: 'Experimento real con las fotos de esta clase: 39 fotos de 5 categorías (perros, gatos, autos, calzado, sillas). Tomamos 1 foto etiquetada por categoría y clasificamos las demás por cercanía (similitud coseno al ejemplo de cada clase), 2000 sorteos. Con embeddings de ResNet-50: 92% de aciertos (98% con 3 fotos por clase). Con los píxeles (32×32): 27%, casi el azar (20%). El backbone nunca vio estas fotos: su conocimiento es transferible.', body: () => {
  const FS = DATA.fewshot;
  let s = `<div class="x-blk" style="left:0;top:40px;width:330px;height:330px;justify-content:flex-start;padding-top:24px"${F(2, 'zoom', 0, 'data-i="0"')}><b style="font-size:19px">CNN preentrenada (encoder)</b><small>ImageNet: 1.28 millones de imágenes</small></div>`;
  s += CNN(50, 130, 230, 150, {b: 2, d: 200, n: 9});
  s += LB(165, 300, '<b class="gd">Conocimiento visual general</b><br>(transferible)', {b: 2, d: 500});
  const heads = [['Clasificador de defectos', 'wrench', 'var(--g6)'], ['Clasificador médico', 'heart', 'var(--g2)'], ['Clasificador de productos', 'cart', 'var(--g1)'], ['Clasificador de especies', 'paw', 'var(--g5)'], ['Clasificador original (retirado)', 'x', '#9aa3ad']];
  heads.forEach(([t, ic, col], j) => {
    const y = 18 + j * 76, last = j === 4;
    s += L(330, 205, 420, y + 30, {b: last ? 4 : 3, d: j * 180, w: 2, cls: last ? 'drop' : 'gold', arrow: !last, i0: true});
    s += `<div class="x-head${last ? ' gone' : ''}" style="left:430px;top:${y}px"${F(last ? 4 : 3, 'left', j * 180 + 150, 'data-i="0"')}><i style="--hc:${col}">${CLS(0, 0, {h: [22, 14, 9], style: 'position:relative;padding:6px 8px 5px;gap:4px;border:0;background:transparent'})}</i><span>${t}</span><em style="--hc:${col}">${HICON[ic]}</em></div>`;
  });
  s += `<div class="x-exp" style="left:0;top:404px;width:960px"${F(5, 'up', 0, 'data-i="0"')}><div class="x-tag">Experimento real · 1 foto etiquetada por clase (5 clases, ${FS.n} fotos)</div>
    <div class="x-exb"><span>Embedding ResNet-50</span><div class="x-bar"><i style="width:${FS.emb1 * 100}%"></i></div><b>${pct(FS.emb1)}</b></div>
    <div class="x-exb"><span>Píxeles</span><div class="x-bar red"><i style="width:${FS.pix1 * 100}%"></i></div><b>${pct(FS.pix1)}</b></div>
    <div class="x-exb"><span>Azar</span><div class="x-bar" style="background:transparent;border:1px dashed var(--hair2)"><i style="width:${FS.chance * 100}%;background:#c4cbd2"></i></div><b>${pct(FS.chance)}</b></div></div>`;
  return `<div class="col-l" style="width:400px">${PTS(['Una CNN entrenada en millones de imágenes ya aprendió <b>patrones visuales generales</b>.', 'Podemos reutilizar ese conocimiento para una tarea nueva, sobre todo con <b>pocos datos etiquetados</b>.'], 1, {pc: 'sm', beats: [1, 3]})}
    <div class="x-call" style="position:relative;margin-top:16px;font-size:18px"${F(4, 'up', 300)}>${ICON.bulb}<span>El <b>embedding</b> es la parte transferible; la cabeza (<b>head</b>) se adapta a la nueva tarea.</span></div></div>
  <div class="col-r" style="left:450px;right:-30px">${s}</div>`;
}});

/* 20 · case 4: anomaly detection (real distances to the centroid of normal images) */
P({kicker: 'Caso 4', extra: 'Distancias reales (1 − similitud coseno) de cada foto al centroide de 8 botellas «normales» (cada botella se mide contra el centroide de las otras 7). La bota vaquera queda a 0.42: fuera del umbral. El garrafón dañado de la diapositiva original queda a 0.20, dentro del grupo: una ResNet-50 de ImageNet lo describe como «water jug» y no se fija en manchas ni golpes. Para detectar defectos, el embedding debe aprender esa noción de similitud (con fotos del problema real).', body: () => {
  const A = DATA.anom, CX = 300, CY = 262, SC = 560, thr = .33;
  let s = '';
  [.1, .2, .3, .4].forEach((r, j) => { s += `<div class="x-ring" style="left:${CX - r * SC}px;top:${CY - r * SC}px;width:${2 * r * SC}px;height:${2 * r * SC}px"${F(2, 'fade', j * 80, 'data-i="0"')}><span>${r.toFixed(1)}</span></div>`; });
  s += `<div class="x-ring thr" style="left:${CX - thr * SC}px;top:${CY - thr * SC}px;width:${2 * thr * SC}px;height:${2 * thr * SC}px"${F(3, 'zoom', 0, 'data-i="0"')}></div>`;
  s += `<i class="x-cen" style="left:${CX - 7}px;top:${CY - 7}px"${F(2, 'pop', 300, 'data-i="0"')}></i>` + LB(CX, CY + 14, 'centroide', {b: 2, d: 400, style: 'font-size:12px'});
  const ang = [-150, -110, -70, -30, 60, 100, 135, 165];
  A.normal.forEach((n, j) => { const a = ang[j] * Math.PI / 180, r = n.d * SC; s += TB(n.k, CX + r * Math.cos(a) - 26, CY + r * Math.sin(a) - 26, {b: 2, d: 500 + j * 90, cls: 'sm'}); });
  const ab = 20 * Math.PI / 180, rb = A.boot.d * SC, aj = 205 * Math.PI / 180, rj = A.jug.d * SC;
  s += TB(A.boot.k, CX + rb * Math.cos(ab) - 26, CY + rb * Math.sin(ab) - 26, {b: 3, d: 300, cls: 'sm out'});
  s += `<div class="x-tagr" style="left:${CX + rb * Math.cos(ab) + 34}px;top:${CY + rb * Math.sin(ab) - 22}px"${F(3, 'pop', 600, 'data-i="0"')}>Posible anomalía · ${f2(A.boot.d)}</div>`;
  s += TB('u_jug_anomaly', CX + rj * Math.cos(aj) - 26, CY + rj * Math.sin(aj) - 26, {b: 4, d: 0, cls: 'sm hit'});
  s += LB(CX + thr * SC * Math.cos(-.9) + 44, CY + thr * SC * Math.sin(-.9) - 30, `<b style="color:var(--red)">umbral ${thr}</b>`, {b: 3, d: 200});
  s += `<div style="position:absolute;left:630px;top:24px;width:350px;display:flex;gap:14px;align-items:flex-start"${F(4, 'up', 200, 'data-i="0"')}><div class="x-ph" style="position:relative;left:0;top:0;flex:none;width:110px;height:128px"><img src="${IMG.jug}" alt="Garrafón dañado"></div>
    <div style="font-size:16px;line-height:1.38"><b>Garrafón dañado</b> (de la diapositiva original): distancia <b class="gd">${f2(A.jug.d)}</b>, <b>dentro</b> del grupo.<br><span style="font-size:14px;color:var(--muted)">ResNet-50 lo describe como «${A.jug_top[0]}»: no mira manchas ni golpes. Para defectos, el embedding debe aprender <i>esa</i> similitud.</span></div></div>`;
  return `<div class="col-l" style="width:400px"><div class="pts"><div class="pt sm" style="border:0"${F(1, 'up')}>Si las imágenes normales forman una <b>región compacta</b>, una imagen extraña puede aparecer <b>lejos</b>.</div></div>
    <div class="x-tag" style="margin:4px 0 10px"${F(1, 'up', 150)}>Idea</div>
    <div class="x-steps"${F(1, 'up', 250)}><div class="x-step" style="font-size:19px"><i style="background:var(--green)">✓</i><span><b>normal</b> = cerca del grupo</span></div><div class="x-step" style="font-size:19px"><i style="background:var(--red)">!</i><span><b>anómalo</b> = lejos del grupo</span></div></div>
    <div class="x-call" style="position:relative;margin-top:20px;font-size:18px"${F(5, 'up')}>${ICON.target}<span>El embedding ayuda a medir <b>qué tan diferente</b> es una imagen… según la similitud que aprendió.</span></div></div>
  <div class="col-r" style="left:440px;right:-30px">${s}</div>`;
}});

/* 21 · what makes an embedding good? the same photos in two embedding spaces (interactive) */
const SPA = {Vehículos: '#2f63a8', Perros: '#b07a26', Frutas: '#2e9466'}, SPB = {Rojos: '#c0392b', Amarillos: '#d4a017', Blancos: '#8d99a6'};
P({extra: 'Diapositiva interactiva: → / ← (o los botones) alternan entre dos embeddings de las mismas 15 fotos. Espacio A: embeddings reales de ResNet-50 (proyección t-SNE): se agrupan por objeto. Espacio B: un embedding de color hecho a mano (histograma de tonos de la zona central), proyectado igual: se agrupan por color. Ninguno es «el correcto»: depende de la tarea.', body: () => {
  const W = 940, H = 456, SP = DATA.space, RA = relax(SP.map(d => [10 + d.ax * (W - 110), 66 + d.ay * (H - 140)]), 88, W, H, 80), RB = relax(SP.map(d => [10 + d.bx * (W - 110), 66 + d.by * (H - 140)]), 88, W, H, 80);
  const ax = d => RA[SP.indexOf(d)][0], ay = d => RA[SP.indexOf(d)][1] + 6, bx = d => RB[SP.indexOf(d)][0], by = d => RB[SP.indexOf(d)][1] + 6;
  let s = `<div style="position:absolute;left:0;top:0;display:flex;gap:10px" data-int${F(3, 'up', 0, 'data-i="0"')}><button type="button" class="x-chip" data-k="chip" aria-pressed="false"><span><b>Espacio A</b> · similitud por objeto (ResNet-50)</span></button><button type="button" class="x-chip" data-k="chip" aria-pressed="false"><span><b>Espacio B</b> · similitud por color</span></button></div>`;
  const labs = (groups, key, fx, fy, k) => Object.entries(groups).map(([g, col]) => {
    const its = SP.filter(d => d[key] === g), cx = its.reduce((a, d) => a + fx(d), 0) / its.length + 40, top = Math.min(...its.map(fy));
    return `<div class="x-hlab x-fade${k === 'hb' ? ' off' : ''}" data-k="${k}" style="left:${cx}px;top:${top - 8}px;color:${col}">${g}</div>`;
  }).join('');
  s += `<div${F(3, 'fade', 300, 'data-i="0"')}>${labs(SPA, 'o', ax, ay, 'hA')}</div><div>${labs(SPB, 'c', bx, by, 'hb')}</div>`;
  s += `<div class="x-sp" data-k="spw">`;
  SP.forEach((d, j) => { s += TB(d.k, ax(d), ay(d), {b: 2, d: j * 50, dk: 'sp', cls: 'big', style: `--ax:${ax(d)}px;--ay:${ay(d)}px;--bx:${bx(d)}px;--by:${by(d)}px;--ca:${SPA[d.o] || '#9aa3ad'};--cb:${SPB[d.c]}`}); });
  s += `</div>`;
  s += `<div class="x-hint" style="left:0;top:520px"${F(3, 'fade', 600, 'data-i="0"')}><b>→ / ←</b> cambian de espacio: las mismas fotos, otra noción de «parecido».</div>`;
  const ex = [['Para identificar objetos', 'perro cerca de perro'], ['Para buscar estilo', 'objetos rojos cerca de objetos rojos'], ['Para detectar defectos', 'productos normales cerca de normales']];
  return `<div class="col-l" style="width:400px"><div class="pts"><div class="pt sm"${F(1, 'up')}>Un buen embedding conserva <b>la similitud que importa</b> para la tarea.</div><div class="pt sm" style="border:0"${F(1, 'up', 150)}>Pero «similar» no siempre significa lo mismo:</div></div>
    <div class="x-ex"${F(1, 'up', 300)}>${ex.map(([a, b]) => `<div><b>${a}:</b> ${b}.</div>`).join('')}</div>
    <div class="x-call" style="position:relative;margin-top:18px;font-size:17px"${F(3, 'up', 900)}>${ICON.scale2}<span>Un embedding no es «la verdad» de la imagen. Es una <b>representación aprendida</b> para cierto tipo de similitud.</span></div></div>
  <div class="col-r" style="left:440px;right:-30px">${s}</div>`;
}, run: {3: A => {
  const tb = A.ks('sp'), hA = A.ks('hA'), hB = A.ks('hb');
  STEP(A, {n: 2, chips: A.ks('chip'), fin: 0, set: k => {
    tb.forEach((e, j) => { e.style.setProperty('--md', (j * 35) + 'ms'); e.style.left = e.style.getPropertyValue(k ? '--bx' : '--ax'); e.style.top = e.style.getPropertyValue(k ? '--by' : '--ay'); });
    hA.forEach(h => h.classList.toggle('off', k === 1)); hB.forEach(h => h.classList.toggle('off', k === 0)); A.k('spw').classList.toggle('b', k === 1);
  }});
}}});

/* 22 · practical decisions; cosine vs euclidean with real numbers (interactive) */
const PIC = {
  data: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="10" y="3" width="5" height="5" rx="1"/><rect x="17" y="3" width="4" height="5" rx="1"/><rect x="3" y="10" width="5" height="5" rx="1"/><rect x="10" y="10" width="5" height="5" rx="1"/><rect x="17" y="10" width="4" height="5" rx="1"/><rect x="3" y="17" width="5" height="4" rx="1"/><rect x="10" y="17" width="5" height="4" rx="1"/></svg>',
  model: '<svg viewBox="0 0 24 24"><circle cx="5" cy="6" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="19" cy="18" r="2"/><path d="M7 6.8 10.2 11M7 17.2l3.2-4.2M13.8 11 17 6.8M13.8 13l3.2 4.2"/></svg>',
  layer: '<svg viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5z"/><path d="m3 12 9 5 9-5"/><path d="m3 16 9 5 9-5"/></svg>',
  norm: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke-dasharray="3 2.5"/><path d="M12 12 17.6 6.4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>',
  ruler: '<svg viewBox="0 0 24 24"><path d="M3 17 17 3l4 4L7 21z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/></svg>',
  target: ICON.target
};
P({extra: 'Números reales (ResNet-50): perro–perro y perro–auto. Sin normalizar, la distancia euclidiana mezcla dirección y tamaño del vector. Con vectores normalizados (L2), ‖a − b‖ = √(2 − 2·cos(a, b)): ambas métricas ordenan igual. Botón o → / ← para alternar.', body: () => {
  const steps = [['data', 'Datos disponibles'], ['model', 'Modelo preentrenado'], ['layer', 'Capa de extracción'], ['norm', 'Normalización'], ['ruler', 'Métrica de distancia'], ['target', 'Aplicación']];
  let s = steps.map(([ic, t], j) => `<div class="x-pstep" style="left:${j * 156}px;top:0"${F(2, 'up', j * 140, 'data-i="0"')}>${PIC[ic]}<span>${t}</span></div>` + (j < 5 ? AR(j * 156 + 122, 54, j * 156 + 150, 54, {b: 2, d: j * 140 + 100, w: 2}) : '')).join('');
  const S = DATA.sim;
  s += `<div class="x-mcard" style="left:0;top:150px"${F(3, 'up', 0, 'data-i="0"')}><div class="x-mtitle">Similitud coseno <small>compara la dirección</small></div>
    <svg viewBox="0 0 220 120" class="x-msvg"><path d="M20 105 L180 35" class="xva"/><path d="M20 105 L200 75" class="xvb"/><path d="M60 88 A 44 44 0 0 0 63 86" class="xang"/><text x="70" y="92">θ</text></svg>
    <div class="x-mrow"><span>perro – perro</span><b class="xg">${f3(S.d12.cos)}</b></div><div class="x-mrow"><span>perro – auto</span><b class="xr">${f3(S.d1c.cos)}</b></div></div>`;
  s += `<div class="x-mcard" style="left:478px;top:150px"${F(3, 'up', 200, 'data-i="0"')}><div class="x-mtitle">Distancia euclidiana <small data-k="eunote">compara la distancia directa</small></div>
    <svg viewBox="0 0 220 120" class="x-msvg"><circle cx="30" cy="80" r="7" class="xpa"/><circle cx="190" cy="40" r="7" class="xpb"/><path d="M38 78 L182 42" class="xdd"/></svg>
    <div class="x-mrow"><span>perro – perro</span><b class="xg" data-k="eu1">${S.d12.eu.toFixed(1)}</b></div><div class="x-mrow"><span>perro – auto</span><b class="xr" data-k="eu2">${S.d1c.eu.toFixed(1)}</b></div></div>`;
  s += `<div style="position:absolute;left:0;top:440px;display:flex;gap:10px;align-items:center" data-int${F(4, 'up', 0, 'data-i="0"')}><button type="button" class="x-chip" data-k="chip" aria-pressed="false"><span>Vectores tal cual</span></button><button type="button" class="x-chip" data-k="chip" aria-pressed="false"><span>Normalizados (L2)</span></button><span class="x-formula" data-k="form">‖a − b‖² = 2 − 2·cos(a, b)</span></div>`;
  const qs = ['¿Qué CNN usamos?', '¿Preentrenada o desde cero?', '¿De qué capa sacamos el embedding?', '¿Congelamos el backbone o hacemos fine-tuning?', '¿Normalizamos el vector?', '¿Qué métrica usamos para comparar?'];
  return `<div class="col-l" style="width:440px"><div class="x-tag" style="margin-bottom:8px"${F(1, 'up')}>Decisiones importantes</div><div class="x-qlist"${F(1, 'up', 150)}>${qs.map(q => `<div>${q}</div>`).join('')}</div>
    <div class="x-call" style="position:relative;margin-top:16px;font-size:17px"${F(4, 'up', 500)}>${ICON.bulb}<span>Extraer embeddings es sencillo conceptualmente, pero <b>las decisiones de diseño cambian el resultado</b>.</span></div></div>
  <div class="col-r" style="left:480px;right:-30px">${s}</div>`;
}, run: {4: A => {
  const S = DATA.sim;
  STEP(A, {n: 2, chips: A.ks('chip'), fin: 1, set: k => {
    A.k('eu1').textContent = k ? f3(S.n12) : S.d12.eu.toFixed(1); A.k('eu2').textContent = k ? f3(S.n1c) : S.d1c.eu.toFixed(1);
    A.k('eunote').textContent = k ? 'con vectores de norma 1' : 'compara la distancia directa'; A.k('form').classList.toggle('on', k === 1);
  }});
}}});

/* 23 · closing: classification vs representation */
P({body: () => {
  let s = PH('th_Persian_cat', 0, 150, 130, 130, {b: 2, alt: 'Gato persa'}) + LB(65, 292, '<b>Imagen</b>', {b: 2, d: 100});
