/* minimal Python highlighting for the code shown on slides */
const PY_KW = new Set(['import', 'from', 'if', 'else', 'elif', 'for', 'in', 'return', 'def', 'class', 'with', 'as', 'not', 'and', 'or', 'None', 'True', 'False', 'lambda', 'while']);
function hlPy(src) {

  return String(src).split('\n').map(line => line.replace(/(#.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|([A-Za-z_]\w*)(?=\()|([A-Za-z_]\w*)|(\b\d+(?:\.\d+)?\b)|([^#"'A-Za-z_\d]+|.)/g,

}

const F = (b, fx = 'up', d = 0, x = '') => ` data-b="${b}" data-fx="${fx}"${d ? ` data-d="${Math.round(d)}"` : ''}${x ? ' ' + x : ''}`;
const fxa = o => (o.b != null ? F(o.b, o.fx, o.d || 0) : (o.fx ? ` data-fx="${o.fx}"` : '')) + (o.i0 ? ' data-i="0"' : '') + (o.k ? ` data-k="${o.k}"` : '');
/* a straight line (a rotated div) from (x1,y1) to (x2,y2) */
function L(x1, y1, x2, y2, o = {}) {
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy), ang = Math.atan2(dy, dx) * 180 / Math.PI, w = o.w || 2;
  return `<div class="ln ${o.cls || ''}"${fxa({...o, fx: o.fx || (o.b != null ? 'draw' : null)})} style="left:${px(x1)};top:${px(y1 - w / 2)};width:${px(len)};height:${w}px;transform:rotate(${ang.toFixed(2)}deg)${o.style ? ';' + o.style : ''}"><i></i>${o.arrow ? '<b class="ah"></b>' : ''}</div>`;
}
/* a line between the borders of two circles */
function LC(x1, y1, r1, x2, y2, r2, o = {}) {
  const dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy), ux = dx / d, uy = dy / d, e = r2 + (o.arrow ? 9 : 0);
  return L(x1 + ux * r1, y1 + uy * r1, x2 - ux * e, y2 - uy * e, o);
}
/* a polyline whose segments draw one after another */
function PL(pts, o = {}) {
  let s = ''; const st = o.step || 14;
  for (let k = 1; k < pts.length; k++) {
    const [a, b] = [pts[k - 1], pts[k]], dx = b[0] - a[0], dy = b[1] - a[1], m = Math.hypot(dx, dy) || 1, e = 1.2 / m;
    s += L(a[0] - dx * e, a[1] - dy * e, b[0] + dx * e, b[1] + dy * e, {...o, cls: (o.cls || '') + ' seg', d: (o.d || 0) + (k - 1) * st, i0: true});

  return s;
}

function N(x, y, r, html, o = {}) {

}
/* a label anchored at (x,y): al = l | c | r (horizontal), v = t | c | b (vertical) */
function T(x, y, html, o = {}) {

}

function PTS(list, b0 = 1, o = {}) {

}
/* deterministic pseudo-random numbers */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
/* scatter data shared by slides 11 and 12: an inner cluster (A) and a ring (B) */
const SCAT = (() => {

function HIER(build) {

  const glyph = [

/* 21 · hype cycle */
const HYP = x => { const p = .22, w = x < p ? .10 : .075; return .93 * Math.exp(-(((x - p) / w) ** 2)) + .5 / (1 + Math.exp(-(x - .6) / .075)); };
const HXp = x => 60 + x * 1320, HYp = x => 18 + (1 - HYP(x)) * 372;
P({body: () => {
  const pts = []; for (let k = 0; k <= 110; k++) { const x = k / 110; pts.push([HXp(x), HYp(x)]); }
  const ph = [[0, .15], [.15, .30], [.30, .50], [.50, .75], [.75, 1]].map((p, k) => [...p, K[21].phases[k]]);
  const mk = [[.08, 'r', 4], [.205, 'l', -8], [.235, 'r', 0], [.508, 'd', 0], [.578, 'd', 0]].map(([x, side, dy], k) => [x, K[21].technologies[k], side, dy]);
  let s = L(60, 0, 60, 392, {b: 1, w: 1, fx: 'fade', cls: 'ax'}) + L(60, 392, 1390, 392, {b: 1, w: 1, fx: 'fade', cls: 'ax'}) + T(34, 200, `<span class="tag hy-y">${K[21].y_axis}</span>`, {b: 1}) + T(1390, 376, `<span class="tag">${K[21].x_axis}</span>`, {b: 1, al: 'r'});
  s += PL(pts, {b: 1, w: 3, step: 15, d: 300, cls: 'hyc'});
  ph.forEach(([a, b, t], k) => { if (k) s += L(HXp(a), 30, HXp(a), 392, {b: 2, w: 1, fx: 'fade', cls: 'ax'}); s += T((HXp(a) + HXp(b)) / 2, 404, `<span class="hy-p">${t}</span>`, {b: 2, v: 't', fx: 'up', inner: `display:block;width:${Math.min(250, (b - a) * 1320 - 16)}px;text-align:center;white-space:normal`}); });
  mk.forEach(([x, t, side, dy], k) => {
    const X = HXp(x), Y = HYp(x);
    s += `<div class="hy-m" style="left:${X - 7}px;top:${Y - 7}px"${F(3, 'pop', k * 260, 'data-i="0"')}></div>`;
    const o = {b: 3, d: k * 260 + 150, i0: true, cls: 'hy-l'};
    if (side === 'l') s += T(X - 16, Y + dy, t, {...o, al: 'r'}); else if (side === 'r') s += T(X + 16, Y + dy, t, {...o, al: 'l'});
