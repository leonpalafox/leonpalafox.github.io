/* 02 · what the toolkit can't do: a fixed slot (real input sizes) */

  for (let k = 0; k < 3; k++) s += `<div class="rn-slot" style="left:${k * 112}px;top:34px"${FX(1, 'fade', 100 + k * 60)}></div>`;

  s += `<div class="rn-slot dash" style="left:-8px;top:146px;width:${3 * 80 + 8}px"${FX(2, 'fade')}></div>`;
  for (let k = 0; k < 9; k++) s += `<span class="rn-tk rn-abs${k > 2 ? ' ovf' : ''}" style="left:${k * 80}px;top:154px;width:70px;text-align:center"${FX(2, 'left', 120 + k * 70)}>${tk(k + 1)}</span>`;

  s += BT(0, 290, 700, `<p>With 300-dimensional word embeddings, the 3-token slot is a vector of exactly <b>900</b> inputs. A 9-token sentence is <b>2,700</b> numbers: a different input size, so the same network cannot even read it.</p><p class="mu">Cutting to 3 tokens throws information away; padding every sentence to the longest one wastes inputs and still fails on the next, longer sentence.</p>`, {b: 3});
  const cards = [['net', 'MLP', 'Needs a <b>fixed-size input</b>. A sequence has no fixed length.', ''],
    ['layers', 'CNN', '<b>Fixed receptive field</b>. Sees a local window, not arbitrary-distance history.', 'A 1-D convolution with kernel 3 sees 3 neighbouring tokens; L stacked layers see 2L + 1.'],

/* 03 · sequences everywhere (dummy data, except the four real video frames) */
P({body: () => {
  const R = rng(5), W = 300, H = 74;
  const path = (f, n) => { let d = ''; for (let k = 0; k <= n; k++) { const x = k / n * W, y = f(k / n); d += (k ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1); } return d; };
  const wave = path(u => { const env = Math.exp(-Math.pow((u - .45) / .28, 2)); return H / 2 - H * .46 * env * (Math.sin(u * 2 * Math.PI * 22) * .7 + Math.sin(u * 2 * Math.PI * 47) * .3) * (.75 + .25 * Math.sin(u * 9)); }, 420);
  const notes = [0, 2, 4, 5, 7, 5, 4, 2, 4, 7, 9, 7];
  const roll = notes.map((n, k) => `<rect x="${k * 25 + 1}" y="${H - 8 - n * 6.6}" width="22" height="7" rx="2" fill="${k % 4 === 0 ? 'var(--gold-d)' : 'var(--gold)'}"/>`).join('');
  const sens = ['var(--red)', 'var(--blue)', 'var(--green)'].map((c, j) => { const ph = R() * 6, f = 2 + j; return `<path d="${path(u => H / 2 + (j - 1) * 16 + 11 * Math.sin(u * f * 2 * Math.PI + ph) + 5 * Math.sin(u * 23 * (j + 1)), 120)}" stroke="${c}" stroke-width="1.6" fill="none"/>`; }).join('');
  const ts = path(u => { const d = u * 60; return H - 6 - (d * .62 + 16 * (Math.floor(d) % 7 >= 5 ? 1 : 0) + 7 * Math.sin(d / 3)) * .9; }, 60);
  const dna = Array.from({length: 56}, () => 'ACGT'[Math.floor(R() * 4)]).map(c => `<span class="b${c}">${c}</span>`).join('');
  const tiles = [
    ['Natural language', `<div class="rn-words">${'the cat sat on the mat'.split(' ').map(w => `<span>${w}</span>`).join('')}</div>`, 'one embedding x<sub>t</sub> per token · 6 tokens here'],
    ['Speech / audio', `<svg width="${W}" height="${H}"><path d="${wave}" stroke="var(--blue)" stroke-width="1.3" fill="none"/></svg>`, '16,000 samples per second (dummy signal)'],
    ['Music', `<svg width="${W}" height="${H}">${roll}</svg>`, 'notes over time (dummy melody)'],
    ['Video frames', `<div class="rn-frames">${[1, 2, 3, 4].map(k => `<img src="${IMG['f' + k]}" alt="Frame ${k} of a golden retriever running">`).join('')}</div>`, '25–30 frames per second'],
    ['Sensor / IoT streams', `<svg width="${W}" height="${H}">${sens}</svg>`, '3-axis accelerometer (dummy signal)'],
    ['DNA / protein', `<div class="rn-dna">${dna}</div>`, '4-letter alphabet · up to millions of bases (random)'],
    ['Time series', `<svg width="${W}" height="${H}"><path d="${ts}" stroke="var(--gold-d)" stroke-width="2" fill="none"/></svg>`, 'one value per day, weekly cycle (dummy)']
  ];
  let s = '';
  tiles.forEach(([t, v, c], k) => {
    const row = k < 4 ? 0 : 1, col = row ? k - 4 : k, x = row ? 182 + col * 362 : col * 362;
    s += BOX(x, row * 172, 340, 156, `<div class="rn-tl-t">${t}</div><div class="rn-tl-v">${v}</div><div class="rn-tl-c">${c}</div>`, {b: 1, d: k * 110});
  });
  s += `<div class="rn-rub" style="left:0;top:362px;width:1428px"${FX(2, 'up')}><span class="rn-rub-h">A solution must</span>${['handle <b>variable length</b>', 'respect <b>order</b>', 'carry <b>memory</b> across arbitrary distance'].map((t, k) => `<span class="rn-rub-i"${FX(2, 'pop', 300 + k * 250)}><i>${k + 1}</i>${t}</span>`).join('')}</div>`;
  s += BT(0, 470, 1428, '<span class="mu">This checklist is our rubric for the plain RNN, then the LSTM and the GRU.</span>', {b: 3, style: 'text-align:center'});
  return s;
}});

/* 04 · the recurrence: a real forward pass of a tiny random RNN */
P({body: () => {
  const C = DATA.cat, toks = ['the', 'cat', 'sat', 'on', 'the'];
  let s = CELL(RNN_SPEC, {x: 0, y: 0, s: .8, b: 1, lit: 'all'});
  s += `<div class="rn-eq" style="position:absolute;left:0;top:244px"${FX(2, 'up')}><i>h</i><sub>t</sub> = <span class="u">tanh</span>(<i>W</i><sub>hh</sub>·<i>h</i><sub>t−1</sub> + <i>W</i><sub>xh</sub>·<i>x</i><sub>t</sub> + <i>b</i><sub>h</sub>)</div>`;
  s += `<div class="rn-eq" style="position:absolute;left:0;top:286px"${FX(2, 'up', 200)}><i>y</i><sub>t</sub> = <i>g</i>(<i>W</i><sub>hy</sub>·<i>h</i><sub>t</sub>)</div>`;
  s += CALL(0, 340, 470, 'quote', '<b>h<sub>t</sub></b> is a compressed, lossy summary of everything seen so far, not a memory buffer.', {b: 3});
  s += NOTE(0, 452, 480, '<b>x<sub>t</sub></b> input · <b>h<sub>t</sub></b> hidden state · <b>y<sub>t</sub></b> output · <b>W</b> weights (shared by every step)', {b: 3, d: 200});
  // the forward pass
  const X0 = 600, Y0 = 46, cw = 104;
  s += TT(X0 - 70, 0, 'A tiny RNN with random weights reads “the cat sat on the ___”', {b: 1});
  toks.concat(['___']).forEach((t, k) => { s += `<span class="rn-tk rn-abs${k === 5 ? ' q' : ''}" data-k="tk" style="left:${X0 + k * cw}px;top:${Y0}px;width:94px;text-align:center"${FX(1, 'down', 200 + k * 90)}>${t}</span>`; });
  for (let j = 0; j < 6; j++) s += `<div class="rn-rl" style="left:${X0 - 66}px;top:${Y0 + 56 + j * 34}px"${FX(1, 'fade', 300)}><i>h</i>[${j + 1}]</div>`;
  const vals = Array.from({length: 6}, (_, j) => toks.map((_, t) => C.h[t][j]));
  s += HEAT(X0, Y0 + 52, vals.map(r => r.map((v, t) => (t ? null : v))), {cw: 94, ch: 30, k: 'hm', b: 1, d: 400, style: 'column-gap:10px;row-gap:4px'});
  s += `<div class="rn-tt" style="left:${X0 + 5 * cw - 4}px;top:${Y0 + 52}px;letter-spacing:.08em"${FX(2, 'fade')}>next word?</div>`;
  C.vocab.forEach((w, k) => { const p = C.probs[k]; s += `<div class="rn-pb dim" style="left:${X0 + 5 * cw - 4}px;top:${Y0 + 76 + k * 31}px"${FX(2, 'left', 120 + k * 60)}><span>${w}</span><i style="width:${(p * 220).toFixed(1)}px"></i><b>${p.toFixed(2)}</b></div>`; });
  s += NOTE(X0 - 70, Y0 + 300, 820, `Real numbers, meaningless model: 6 hidden units, 4-number dummy embeddings and PyTorch-style random initialisation. Before training, the next-word guess is close to uniform (1/6 ≈ 0.17): <b>p(mat) = ${C.probs[4].toFixed(2)}</b>. Training would push it up.`, {b: 2, d: 400});
  s += `<div class="x-chips" style="position:absolute;left:${X0 - 70}px;top:${Y0 + 390}px">${toks.map((t, k) => CHIPB(`t = ${k + 1} · ${t}`, null)).join('')}</div>`;
  return s;
}, run: {3: A => {
  const hm = A.k('hm'), C = DATA.cat, tks = A.ks('tk'), pb = A.qa('.rn-pb');
  const full = Array.from({length: 6}, (_, j) => [0, 1, 2, 3, 4].map(t => C.h[t][j]));
  STEP(A, {n: 5, chips: A.ks('chip'), fin: 4, set: k => {
    setHeat(hm, full.map(r => r.map((v, t) => (t <= k ? v : null))));
    tks.forEach((e, j) => { e.classList.toggle('on', j === k); e.classList.toggle('done', j < k); });
    pb.forEach(e => e.classList.toggle('dim', k < 4));
  }});
}}});

/* 05 · unrolling: the same 66 numbers at every step */

    if (k < 4) s += L(x + 134, 190, x + gap - 4, 190, {arrow: true, w: 2.6, cls: 'gold', b: 2, d: 420 + k * 220});

  s += L(X0 - 40, 190, X0 - 4, 190, {arrow: true, w: 2.6, cls: 'gold', b: 2, d: 200}) + `<div class="rn-lb m" style="left:${X0 - 38}px;top:156px;font-size:17px"${FX(2, 'fade', 200)}><i>h</i><sub>0</sub></div>`;

/* 06 · sharing across time (real parameter counts, PyTorch) */
P({body: () => {
  const Pm = PT.params;
  let s = TT(0, 0, 'CNN · sharing across space', {b: 1});

  s += NOTE(330, 60, 300, 'The <b>same 3×3 filter</b> at every position of the image.', {b: 1, d: 900});
  s += TT(740, 0, 'RNN · sharing across time', {b: 2});
  for (let k = 0; k < 6; k++) {
    s += `<div class="rn-rbox sm" style="left:${740 + k * 92}px;top:52px;width:64px;height:48px"${FX(2, 'zoom', 100 + k * 120)}><span class="rn-wtag">W</span></div>`;
    if (k < 5) s += L(740 + k * 92 + 66, 76, 740 + (k + 1) * 92 - 3, 76, {arrow: true, w: 2.2, cls: 'gold', b: 2, d: 160 + k * 120});
  }

  s += `<div class="rn-axis" style="left:0;top:172px;width:1428px"${FX(2, 'fade', 1000)}>weight sharing along a structured axis</div>`;
  // parameter chart (log scale)
  const Y0 = 224, X0 = 330, LW = 900, lg = v => (Math.log10(v) - 4) / 4 * LW;
  s += TT(0, Y0, 'Parameters to read T word vectors (300-d) into 128 units', {b: 3});

  const bars = [['mlp', 'MLP on the flattened sequence', 'T·300·128 + 128'], ['conv', 'Conv1d, kernel 3', '3·300·128 + 128'], ['rnn', 'RNN (nn.RNN)', '300·128 + 128·128 + 2·128']];
  bars.forEach(([k, t, f], j) => {

  }});
}}});

  ];
  let s = '';
  cols.forEach(([n, t, task, pat, lines], j) => {

/* ================= slides 10–17: the LSTM, with the hand-set toy cell ================= */
const WTOK = TOY.sentence;                       // the movie was not good
const LS = TOY.lstm.steps;
const prevC = t => (t ? LS[t - 1].c : [0, 0, 0, 0]);
const TOKCHIPS = (x, y, o = {}) => `<div class="x-chips rn-tchips" style="position:absolute;left:${x}px;top:${y}px"${o.b != null ? FX(o.b, 'fade', o.d || 0) : ''}><span class="rn-chl">token</span>${WTOK.map((w, k) => CHIPB(`${k + 1} · ${w}`, null)).join('')}</div>`;
const MATH = (x, y, html, o = {}) => `<div class="rn-eq" style="position:absolute;left:${x}px;top:${y}px${o.style ? ';' + o.style : ''}"${o.b != null ? FX(o.b, o.fx || 'up', o.d || 0) : ''}>${html}</div>`;
const SIG = '<span class="u">σ</span>', TANH = '<span class="u">tanh</span>';
const CAT = '[<i>h</i><sub>t−1</sub>, <i>x</i><sub>t</sub>]';
/* a small numeric table whose cells can be refreshed: cols = [[header, key]], rows = unit names */
function TBL(x, y, cols, o = {}) {
  const cw = o.cw || 92;
  let h = `<div class="rn-tb${o.cls ? ' ' + o.cls : ''}"${o.k ? ` data-k="${o.k}"` : ''} style="left:${x}px;top:${y}px;grid-template-columns:${o.lw || 96}px repeat(${cols.length},${cw}px)"${o.b != null ? FX(o.b, 'fade', o.d || 0) : ''}>`;
  h += `<span class="rn-th"></span>${cols.map(([t]) => `<span class="rn-th">${t}</span>`).join('')}`;
  (o.rows || UN).forEach((u, i) => { h += `<span class="rl">${u}</span>${cols.map(([, key], j) => `<span class="cv c${j}${j === cols.length - 1 ? ' lc' : ''}" data-r="${i}" data-c="${key}"></span>`).join('')}`; });
  return h + '</div>';
}
function fillTBL(el, get) { if (!el) return; el.querySelectorAll('.cv').forEach(c => { const v = get(c.dataset.c, +c.dataset.r); c.textContent = typeof v === 'number' ? fmt(v) : v; c.classList.toggle('neg', typeof v === 'number' && v < -0.005); c.style.setProperty('--hv', typeof v === 'number' ? Math.min(1, Math.abs(v)) : 0); }); }

/* 10 · the memory highway: the cell assembles itself */
P({body: () => {
  let s = BT(0, 0, 400, '<p style="font-size:24px;line-height:1.35">Give the network a separate <b>cell state <i class="m">c</i><sub>t</sub></b> with an <b>additive</b> update: a highway the signal travels without being repeatedly squashed.</p>', {b: 1});

/* 11 · a lightly-touched conveyor belt: stored values in a plain RNN vs the LSTM cell */
P({body: () => {
  let s = CELL(LSTM_SPEC, {x: 0, y: 6, s: .95, b: 1, lit: ['c'], dim: true, keep: ['f', 'add'], k: 'cell'});
  s += `<div class="rn-opl" style="left:${170 * .95 - 40}px;top:0"${FX(2, 'down')}>⊙ remove</div><div class="rn-opl" style="left:${330 * .95 - 22}px;top:0"${FX(2, 'down', 250)}>⊕ add</div>`;

  [['rnn', 'Plain RNN · h<sub>t</sub>', R.map(r => r.h)], ['lstm', 'LSTM · cell c<sub>t</sub>', LS.map(r => r.c)]].forEach(([m, t, M], j) => {
    const y = 92 + j * 196;
    s += `<div class="rn-mt" style="left:${X0}px;top:${y}px;color:${MC[m]}"${FX(3, 'fade', 200 + j * 200)}>${t}</div>`;
    UN.forEach((u, i) => { s += `<div class="rn-rl2" style="left:${X0}px;top:${y + 34 + i * 34}px"${FX(3, 'fade', 250 + j * 200)}>${u}</div>`; });
    s += HEAT(X0 + 104, y + 30, UN.map((_, i) => M.map((v, t) => (t ? null : v[i]))), {cw: 100, ch: 30, k: 'hm-' + m, b: 3, d: 300 + j * 200, style: 'column-gap:12px;row-gap:4px'});

/* 12–15 · one gate at a time, with the toy LSTM's real per-dimension values */
function GATE_SLIDE(cfg) {
  P({body: () => {
    let s = BT(0, 0, 420, cfg.text, {b: 1});
    cfg.eqs.forEach((e, k) => { s += MATH(0, cfg.eqY + k * 46, e, {b: 1, d: 300 + k * 200, style: 'font-size:22px'}); });
    s += CELL(LSTM_SPEC, {x: 460, y: 0, s: .9, b: 1, d: 150, lit: cfg.lit, dim: true, keep: cfg.keep || ['c'], k: 'cell'});
    s += TOKS(460 + 60, 330, WTOK, {k: 'toks', on: cfg.fin, done: true, fut: true, b: 2});
    s += cfg.right();
    s += TOKCHIPS(460, 392, {b: 3});
    if (cfg.note) s += NOTE(0, cfg.noteY || 330, 420, cfg.note, {b: 3, d: 200});
    return s;
  }, run: {3: A => {
    const toks = A.k('toks');
    STEP(A, {n: 5, chips: A.ks('chip'), fin: cfg.fin, set: k => { setToks(toks, k); cfg.set(A, k); }});
  }}});
}
const RCOL = 1060;
GATE_SLIDE({fin: 4, lit: ['f'], keep: ['c'], eqY: 112,
  text: '<p>For each dimension, the forget gate outputs a number between <b>0 and 1</b>: keep or erase. It multiplies <i class="m">c</i><sub>t−1</sub>.</p>',
  eqs: [`<i>f</i><sub>t</sub> = ${SIG}(<i>W</i><sub>f</sub>·${CAT} + <i>b</i><sub>f</sub>)`, `kept = <i>f</i><sub>t</sub> ⊙ <i>c</i><sub>t−1</sub>`],
  right: () => TT(RCOL, 0, 'Forget gate <span class="nt m">f<sub>t</sub></span> · per dimension', {b: 2}) + `<div class="rn-ke" style="left:${RCOL + 90}px;top:132px"${FX(2, 'fade')}><span>erase ≈ 0</span><span>keep ≈ 1</span></div>` + VBARS(RCOL, 26, LS[4].f, {signed: false, bw: 190, k: 'vf', b: 2, col: 'var(--cf)'})
    + TT(RCOL, 160, 'Memory before: <span class="nt m">c<sub>t−1</sub></span>', {b: 2, d: 200}) + VBARS(RCOL, 186, prevC(4), {bw: 190, k: 'vc', b: 2, d: 200})
    + TT(RCOL, 320, 'Kept: <span class="nt m">f<sub>t</sub> ⊙ c<sub>t−1</sub></span>', {b: 2, d: 300}) + VBARS(RCOL, 346, LS[4].f.map((f, i) => f * prevC(4)[i]), {bw: 190, k: 'vk', b: 2, d: 300}),
  note: 'Hand-set toy LSTM with four interpretable units (dummy word vectors, no training). At “good” the negation unit’s gate drops to <b>0.05</b>: the negation has done its job (it flipped “good”) and is erased. Everything else is kept (0.88–0.95).',
  set: (A, k) => { setBars(A.k('vf'), LS[k].f); setBars(A.k('vc'), prevC(k)); setBars(A.k('vk'), LS[k].f.map((f, i) => f * prevC(k)[i])); }});
GATE_SLIDE({fin: 3, lit: ['i', 'g'], keep: ['c'], eqY: 100,
  text: '<p>The <b>candidate</b> proposes what could be written; the <b>input gate</b> decides how much of it to actually write.</p>',
  eqs: [`<i>c̃</i><sub>t</sub> = ${TANH}(<i>W</i><sub>c</sub>·${CAT} + <i>b</i><sub>c</sub>)`, `<i>i</i><sub>t</sub> = ${SIG}(<i>W</i><sub>i</sub>·${CAT} + <i>b</i><sub>i</sub>)`, `<span class="rn-motif">propose (tanh) × gate (σ)</span>`],
  right: () => TT(RCOL, 0, 'Candidate <span class="nt m">c̃<sub>t</sub></span> · what could be written', {b: 2}) + VBARS(RCOL, 26, LS[3].g, {bw: 190, k: 'vg', b: 2, col: 'var(--cg)'})
    + TT(RCOL, 160, 'Input gate <span class="nt m">i<sub>t</sub></span> · how much', {b: 2, d: 150}) + VBARS(RCOL, 186, LS[3].i, {signed: false, bw: 190, k: 'vi', b: 2, d: 150, col: 'var(--ci)'})
    + TT(RCOL, 320, 'Written: <span class="nt m">i<sub>t</sub> ⊙ c̃<sub>t</sub></span>', {b: 2, d: 300}) + VBARS(RCOL, 346, LS[3].i.map((v, j) => v * LS[3].g[j]), {bw: 190, k: 'vw', b: 2, d: 300}),
  note: 'At “not” the candidate proposes <b>negation = 0.995</b> and the gate opens to <b>0.95</b> for that unit only. At “good” the candidate for sentiment is <b>−0.89</b>: it reads the negation stored in <i>h</i><sub>t−1</sub>, so a positive word proposes a negative sentiment.',
  set: (A, k) => { setBars(A.k('vg'), LS[k].g); setBars(A.k('vi'), LS[k].i); setBars(A.k('vw'), LS[k].i.map((v, j) => v * LS[k].g[j])); }});

/* 14 · update by addition: the real arithmetic, unit by unit */
P({body: () => {
  let s = MATH(0, 0, `<i>c</i><sub>t</sub> = <span class="rn-u1"><i>f</i><sub>t</sub> ⊙ <i>c</i><sub>t−1</sub></span> <span class="rn-plus">+</span> <span class="rn-u2"><i>i</i><sub>t</sub> ⊙ <i>c̃</i><sub>t</sub></span>`, {b: 1, style: 'font-size:46px'});
  s += `<div class="rn-ul" style="left:118px;top:76px"${FX(1, 'fade', 500)}>keep some old</div><div class="rn-ul" style="left:330px;top:76px"${FX(1, 'fade', 700)}>add some new</div>`;
  s += TBL(0, 128, [['c<sub>t−1</sub>', 'cp'], ['× f<sub>t</sub>', 'f'], ['= kept', 'kept'], ['+ i<sub>t</sub>⊙c̃<sub>t</sub>', 'new'], ['= c<sub>t</sub>', 'c']], {k: 'tb', b: 2, cw: 118, lw: 110});
  s += TOKS(0, 330, WTOK, {k: 'toks', on: 3, done: true, fut: true, b: 2, d: 200});
  s += TOKCHIPS(0, 392, {b: 3});
  s += CELL(LSTM_SPEC, {x: 760, y: 0, s: 1.04, b: 1, d: 200, lit: ['f', 'i', 'g', 'add', 'c'], dim: true, k: 'cell'});
  s += `<div class="rn-ban" style="left:760px;top:390px;width:668px"${FX(3, 'up', 200)}>The “+” is the whole trick.</div>`;
  s += NOTE(0, 452, 700, 'Real values of the toy LSTM. At “not” the only big change is the negation unit (0.00 → 0.95); the topic and the tense are just multiplied by their forget gates. Nothing is pushed through a squashing function on the way.', {b: 3, d: 300});
  return s;
}, run: {3: A => {
  const tb = A.k('tb'), toks = A.k('toks');
  STEP(A, {n: 5, chips: A.ks('chip'), fin: 3, set: k => {
    setToks(toks, k);
    const S = LS[k], cp = prevC(k);

/* 15 · output gate: what the rest of the network sees */
P({body: () => {
  let s = MATH(0, 0, `<i>o</i><sub>t</sub> = ${SIG}(<i>W</i><sub>o</sub>·${CAT} + <i>b</i><sub>o</sub>)`, {b: 1, style: 'font-size:26px'});

  ex[12] = `Real toy values. At “not”: c̃ = tanh(3) = ${fmt(LS[3].g[2], 3)} for negation and i = σ(3) = ${fmt(LS[3].i[2], 3)}, so ${fmt(LS[3].i[2] * LS[3].g[2], 3)} is written. At “good”: the candidate for sentiment is tanh(2.5 − 6 · ${fmt(LS[3].h[2])}) = ${fmt(LS[4].g[3])}, because h_{t−1} carries the negation; the input gate (${fmt(LS[4].i[3])}) writes ${fmt(LS[4].i[3] * LS[4].g[3])}. This is why the candidate reads h_{t−1} and not only x_t. Limitation of the toy: one sentiment unit cannot handle “not bad” (that needs an XOR-like combination, i.e. more units). Interactive: → / ← or the buttons.`;

/* split text into words / letters / typed characters */
function splitText(el, make) {
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [];
  while (w.nextNode()) nodes.push(w.currentNode);
  let k = 0;
  nodes.forEach(n => { const f = document.createDocumentFragment(); make(n.nodeValue, f, () => k++); n.parentNode.replaceChild(f, n); });
  return k;
}
function prep(root) {
  root.querySelectorAll('[data-fx=words]').forEach(e => splitText(e, (t, f, nx) => t.split(/(\s+)/).forEach(p => {
    if (!p) return; if (/^\s+$/.test(p)) { f.appendChild(document.createTextNode(p)); return; }
    const o = document.createElement('span'), i = document.createElement('span'); o.className = 'w'; i.textContent = p; i.style.setProperty('--wi', nx()); o.appendChild(i); f.appendChild(o);
  })));
  root.querySelectorAll('[data-fx=letters]').forEach(e => splitText(e, (t, f, nx) => [...t].forEach(c => {
    if (/\s/.test(c)) { f.appendChild(document.createTextNode(c)); return; }
    const s = document.createElement('span'); s.className = 'lt'; s.textContent = c; s.style.setProperty('--wi', nx()); f.appendChild(s);
  })));
  root.querySelectorAll('[data-fx=type]').forEach(e => { e._n = splitText(e, (t, f, nx) => [...t].forEach(c => { const s = document.createElement('span'); s.className = 'ch'; s.textContent = c; s.style.setProperty('--c', nx()); f.appendChild(s); })); });
  root.querySelectorAll('[data-store]').forEach(e => { const v = store('dlup:' + e.dataset.store); if (v) e.textContent = v; });
}
function build(i, root) { root._ctl = null; root.innerHTML = frame(i); root.dataset.i = i; prep(root); }
const beatsOf = root => { const s = S[+root.dataset.i], set = new Set([...root.querySelectorAll('[data-b]')].map(e => +e.dataset.b)); if (s && s.run) Object.keys(s.run).forEach(k => set.add(+k)); return [...set].sort((a, b) => a - b); };

/* scheduler: real timers when live, a discrete event loop when rendering a final state */
function sched(ms, fn) {
  if (INSTANT) { iq.push({at: icur + Math.max(0, ms), fn, s: iseq++}); return; }
  const my = runId, item = {due: performance.now() + ms, fn};
  item.id = setTimeout(() => { const k = pend.indexOf(item); if (k >= 0) pend.splice(k, 1); if (my === runId) { try { fn(); } catch (err) { console.error(err); } } checkIdle(); }, ms);
  pend.push(item);
}
function instantRun(seed) {
  const pI = INSTANT, pq = iq, pc = icur; INSTANT = true; iq = []; icur = 0;
  try {
    seed(); let guard = 0;
    while (iq.length && guard++ < 50000) {
      let m = 0; for (let k = 1; k < iq.length; k++) if (iq[k].at < iq[m].at || (iq[k].at === iq[m].at && iq[k].s < iq[m].s)) m = k;
      const it = iq.splice(m, 1)[0]; icur = it.at; try { it.fn(); } catch (err) { console.error(err); }
    }
  } finally { INSTANT = pI; iq = pq; icur = pc; }
}
const eio = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
function tween(dur, step, ease = eio) {
  if (INSTANT || RM.matches) { step(1); return; }
  const my = runId, t0 = performance.now(), tw = {done: false, finish() { if (tw.done) return; tw.done = true; tweens.delete(tw); step(1); }};
  tweens.add(tw);
  const f = now => {
    if (tw.done) return; if (my !== runId) { tw.done = true; tweens.delete(tw); return; }
    const p = Math.min(1, Math.max(0, (now - t0) / dur)); step(ease(p));
    if (p >= 1) { tw.done = true; tweens.delete(tw); checkIdle(); } else requestAnimationFrame(f);
  };
  requestAnimationFrame(f);
}
function countUp(e, d) {
  const to = +e.dataset.count, dec = +(e.dataset.dec || 0), suf = e.dataset.suf || '', show = v => { e.textContent = (e.dataset.sep ? Math.round(v).toLocaleString('en-US') : v.toFixed(dec)) + suf; };
  if (INSTANT || RM.matches) { show(to); return; }
  show(0); sched(d, () => tween(1100, p => show(to * p), p => 1 - Math.pow(1 - p, 3)));
}
function revealBeat(root, b) {
  if (!INSTANT) void root.offsetWidth;
  let k = 0, tacc = 0;
  root.querySelectorAll(`[data-b="${b}"]`).forEach(e => {
    let d = +(e.dataset.d || 0);
    if (e.dataset.fx === 'type') { const sp = +(e.dataset.sp || TYPE_SP); e.style.setProperty('--sp', sp + 'ms'); d += tacc; tacc = d + (e._n || 0) * sp + 160; }
    else d += (e.dataset.i != null ? +e.dataset.i : k++) * (+(e.dataset.st || STAG));
    e.style.setProperty('--dl', INSTANT ? '0ms' : Math.round(d) + 'ms');
    e.classList.add('in');
    if (e.dataset.count != null) countUp(e, d); else e.querySelectorAll('[data-count]:not([data-b])').forEach(x => countUp(x, d));
  });
  const s = S[+root.dataset.i], fn = s.run && s.run[b];
  if (fn) fn(api(root));
}
function api(root) {
  return {root, t: sched, tw: tween, ctl: c => (root._ctl = c), final: () => FINAL, q: s => root.querySelector(s), qa: s => [...root.querySelectorAll(s)],
    k: n => root.querySelector(`[data-k="${n}"]`), ks: n => [...root.querySelectorAll(`[data-k="${n}"]`)],
    on: (els, ms = 0, cls = 'on') => [].concat(els).forEach(e => e && sched(ms, () => e.classList.add(cls)))};
}
/* auto mode: when does each beat start? */
function timesFor(root, bs) {
  const s = S[+root.dataset.i], out = [];
  let t = 0;
  bs.forEach((b, k) => {
    if (k === 0) { out.push(0); return; }
    if (k === 1) t = 750 * tempo;
    else {
      const pb = bs[k - 1]; let n = 0, typ = 0, maxd = 0, st = STAG;
      root.querySelectorAll(`[data-b="${pb}"]`).forEach(e => {
        const d = +(e.dataset.d || 0);
        if (e.dataset.fx === 'type') typ = Math.max(typ, d) + (e._n || 0) * (+(e.dataset.sp || TYPE_SP)) + 160;
        else { if (e.dataset.i == null) n++; if (e.dataset.st) st = +e.dataset.st; maxd = Math.max(maxd, d); }
      });
      t += Math.max(700, (n - 1) * st + 650) * tempo + typ + maxd + ((s.len && s.len[pb]) || 0);
    }
    if (s.gap && s.gap[b]) t += s.gap[b] * tempo;
    out.push(t);
  });
  return out;
}
const busy = () => pend.length > 0 || tweens.size > 0;
function cancelAll() { if (stage._ctl && stage._ctl.stop) stage._ctl.stop(); runId++; pend.forEach(p => clearTimeout(p.id)); pend = []; tweens.forEach(t => { t.done = true; }); tweens.clear(); clearTimeout(advTimer); }
function checkIdle() { updateStatus(); if (busy()) return; clearTimeout(advTimer); if (adv) advTimer = setTimeout(() => { if (adv && !busy()) next(true); }, hold); }
function flush() {
  const items = pend.slice().sort((a, b) => a.due - b.due), t0 = performance.now();
  pend.forEach(p => clearTimeout(p.id)); pend = [];
  stage.classList.add('no-anim');
  [...tweens].forEach(t => t.finish());
  instantRun(() => items.forEach(it => sched(Math.max(0, it.due - t0), it.fn)));
  void stage.offsetWidth; stage.classList.remove('no-anim');
  checkIdle();
}
function go(i) {
  const oldW = (stage.querySelector('.prog') || {}).style?.width;
  cancelAll(); cur = i; beat = 0;
  build(i, stage);
  const pg = stage.querySelector('.prog');
  if (oldW && pg) { const w = pg.style.width; pg.style.width = oldW; void pg.offsetWidth; pg.style.width = w; }
  const bs = beatsOf(stage);
  if (mode === 'auto') { const ts = timesFor(stage, bs); bs.forEach((b, k) => sched(ts[k], () => { beat = Math.max(beat, b); revealBeat(stage, b); })); }
  else sched(0, () => revealBeat(stage, 0));
  setHash(); updateUI();
}
function show(i, upto = Infinity) {
  cancelAll(); cur = i; stage.classList.add('no-anim');
  build(i, stage);
  const bs = beatsOf(stage).filter(b => b <= upto);
  FINAL = true; try { bs.forEach(b => instantRun(() => sched(0, () => revealBeat(stage, b)))); } finally { FINAL = false; }
  beat = bs.length ? bs[bs.length - 1] : 0;
  void stage.offsetWidth; stage.classList.remove('no-anim');
  setHash(); updateUI(); checkIdle();
}
function next(fromAuto) {
  if (!fromAuto) stopAdv();
  if (busy()) { flush(); return; }
  const c = stage._ctl; if (c && c.next(fromAuto)) { updateStatus(); return; }   /* an interactive slide consumes the step first */
  if (mode === 'click') { const nb = beatsOf(stage).find(b => b > beat); if (nb != null) { beat = nb; revealBeat(stage, nb); checkIdle(); return; } }
  if (cur < S.length - 1) go(cur + 1); else stopAdv();
}
function prev() {
  stopAdv();
  const c = stage._ctl; if (c && c.prev()) return;
  if (mode === 'click') { const bs = beatsOf(stage).filter(b => b > 0 && b <= beat); if (bs.length) { show(cur, bs.length > 1 ? bs[bs.length - 2] : 0); return; } }
  if (cur > 0) show(cur - 1);
}
/* ---------- UI ---------- */
function setHash() { try { history.replaceState(null, '', `#slide=${cur + 1}`); } catch (e) { /* sandboxed */ } }
function updateStatus() {
  const ev = $('#event'); if (!ev) return;
  if (mode === 'click') { const bs = beatsOf(stage).filter(b => b > 0), k = bs.filter(b => b <= beat).length; ev.textContent = bs.length ? `Step ${k} / ${bs.length}` : ''; }
  else ev.textContent = busy() ? 'Animating… (→ completes)' : 'Ready';
}
function updateUI() {
  $('#position').textContent = `${String(cur + 1).padStart(2, '0')} / ${S.length}`;
  $('#play').classList.toggle('active', adv); $('#play').textContent = adv ? 'Ⅱ Pause' : '▶ Auto';
  updateStatus();
}
function stopAdv() { if (!adv) return; adv = false; clearTimeout(advTimer); updateUI(); }
function toggleAdv() { adv = !adv; updateUI(); if (adv) checkIdle(); else clearTimeout(advTimer); }
function setMode(v, replay = true) {
  if (v === 'click') mode = 'click'; else { mode = 'auto'; tempo = +(v.split(':')[1]) || 1; store('dlup:auto', v); }
  store('dlup:mode', v); $('#mode').value = v; if (replay) go(cur); else updateUI();
}
function resize() { const v = $('#viewport'), sc = Math.min(v.clientWidth / 1600, v.clientHeight / 900); stage.style.transform = `scale(${sc})`; stage.style.left = (v.clientWidth - 1600 * sc) / 2 + 'px'; stage.style.top = (v.clientHeight - 900 * sc) / 2 + 'px'; }
function openIndex() { stopAdv(); $('#index-list').innerHTML = S.map((s, i) => `<button class="${i === cur ? 'current' : ''}" data-slide="${i}"><b>${String(i + 1).padStart(2, '0')}</b>${esc(s.title)}</button>`).join(''); $('#index-dialog').showModal(); }
function openNotes() {
  stopAdv(); const s = S[cur];
  $('#notes-title').textContent = s.title;
  $('#notes-content').innerHTML = `<b>Speaker guide</b>\n${esc((s.points || []).join('\n'))}${s.extra ? `\n\n<b>About this animated version</b>\n${esc(s.extra)}` : ''}\n\n<b>Source material · ${s.on ? `slide ${s.on} of the original` : 'new slide'}</b>\n${esc(s.original || '')}\n\n<b>Sources and credits</b>\nText: rnn_lstm_complete_deck_1.pptx, material provided by the professor; every diagram was rebuilt as animated HTML. Numbers: computed for this deck with forward passes only (no training, no backward passes): hand-set toy RNN, LSTM and GRU cells with four interpretable units and dummy 6-feature word vectors; a randomly initialised tiny RNN; random recurrent matrices; dummy per-token losses; and PyTorch 2.15 modules (nn.RNN, nn.LSTM, nn.GRU) for parameter counts, tensor shapes, packing and timing on a 2-core CPU. The numpy toy cells were checked against PyTorch's own nn.LSTM, nn.GRU and nn.RNN loaded with the same weights (maximum difference about 1e-7). Images: the four video frames of the running golden retriever come from the professor's regularization deck of this course; the waveform, piano roll, sensor, DNA and time-series strips are synthetic (dummy data).\nLogos: Universidad Panamericana and Ingenierías UP · Posgrados, from the professor's material. Each brand belongs to its owner.\nUP brand guidelines: <a href="https://www.up.edu.mx/marca-institucional/marca/" target="_blank" rel="noopener">https://www.up.edu.mx/marca-institucional/marca/</a>${s.sources.map(u => `\n<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join('')}`;
  $('#notes-dialog').showModal();
}
function hint(t) { const h = $('#hint'); h.textContent = t; h.style.opacity = 1; setTimeout(() => { h.style.opacity = 0; }, 4000); }
async function full() { try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); } catch (e) { hint('Use your browser\'s full-screen option.'); } }

$('#next').onclick = () => next(); $('#prev').onclick = () => prev(); $('#replay').onclick = () => { stopAdv(); go(cur); };
$('#play').onclick = toggleAdv; $('#hold').onchange = e => { hold = +e.target.value; store('dlup:hold', e.target.value); if (adv) checkIdle(); };
$('#mode').onchange = e => setMode(e.target.value); $('#index').onclick = openIndex; $('#notes').onclick = openNotes; $('#full').onclick = full;
document.querySelectorAll('[data-close]').forEach(b => { b.onclick = () => $('#' + b.dataset.close).close(); });
$('#index-list').onclick = e => { const b = e.target.closest('[data-slide]'); if (b) { $('#index-dialog').close(); go(+b.dataset.slide); } };
$('#viewport').addEventListener('click', e => { if (window.getSelection().toString()) return; if (e.composedPath().some(n => n.matches && n.matches('[contenteditable],a,button,input,select,textarea,[data-int]'))) return; next(); });
let tx = null;
$('#viewport').addEventListener('touchstart', e => { tx = e.target.closest('[data-int]') ? null : e.touches[0].clientX; }, {passive: true});
$('#viewport').addEventListener('touchend', e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if (dx > 60) prev(); else if (dx < -60) next(); }, {passive: true});
stage.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.store; if (k) store('dlup:' + k, e.target.textContent); });
document.addEventListener('keydown', e => {
  if (document.querySelector('dialog[open]')) return;
  const tg = e.target, k = e.key;
  if (tg.isContentEditable || ['SELECT', 'INPUT', 'TEXTAREA'].includes(tg.tagName)) { if (k === 'Escape') tg.blur(); return; }
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (tg.tagName === 'BUTTON' && (k === ' ' || k === 'Enter')) return;
  if ([' ', 'ArrowRight', 'PageDown', 'Enter'].includes(k)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(k)) { e.preventDefault(); prev(); }
  else if (k === 'ArrowDown') { e.preventDefault(); stopAdv(); if (cur < S.length - 1) go(cur + 1); }
  else if (k === 'ArrowUp') { e.preventDefault(); stopAdv(); if (cur > 0) show(cur - 1); }
  else if (k === 'Home') { stopAdv(); go(0); }
  else if (k === 'End') { stopAdv(); go(S.length - 1); }
  else {
    const c = k.toLowerCase();
    if (c === 'r') { stopAdv(); go(cur); } else if (c === 'c') setMode(mode === 'click' ? (store('dlup:auto') || 'auto:1') : 'click');
    else if (c === 'a') toggleAdv(); else if (c === 'g') openIndex(); else if (c === 'n') openNotes(); else if (c === 'f') full();
  }
});
document.addEventListener('fullscreenchange', () => { document.body.classList.toggle('fs', !!document.fullscreenElement); setTimeout(resize, 60); });
let uiT = null;
document.addEventListener('mousemove', () => { if (!document.body.classList.contains('fs')) return; document.body.classList.add('show-ui'); clearTimeout(uiT); uiT = setTimeout(() => document.body.classList.remove('show-ui'), 2400); });
window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { if (document.hidden) stopAdv(); });
window.addEventListener('beforeprint', () => {
  const deck = $('#print-deck'); deck.innerHTML = '';
  FINAL = true;
  try { S.forEach((s, i) => { const p = document.createElement('div'); p.className = 'print-page no-anim'; deck.appendChild(p); build(i, p); beatsOf(p).forEach(b => instantRun(() => sched(0, () => revealBeat(p, b)))); }); } finally { FINAL = false; }
});
window.addEventListener('afterprint', () => { $('#print-deck').innerHTML = ''; });
(() => {
  const m = store('dlup:mode'); if (m && [...$('#mode').options].some(o => o.value === m)) setMode(m, false);
  const h = store('dlup:hold'); if (h) { hold = +h; $('#hold').value = h; }
  const q = new URLSearchParams(location.hash.slice(1)), start = Math.max(0, Math.min(S.length - 1, (+q.get('slide') || 1) - 1));
  resize(); go(start);
  setTimeout(() => { $('#hint').style.opacity = 0; }, 8500);
})();
